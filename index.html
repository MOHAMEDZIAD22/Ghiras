لك من خيره وخير ما صُنع له، وأعوذ بك من شره وشر ما صُنع له.",1,"رواه أبو داود والترمذي"],["عند خلع الثوب","بسم الله.",1,"رواه الترمذي"]]],["الخلاء",[["عند الدخول (بالرجل اليسرى)","بسم الله، اللهم إني أعوذ بك من الخُبُث والخبائث.",1,"متفق عليه"],["عند الخروج (بالرجل اليمنى)","غفرانك.",1,"رواه أبو داود والترمذي"]]],["الوضوء",[["قبل الوضوء","بسم الله.",1,"رواه أبو داود"],["بعد الوضوء","أشهد أن لا إله إلا الله وحده لا شريك له، وأشهد أن محمدًا عبده ورسوله.",1,"رواه مسلم"],["بعد الوضوء","اللهم اجعلني من التوابين، واجعلني من المتطهرين.",1,"رواه الترمذي"]]],["الخروج من المنزل والدخول",[["عند الخروج من المنزل","بسم الله، توكلت على الله، ولا حول ولا قوة إلا بالله.",1,"رواه أبو داود والترمذي"],["عند الخروج من المنزل","اللهم إني أعوذ بك أن أَضِلّ أو أُضَلّ، أو أَزِلّ أو أُزَلّ، أو أَظلِم أو أُظلَم، أو أَجهَل أو يُجهَل عليّ.",1,"رواه أبو داود"],["عند دخول المنزل","بسم الله. ثم يسلّم على أهله.",1,"إذا ذكر الله عند دخوله وعند طعامه قال الشيطان: لا مبيت لكم ولا عشاء — رواه مسلم"]]],["المسجد",[["عند الذهاب إلى المسجد","اللهم اجعل في قلبي نورًا، وفي لساني نورًا، وفي سمعي نورًا، وفي بصري نورًا، ومن فوقي نورًا، ومن تحتي نورًا، وعن يميني نورًا، وعن شمالي نورًا، ومن أمامي نورًا، ومن خلفي نورًا، واجعل في نفسي نورًا، وأعظم لي نورًا.",1,"متفق عليه"],["عند دخول المسجد (بالرجل اليمنى)","أعوذ بالله العظيم، وبوجهه الكريم، وسلطانه القديم، من الشيطان الرجيم.",1,"رواه أبو داود"],["عند دخول المسجد","بسم الله، والصلاة والسلام على رسول الله، اللهم افتح لي أبواب رحمتك.",1,"رواه مسلم وأبو داود"],["عند الخروج من المسجد (بالرجل اليسرى)","بسم الله، والصلاة والسلام على رسول الله، اللهم إني أسألك من فضلك.",1,"رواه مسلم وأبو داود"]]],["الأذان",[["عند سماع الأذان","يقول مثل ما يقول المؤذن، إلا في «حَيَّ عَلَى الصَّلَاةِ» و«حَيَّ عَلَى الفَلَاحِ» فيقول: لا حول ولا قوة إلا بالله.",1,"متفق عليه"],["بعد الأذان","يصلي على النبي ﷺ ثم يقول: اللهم رب هذه الدعوة التامة، والصلاة القائمة، آتِ محمدًا الوسيلة والفضيلة، وابعثه مقامًا محمودًا الذي وعدته.",1,"من قالها حلّت له شفاعتي — رواه البخاري"],["بين الأذان والإقامة","ادعُ بما شئت، فالدعاء بين الأذان والإقامة لا يُرد.",0,"رواه أبو داود والترمذي"]]],["الصلاة: الاستفتاح",[["قبل القراءة — يختار صيغة منها","اللهم باعِد بيني وبين خطاياي كما باعدت بين المشرق والمغرب، اللهم نقّني من خطاياي كما يُنقّى الثوب الأبيض من الدنس، اللهم اغسلني من خطاياي بالثلج والماء والبرد.",1,"متفق عليه"],["صيغة أخرى","سبحانك اللهم وبحمدك، وتبارك اسمك، وتعالى جدّك، ولا إله غيرك.",1,"رواه أبو داود والترمذي"],["صيغة أخرى","وجّهت وجهي للذي فطر السماوات والأرض حنيفًا وما أنا من المشركين، إن صلاتي ونسكي ومحياي ومماتي لله رب العالمين، لا شريك له، وبذلك أُمرت وأنا من المسلمين، اللهم أنت الملك لا إله إلا أنت، أنت ربي وأنا عبدك، ظلمت نفسي، واعترفت بذنبي، فاغفر لي ذنوبي جميعًا، إنه لا يغفر الذنوب إلا أنت، واهدني لأحسن الأخلاق، لا يهدي لأحسنها إلا أنت، واصرف عني سيئها، لا يصرف عني سيئها إلا أنت، لبيك وسعديك، والخير كله في يديك، والشر ليس إليك، أنا بك وإليك، تباركت وتعاليت، أستغفرك وأتوب إليك.",1,"رواه مسلم"],["صيغة أخرى","الله أكبر كبيرًا، والحمد لله كثيرًا، وسبحان الله بكرةً وأصيلًا.",1,"رواه مسلم"],["صيغة أخرى","الحمد لله حمدًا كثيرًا طيبًا مباركًا فيه.",1,"رأيت اثني عشر ملكًا يبتدرونها — رواه مسلم"],["في صلاة الليل","اللهم ربّ جبرائيل وميكائيل وإسرافيل، فاطر السماوات والأرض، عالم الغيب والشهادة، أنت تحكم بين عبادك فيما كانوا فيه يختلفون، اهدني لما اختُلف فيه من الحق بإذنك، إنك تهدي من تشاء إلى صراط مستقيم.",1,"رواه مسلم"],["الاستعاذة قبل الفاتحة","أعوذ بالله من الشيطان الرجيم.",1,""]]],["الركوع والرفع منه",[["في الركوع","سبحان ربي العظيم.",3,"رواه مسلم وأصحاب السنن"],["في الركوع","سبحانك اللهم ربنا وبحمدك، اللهم اغفر لي.",1,"متفق عليه"],["في الركوع","سُبّوحٌ قُدّوسٌ، ربُّ الملائكة والروح.",1,"رواه مسلم"],["في الركوع","اللهم لك ركعت، وبك آمنت، ولك أسلمت، خشع لك سمعي، وبصري، ومخّي، وعظمي، وعصبي.",1,"رواه مسلم"],["في الركوع","سبحان ذي الجبروت، والملكوت، والكبرياء، والعظمة.",1,"رواه أبو داود والنسائي"],["عند الرفع من الركوع","سمع الله لمن حمده.",1,"متفق عليه"],["بعد الاعتدال","ربنا ولك الحمد، حمدًا كثيرًا طيبًا مباركًا فيه.",1,"رواه البخاري"],["بعد الاعتدال","ملء السماوات، وملء الأرض، وما بينهما، وملء ما شئت من شيء بعد، أهل الثناء والمجد، أحقّ ما قال العبد، وكلنا لك عبد، اللهم لا مانع لما أعطيت، ولا معطي لما منعت، ولا ينفع ذا الجدّ منك الجدّ.",1,"رواه مسلم"]]],["السجود",[["في السجود","سبحان ربي الأعلى.",3,"رواه مسلم وأصحاب السنن"],["في السجود","سبحانك اللهم ربنا وبحمدك، اللهم اغفر لي.",1,"متفق عليه"],["في السجود","سُبّوحٌ قُدّوسٌ، ربُّ الملائكة والروح.",1,"رواه مسلم"],["في السجود","اللهم لك سجدت، وبك آمنت، ولك أسلمت، سجد وجهي للذي خلقه وصوّره، وشقّ سمعه وبصره، تبارك الله أحسن الخالقين.",1,"رواه مسلم"],["في السجود","اللهم اغفر لي ذنبي كله، دِقّه وجِلّه، وأوّله وآخره، وعلانيته وسرّه.",1,"رواه مسلم"],["في السجود","سبحان ذي الجبروت، والملكوت، والكبرياء، والعظمة.",1,"رواه أبو داود والنسائي"],["في السجود","اللهم إني أعوذ برضاك من سخطك، وبمعافاتك من عقوبتك، وأعوذ بك منك، لا أُحصي ثناءً عليك، أنت كما أثنيت على نفسك.",1,"رواه مسلم"],["وأكثِر فيه من الدعاء","أقرب ما يكون العبد من ربه وهو ساجد، فأكثروا الدعاء.",0,"رواه مسلم"],["سجود التلاوة","سجد وجهي للذي خلقه، وشقّ سمعه وبصره، بحوله وقوته.",1,"رواه الترمذي وأبو داود"],["سجود التلاوة","اللهم اكتب لي بها عندك أجرًا، وضع عني بها وزرًا، واجعلها لي عندك ذخرًا، وتقبّلها مني كما تقبّلتها من عبدك داود.",1,"رواه الترمذي"]]],["التشهد والتسليم",[["التشهد","التحيات لله، والصلوات والطيبات، السلام عليك أيها النبي ورحمة الله وبركاته، السلام علينا وعلى عباد الله الصالحين، أشهد أن لا إله إلا الله، وأشهد أن محمدًا عبده ورسوله.",1,"متفق عليه"],["الصلاة الإبراهيمية","اللهم صلِّ على محمد وعلى آل محمد، كما صليت على إبراهيم وعلى آل إبراهيم، إنك حميد مجيد، اللهم بارك على محمد وعلى آل محمد، كما باركت على إبراهيم وعلى آل إبراهيم، إنك حميد مجيد.",1,"رواه البخاري"],["قبل السلام","اللهم إني أعوذ بك من عذاب جهنم، ومن عذاب القبر، ومن فتنة المحيا والممات، ومن شر فتنة المسيح الدجال.",1,"أمر به النبي ﷺ — رواه مسلم"],["قبل السلام","اللهم إني ظلمت نفسي ظلمًا كثيرًا، ولا يغفر الذنوب إلا أنت، فاغفر لي مغفرةً من عندك، وارحمني، إنك أنت الغفور الرحيم.",1,"علّمه النبي ﷺ أبا بكر — متفق عليه"],["قبل السلام","اللهم اغفر لي ما قدّمت وما أخّرت، وما أسررت وما أعلنت، وما أسرفت، وما أنت أعلم به مني، أنت المقدّم وأنت المؤخّر، لا إله إلا أنت.",1,"رواه مسلم"],["قبل السلام","اللهم إني أعوذ بك من البخل، وأعوذ بك من الجبن، وأعوذ بك من أن أُردّ إلى أرذل العمر، وأعوذ بك من فتنة الدنيا، وأعوذ بك من عذاب القبر.",1,"رواه البخاري"],["قبل السلام","اللهم إني أسألك الجنة، وأعوذ بك من النار.",1,"رواه أبو داود وابن ماجه"],["التسليم","السلام عليكم ورحمة الله (عن اليمين)، السلام عليكم ورحمة الله (عن اليسار).",1,"رواه مسلم وأبو داود"]]],["بعد الصلاة",[["","أستغفر الله، أستغفر الله، أستغفر الله. اللهم أنت السلام ومنك السلام، تباركت يا ذا الجلال والإكرام.",1,"رواه مسلم"],["","لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير، اللهم لا مانع لما أعطيت، ولا معطي لما منعت، ولا ينفع ذا الجدّ منك الجدّ.",1,"متفق عليه"],["","لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير، لا حول ولا قوة إلا بالله، لا إله إلا الله، ولا نعبد إلا إياه، له النعمة وله الفضل وله الثناء الحسن، لا إله إلا الله مخلصين له الدين ولو كره الكافرون.",1,"رواه مسلم"],["","سبحان الله.",33,""],["","الحمد لله.",33,""],["","الله أكبر.",33,""],["تمام المئة","لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير.",1,"غُفرت خطاياه وإن كانت مثل زبد البحر — رواه مسلم"],["آية الكرسي",e,1,"لم يمنعه من دخول الجنة إلا أن يموت — رواه النسائي",1],["المعوذات","قراءة: قل هو الله أحد، وقل أعوذ برب الفلق، وقل أعوذ برب الناس.",1,"بعد كل صلاة — رواه أبو داود"],["","اللهم أعني على ذكرك، وشكرك، وحسن عبادتك.",1,"رواه أبو داود"],["","ربِّ قِني عذابك يوم تبعث عبادك.",1,"رواه مسلم"],["بعد الفجر والمغرب","لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، يحيي ويميت، وهو على كل شيء قدير.",10,"رواه الترمذي وأحمد"],["بعد الفجر","اللهم إني أسألك علمًا نافعًا، ورزقًا طيبًا، وعملًا متقبّلًا.",1,"رواه ابن ماجه"]]],["الوتر",[["دعاء القنوت","اللهم اهدني فيمن هديت، وعافني فيمن عافيت، وتولّني فيمن تولّيت، وبارك لي فيما أعطيت، وقني شرّ ما قضيت، فإنك تقضي ولا يُقضى عليك، وإنه لا يذلّ من واليت، تباركت ربنا وتعاليت.",1,'علّمه النبي ﷺ الحسن بن علي — رواه أبو داود والترمذي · <a class="inl" href="#duas" onclick="try{sessionStorage.setItem(\'dseg\',\'k\')}catch(e){}">دعاء القنوت الجامع ‹</a>'],["بعد السلام من الوتر","سبحان الملك القدّوس.",3,"يرفع صوته بالثالثة — رواه النسائي"]]],["الطعام والشراب",[["قبل الطعام","بسم الله.",1,"رواه أبو داود والترمذي"],["إذا نسي التسمية","بسم الله في أوله وآخره.",1,"رواه أبو داود والترمذي"],["بعد الطعام","الحمد لله الذي أطعمني هذا ورزقنيه من غير حول مني ولا قوة.",1,"غُفر له ما تقدم من ذنبه — رواه الترمذي"],["دعاء الضيف لصاحب الطعام","اللهم بارك لهم فيما رزقتهم، واغفر لهم وارحمهم.",1,"رواه مسلم"],["عند إفطار الصائم","ذهب الظمأ، وابتلّت العروق، وثبت الأجر إن شاء الله.",1,"رواه أبو داود"]]],["النوم",[["","باسمك اللهم أموت وأحيا.",1,"رواه البخاري"],["","باسمك ربي وضعت جنبي، وبك أرفعه، فإن أمسكت نفسي فارحمها، وإن أرسلتها فاحفظها بما تحفظ به عبادك الصالحين.",1,"متفق عليه"],["","اللهم قني عذابك يوم تبعث عبادك.",3,"رواه أبو داود"],["المعوذات","يجمع كفيه وينفث فيهما ويقرأ الإخلاص والفلق والناس، ثم يمسح بهما ما استطاع من جسده.",3,"رواه البخاري"],["آية الكرسي",e,1,"لا يزال عليك من الله حافظ ولا يقربك شيطان حتى تصبح — رواه البخاري",1],["آخر آيتين من سورة البقرة",d,1,"من قرأهما في ليلة كفتاه — متفق عليه",1],["","سبحان الله (33)، والحمد لله (33)، والله أكبر (34).",1,"متفق عليه"],["آخر ما يقول","اللهم أسلمت نفسي إليك، وفوضت أمري إليك، ووجهت وجهي إليك، وألجأت ظهري إليك، رغبةً ورهبةً إليك، لا ملجأ ولا منجا منك إلا إليك، آمنت بكتابك الذي أنزلت، وبنبيك الذي أرسلت.",1,"متفق عليه"],["إذا رأى رؤيا يكرهها","ينفث عن يساره ثلاثًا، ويستعيذ بالله من الشيطان ومن شر ما رأى، ولا يحدّث بها أحدًا، ويتحوّل عن جنبه.",0,"رواه مسلم"]]],["السفر",[["دعاء السفر","الله أكبر، الله أكبر، الله أكبر، سبحان الذي سخّر لنا هذا وما كنا له مقرنين، وإنا إلى ربنا لمنقلبون، اللهم إنا نسألك في سفرنا هذا البرّ والتقوى، ومن العمل ما ترضى، اللهم هوّن علينا سفرنا هذا واطوِ عنا بُعده، اللهم أنت الصاحب في السفر، والخليفة في الأهل، اللهم إني أعوذ بك من وعثاء السفر، وكآبة المنظر، وسوء المنقلب في المال والأهل.",1,"رواه مسلم"],["عند الرجوع من السفر","يقول دعاء السفر ويزيد: آيبون، تائبون، عابدون، لربنا حامدون.",1,"رواه مسلم"],["إذا نزل منزلًا","أعوذ بكلمات الله التامات من شر ما خلق.",1,"لم يضره شيء حتى يرتحل — رواه مسلم"],["توديع المسافر","أستودع الله دينك، وأمانتك، وخواتيم عملك.",1,"رواه الترمذي"]]],["الطقس",[["عند هبوب الريح","اللهم إني أسألك خيرها، وأعوذ بك من شرها.",1,"رواه أبو داود"],["عند نزول المطر","اللهم صيّبًا نافعًا.",1,"رواه البخاري"],["بعد نزول المطر","مُطرنا بفضل الله ورحمته.",1,"متفق عليه"],["عند اشتداد المطر والخوف من ضرره","اللهم حوالينا ولا علينا، اللهم على الآكام والظِّراب، وبطون الأودية، ومنابت الشجر.",1,"متفق عليه"],["عند الريح الشديدة","اللهم إني أسألك خيرها، وخير ما فيها، وخير ما أُرسلت به، وأعوذ بك من شرها، وشر ما فيها، وشر ما أُرسلت به.",1,"رواه مسلم"],["عند سماع الرعد","سبحان الذي يسبّح الرعد بحمده والملائكة من خيفته.",1,"كان عبد الله بن الزبير رضي الله عنه يقوله إذا سمع الرعد — رواه مالك في الموطأ، وإسناده صحيح موقوفًا"],["عند شدة الحر أو البرد","اللهم أجرني من النار.",3,"«مَنِ اسْتَجَارَ مِنَ النَّارِ ثَلَاثَ مَرَّاتٍ قَالَتِ النَّارُ: اللَّهُمَّ أَجِرْهُ مِنَ النَّارِ» — رواه الترمذي — صحيح. وأخبر ﷺ أن شدة الحر من فيح جهنم، وشدة البرد من زمهريرها (متفق عليه)، فتذكّر بها النار"],["عند الزلازل والآيات المخيفة","الفزع إلى ذكر الله ودعائه واستغفاره، والصدقة. قال ﷺ عن الآيات التي يخوّف الله بها عباده: «فَإِذَا رَأَيْتُمْ شَيْئًا مِنْ ذَلِكَ فَافْزَعُوا إِلَى ذِكْرِهِ وَدُعَائِهِ وَاسْتِغْفَارِهِ».",0,"متفق عليه"]]],["المرض والمصيبة",[["عند زيارة المريض","لا بأس، طَهورٌ إن شاء الله.",1,"رواه البخاري"],["الدعاء للمريض","أسأل الله العظيم، رب العرش العظيم، أن يشفيك.",7,"رواه أبو داود والترمذي"],["عند الألم في الجسد","يضع يده على موضع الألم ويقول: بسم الله (ثلاثًا)، ثم: أعوذ بالله وقدرته من شر ما أجد وأحاذر (سبع مرات).",1,"رواه مسلم"],["عند المصيبة","إنا لله وإنا إليه راجعون، اللهم أْجُرني في مصيبتي، وأخلف لي خيرًا منها.",1,"رواه مسلم"],["عند الغضب","أعوذ بالله من الشيطان الرجيم.",1,"متفق عليه"],["عند رؤية مُبتلى (سرًّا)","الحمد لله الذي عافاني مما ابتلاك به، وفضّلني على كثير ممن خلق تفضيلًا.",1,"رواه الترمذي"]]],["الاستخارة",[["دعاء الاستخارة (بعد ركعتين)","اللهم إني أستخيرك بعلمك، وأستقدرك بقدرتك، وأسألك من فضلك العظيم، فإنك تقدر ولا أقدر، وتعلم ولا أعلم، وأنت علّام الغيوب، اللهم إن كنت تعلم أن هذا الأمر (ويسمّي حاجته) خيرٌ لي في ديني ومعاشي وعاقبة أمري فاقدُره لي، ويسّره لي، ثم بارك لي فيه، وإن كنت تعلم أن هذا الأمر شرٌّ لي في ديني ومعاشي وعاقبة أمري فاصرفه عني، واصرفني عنه، واقدُر لي الخير حيث كان، ثم أرضني به.",1,"رواه البخاري"]]],["مع الناس",[["إذا عطس","العاطس: الحمد لله. ومن سمعه: يرحمك الله. فيرد العاطس: يهديكم الله ويصلح بالكم.",1,"رواه البخاري"],["لمن صنع إليك معروفًا","جزاك الله خيرًا.",1,"فقد أبلغ في الثناء — رواه الترمذي"],["التهنئة بالزواج","بارك الله لك، وبارك عليك، وجمع بينكما في خير.",1,"رواه أبو داود والترمذي"],["عند رؤية الهلال","اللهم أهِلّه علينا باليُمن والإيمان، والسلامة والإسلام، ربي وربك الله.",1,"رواه الترمذي"],["عند زيارة القبور","السلام عليكم أهل الديار من المؤمنين والمسلمين، وإنا إن شاء الله بكم لاحقون، نسأل الله لنا ولكم العافية.",1,"رواه مسلم"],["الخوف من الشرك","اللهم إني أعوذ بك أن أشرك بك وأنا أعلم، وأستغفرك لما لا أعلم.",1,"رواه أحمد"],["عند الوسوسة","أعوذ بالله من الشيطان الرجيم، آمنت بالله ورسله.",1,"رواه مسلم"]]],["أذكار جامعة",[["","سبحان الله وبحمده، سبحان الله العظيم.",10,"كلمتان خفيفتان على اللسان ثقيلتان في الميزان — متفق عليه"],["","لا حول ولا قوة إلا بالله.",10,"كنز من كنوز الجنة — متفق عليه"],["","سبحان الله، والحمد لله، ولا إله إلا الله، والله أكبر.",10,"أحب الكلام إلى الله — رواه مسلم"],["دعوة ذي النون","لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ",3,"لم يدعُ بها مسلم في شيء قط إلا استجاب الله له — رواه الترمذي",1]]],["بين السجدتين",[["بين السجدتين","رب اغفر لي، رب اغفر لي.",1,"رواه أبو داود والنسائي وابن ماجه"],["بين السجدتين — صيغة أخرى","اللهم اغفر لي، وارحمني، واهدني، واجبرني، وعافني، وارزقني، وارفعني.",1,"رواه أبو داود والترمذي وابن ماجه"]]],["أوراد السلف",[["أبو هريرة رضي الله عنه","كان يسبّح كل يوم اثنتي عشرة ألف تسبيحة، ويقول: «أُسَبِّحُ بِقَدْرِ ذَنْبِي».",0,"ذكره الذهبي في سير أعلام النبلاء، وأبو نعيم في الحلية"],["عثمان بن عفان رضي الله عنه","كان يُحيي الليل، وربما ختم القرآن كله في ركعة واحدة يوتر بها.",0,"رواه ابن سعد في الطبقات، وذكره الذهبي في السير"],["سعيد بن المسيّب — سيد التابعين","ما فاتته التكبيرة الأولى مع الإمام خمسين سنة، وكان يقول: ما أذّن المؤذن منذ ثلاثين سنة إلا وأنا في المسجد.",0,"سير أعلام النبلاء"],["الأسود بن يزيد النخعي — تابعي","كان يختم القرآن في رمضان في كل ليلتين، وفي غير رمضان في كل ست ليالٍ.",0,"سير أعلام النبلاء"],["قتادة السدوسي — تابعي","كان يختم القرآن في كل سبع، فإذا جاء رمضان ختم في كل ثلاث، فإذا جاء العشر الأواخر ختم في كل ليلة.",0,"سير أعلام النبلاء، وحلية الأولياء"],["سعيد بن جبير — تابعي","كان يختم القرآن في كل ليلتين.",0,"سير أعلام النبلاء"],["خالد بن معدان — تابعي","كان يسبّح كل يوم أربعين ألف تسبيحة، سوى ما يقرأ من القرآن.",0,"سير أعلام النبلاء"],["الإمام الشافعي","قسّم الليل ثلاثة أجزاء: الثلث الأول يكتب العلم، والثاني يصلي، والثالث ينام. وكان يختم القرآن في رمضان ستين ختمة، كلها في الصلاة.",0,"رواه تلميذه الربيع بن سليمان — سير أعلام النبلاء"],["الإمام أحمد بن حنبل","كان يصلي في اليوم والليلة ثلاثمئة ركعة، فلما أضعفته السياط في المحنة صار يصلي مئة وخمسين ركعة، وقد قارب الثمانين.",0,"رواه ابنه عبد الله — سير أعلام النبلاء"],["الإمام البخاري","كان في رمضان يختم القرآن بالنهار كل يوم ختمة، ويقوم بعد التراويح فيختم كل ثلاث ليالٍ.",0,"سير أعلام النبلاء"],["شيخ الإسلام ابن تيمية","قال ابن القيم: حضرته مرة صلى الفجر، ثم جلس يذكر الله إلى قريب من انتصاف النهار، ثم التفت إليّ وقال: «هَذِهِ غَدْوَتِي، وَلَوْ لَمْ أَتَغَدَّ هَذَا الغَدَاءَ سَقَطَتْ قُوَّتِي».",0,"ابن القيم في الوابل الصيب"],["ورد كان يوصي به ابن تيمية","«مَنْ وَاظَبَ عَلَى: يَا حَيُّ يَا قَيُّومُ، لَا إِلَهَ إِلَّا أَنْتَ، أَرْبَعِينَ مَرَّةً كُلَّ يَوْمٍ بَيْنَ سُنَّةِ الفَجْرِ وَصَلَاةِ الفَجْرِ، حَصَلَتْ لَهُ حَيَاةُ القَلْبِ».",0,"نقله ابن القيم عن شيخه في مدارج السالكين"],["فائدة: خذ منهم الهمّة، والزم السنة","قال النبي ﷺ لعبد الله بن عمرو: «اقْرَأِ القُرْآنَ فِي شَهْرٍ»، حتى قال: «فَاقْرَأْهُ فِي سَبْعٍ وَلَا تَزِدْ عَلَى ذَلِكَ» (متفق عليه)، وقال: «لَا يَفْقَهُ مَنْ قَرَأَهُ فِي أَقَلَّ مِنْ ثَلَاثٍ» (رواه أبو داود والترمذي). وقال: «أَحَبُّ الأَعْمَالِ إِلَى اللَّهِ أَدْوَمُهَا وَإِنْ قَلَّ» (متفق عليه). فابدأ بورد قليل تداوم عليه، ثم زِد.",0,""]]],["في العمل",[["فضل العمل","«مَا أَكَلَ أَحَدٌ طَعَامًا قَطُّ خَيْرًا مِنْ أَنْ يَأْكُلَ مِنْ عَمَلِ يَدِهِ، وَإِنَّ نَبِيَّ اللَّهِ دَاوُدَ كَانَ يَأْكُلُ مِنْ عَمَلِ يَدِهِ».",0,"رواه البخاري"],["الاستغفار","أستغفر الله وأتوب إليه.",100,"«إِنِّي لَأَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ فِي اليَوْمِ أَكْثَرَ مِنْ سَبْعِينَ مَرَّةً» — رواه البخاري"],["","سبحان الله وبحمده.",100,"حُطّت خطاياه وإن كانت مثل زبد البحر — متفق عليه"],["","لا حول ولا قوة إلا بالله.",33,"كنز من كنوز الجنة — متفق عليه"],["","اللهم صلِّ وسلّم على نبينا محمد.",10,"من صلى عليّ صلاة صلى الله عليه بها عشرًا — رواه مسلم"],["دعاء الرزق","اللهم اكفني بحلالك عن حرامك، وأغنني بفضلك عمّن سواك.",1,"رواه الترمذي — حسن"],["","اللهم إني أسألك علمًا نافعًا، ورزقًا طيبًا، وعملًا متقبّلًا.",1,"رواه ابن ماجه"],["عند صعوبة العمل","اللهم لا سهل إلا ما جعلته سهلًا، وأنت تجعل الحَزْن إذا شئت سهلًا.",1,"رواه ابن حبان — صحيح"],["عند الضغط والهم","اللهم إني أعوذ بك من الهمّ والحزن، والعجز والكسل، والبخل والجبن، وضَلَع الدَّين وغلبة الرجال.",1,"رواه البخاري"],["عند الغضب","أعوذ بالله من الشيطان الرجيم.",1,"«لَوْ قَالَهَا لَذَهَبَ عَنْهُ مَا يَجِدُ» — متفق عليه"],["كفّارة المجلس","سبحانك اللهم وبحمدك، أشهد أن لا إله إلا أنت، أستغفرك وأتوب إليك.",1,"تقال عند القيام من المجلس — رواه الترمذي — صحيح"],["الإتقان","«إِنَّ اللَّهَ يُحِبُّ إِذَا عَمِلَ أَحَدُكُمْ عَمَلًا أَنْ يُتْقِنَهُ».",0,"رواه أبو يعلى والطبراني — حسن"]]]],h=[["للدراسة والعلم",[["رَبِّ زِدْنِي عِلْمًا",3,"سورة طه",1],["رَبِّ اشْرَحْ لِي صَدْرِي ۝ وَيَسِّرْ لِي أَمْرِي ۝ وَاحْلُلْ عُقْدَةً مِّن لِّسَانِي ۝ يَفْقَهُوا قَوْلِي",1,"دعاء موسى عليه السلام — سورة طه",1],["اللهم انفعني بما علمتني، وعلمني ما ينفعني، وزدني علمًا.",1,"رواه الترمذي وابن ماجه"],["اللهم لا سهل إلا ما جعلته سهلًا، وأنت تجعل الحزن إذا شئت سهلًا.",1,"رواه ابن حبان — قبل الامتحان أو أي أمر صعب"]]],["للرزق والعمل",[["اللهم اكفني بحلالك عن حرامك، وأغنني بفضلك عمن سواك.",1,"رواه الترمذي"],["رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ",1,"دعاء موسى عليه السلام — سورة القصص",1],["اللهم إني أسألك علمًا نافعًا، ورزقًا طيبًا، وعملًا متقبلًا.",1,"رواه ابن ماجه"]]],["للهم والكرب",[["اللهم إني عبدك، ابن عبدك، ابن أمتك، ناصيتي بيدك، ماضٍ فيّ حكمك، عدلٌ فيّ قضاؤك، أسألك بكل اسم هو لك، سميت به نفسك، أو أنزلته في كتابك، أو علمته أحدًا من خلقك، أو استأثرت به في علم الغيب عندك، أن تجعل القرآن ربيع قلبي، ونور صدري، وجلاء حزني، وذهاب همي.",1,"رواه أحمد"],["اللهم رحمتك أرجو، فلا تكلني إلى نفسي طرفة عين، وأصلح لي شأني كله، لا إله إلا أنت.",1,"دعاء المكروب — رواه أبو داود"],["حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ",7,"سورة آل عمران",1]]],["للثبات وحفظ القرآن",[["يا مقلب القلوب ثبت قلبي على دينك.",3,"كان أكثر دعاء النبي ﷺ — رواه الترمذي"],["رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ",1,"سورة آل عمران",1],["اللهم أعني على ذكرك، وشكرك، وحسن عبادتك.",1,"أوصى به النبي ﷺ معاذًا بعد كل صلاة — رواه أبو داود"]]],["للوالدين",[["رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا",3,"سورة الإسراء",1],["رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ",1,"دعاء إبراهيم عليه السلام — سورة إبراهيم",1]]],["للسفر والركوب",[["سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ ۝ وَإِنَّا إِلَىٰ رَبِّنَا لَمُنقَلِبُونَ",1,"عند ركوب السيارة — سورة الزخرف",1]]]],m=[["هكذا كان ﷺ في يومه",[["كان يذكر الله على كل أحيانه","كان النبي ﷺ يذكر الله على كل أحيانه.",0,"عن عائشة رضي الله عنها — رواه مسلم"],["كان يستغفر كل يوم","والله إني لأستغفر الله وأتوب إليه في اليوم أكثر من سبعين مرة.",70,"رواه البخاري"],["في المجلس الواحد","رب اغفر لي وتب عليّ، إنك أنت التواب الرحيم.",100,"قال ابن عمر: كنا نعدّ له في المجلس الواحد مئة مرة — رواه أبو داود والترمذي"],["كان أكثر دعائه","اللهم ربنا آتنا في الدنيا حسنة، وفي الآخرة حسنة، وقنا عذاب النار.",3,"عن أنس — رواه البخاري"],["كان يُكثر أن يقول","اللهم إني أعوذ بك من الهم والحزن، والعجز والكسل، والبخل والجبن، وضَلَع الدَّين وغلبة الرجال.",1,"قال أنس: كنت أسمعه يُكثر أن يقول — رواه البخاري"],["إذا رأى ما يحب","الحمد لله الذي بنعمته تتم الصالحات.",1,"رواه ابن ماجه"],["إذا رأى ما يكره","الحمد لله على كل حال.",1,"رواه ابن ماجه"],["عند الكرب","لا إله إلا الله العظيم الحليم، لا إله إلا الله رب العرش العظيم، لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم.",1,"متفق عليه"],["إذا نزل المطر","اللهم صيّبًا نافعًا.",1,"رواه البخاري"],["إذا قام من المجلس","سبحانك اللهم وبحمدك، أشهد أن لا إله إلا أنت، أستغفرك وأتوب إليك.",1,"كفارة المجلس — رواه أبو داود والترمذي"],["قبل النوم","كان ﷺ إذا أوى إلى فراشه جمع كفيه ثم نفث فيهما، فقرأ فيهما: قل هو الله أحد، وقل أعوذ برب الفلق، وقل أعوذ برب الناس، ثم يمسح بهما ما استطاع من جسده، يفعل ذلك ثلاث مرات.",3,"عن عائشة — رواه البخاري"]]]],y=[["معاذ بن جبل رضي الله عنه","ما عمل آدمي عملًا أنجى له من عذاب الله من ذكر الله. قالوا: يا أبا عبد الرحمن، ولا الجهاد في سبيل الله؟ قال: ولا، إلا أن يضرب بسيفه حتى ينقطع؛ لأن الله تعالى يقول في كتابه: ﴿وَلَذِكْرُ اللَّهِ أَكْبَرُ﴾","الذهبي، «سير أعلام النبلاء»، مؤسسة الرسالة، ١/٤٥٥"],["عمر بن الخطاب رضي الله عنه","عليكم بذكر الله فإنه شفاء، وإياكم وذكر الناس فإنه داء.","ابن أبي الدنيا، «الصمت»، تحقيق أبي إسحاق الحويني، ص ١٣٣ (رقم ٢٠٣)"],["ابن عباس رضي الله عنهما","الشيطان جاثم على قلب ابن آدم، فإذا سها وغفل وسوس، فإذا ذكر الله تعالى خنس.","نقله ابن القيم، «الوابل الصيب»، تحقيق محمد عبد الرحمن عوض، دار الكتاب العربي، ص ٥٦"],["أبو الدرداء رضي الله عنه","لكل شيء جلاء، وإن جلاء القلوب ذكر الله عز وجل.","نقله ابن القيم، «الوابل الصيب»، تحقيق محمد عبد الرحمن عوض، دار الكتاب العربي، ص ٦٠"],["أبو الدرداء رضي الله عنه","الذين لا تزال ألسنتهم رطبة من ذكر الله عز وجل يدخل أحدهم الجنة وهو يضحك.","رواه ابن أبي الدنيا، ونقله ابن القيم، «الوابل الصيب»، تحقيق محمد عبد الرحمن عوض، دار الكتاب العربي، ص ١٠٢"],["الحسن البصري","تفقدوا الحلاوة في ثلاث: في الصلاة، وفي القرآن، وفي الذكر، فإن وجدتموها فامضوا وأبش ح"],["بعد الصلاة","قراءه: قل هو الله احد","أمر النبي ﷺ عقبة بن عامر أن يقرأ بالمعوذات دبر كل صلاة — رواه أبو داود"],["بعد الصلاة","اللهم اعني علي ذكرك","قال ﷺ لمعاذ: «وَاللَّهِ إِنِّي لَأُحِبُّكَ… لَا تَدَعَنَّ فِي دُبُرِ كُلِّ صَلَاةٍ أَنْ تَقُولَ…» — رواه أبو داود"],["بعد الصلاة","@بعد الفجر والمغرب","«كُتِبَ لَهُ بِكُلِّ وَاحِدَةٍ عَشْرُ حَسَنَاتٍ، وَمُحِيَتْ عَنْهُ عَشْرُ سَيِّئَاتٍ، وَرُفِعَ لَهُ عَشْرُ دَرَجَاتٍ، وَكَانَتْ حِرْزًا مِنَ الشَّيْطَانِ» — رواه أحمد والترمذي"],["الطعام والشراب","الحمد لله الذي اطعمني","«غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ» — رواه الترمذي — حسن"],["النوم","@آية الكرسي","«لَنْ يَزَالَ عَلَيْكَ مِنَ اللَّهِ حَافِظٌ، وَلَا يَقْرَبُكَ شَيْطَانٌ حَتَّى تُصْبِحَ» — رواه البخاري"],["النوم","سبحان الله (33)","«فَهُوَ خَيْرٌ لَكُمَا مِنْ خَادِمٍ» — متفق عليه"],["النوم","اللهم اسلمت نفسي","«فَإِنْ مُتَّ مِنْ لَيْلَتِكَ مُتَّ عَلَى الفِطْرَةِ» — متفق عليه"],["النوم","يجمع كفيه","كان النبي ﷺ يفعله كل ليلة — رواه البخاري"],["السفر","اعوذ بكلمات الله التامات","«لَمْ يَضُرَّهُ شَيْءٌ حَتَّى يَرْتَحِلَ مِنْ مَنْزِلِهِ ذَلِكَ» — رواه مسلم"],["المرض والمصيبة","اسال الله العظيم","«مَا مِنْ مُسْلِمٍ يَعُودُ مَرِيضًا لَمْ يَحْضُرْ أَجَلُهُ فَيَقُولُهَا سَبْعَ مَرَّاتٍ إِلَّا عَافَاهُ اللَّهُ» — رواه أبو داود والترمذي"],["المرض والمصيبة","انا لله وانا اليه راجعون","«إِلَّا أَجَرَهُ اللَّهُ فِي مُصِيبَتِهِ، وَأَخْلَفَ لَهُ خَيْرًا مِنْهَا» — رواه مسلم"],["المرض والمصيبة","اعوذ بالله من الشيطان الرجيم","«لَوْ قَالَهَا لَذَهَبَ عَنْهُ مَا يَجِدُ» — متفق عليه"],["المرض والمصيبة","الحمد لله الذي عافاني","«لَمْ يُصِبْهُ ذَلِكَ البَلَاءُ» — رواه الترمذي — حسن"],["مع الناس","جزاك الله خيرا","«فَقَدْ أَبْلَغَ فِي الثَّنَاءِ» — رواه الترمذي"],["مع الناس","اللهم اني اعوذ بك ان اشرك","قالها النبي ﷺ لأبي بكر: «إِذَا قُلْتَهَا أَذْهَبَ اللَّهُ عَنْكَ قَلِيلَ الشِّرْكِ وَكَثِيرَهُ» — رواه البخاري في الأدب المفرد"],["أذكار جامعة","سبحان الله وبحمده، سبحان الله العظيم","«كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي المِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ» — متفق عليه"],["أذكار جامعة","لا حول ولا قوه الا بالله","«كَنْزٌ مِنْ كُنُوزِ الجَنَّةِ» — متفق عليه"],["أذكار جامعة","سبحان الله، والحمد لله، ولا اله الا الله","«أَحَبُّ الكَلَامِ إِلَى اللَّهِ أَرْبَعٌ…» — رواه مسلم"],["أذكار جامعة","@دعوة ذي النون","«لَمْ يَدْعُ بِهَا رَجُلٌ مُسْلِمٌ فِي شَيْءٍ قَطُّ إِلَّا اسْتَجَابَ اللَّهُ لَهُ» — رواه الترمذي"],["الوضوء","اللهم اجعلني من التوابين","﴿إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ﴾ — البقرة ٢٢٢"],["المرض والمصيبة","لا باس، طهور","«مَنْ عَادَ مَرِيضًا لَمْ يَزَلْ فِي خُرْفَةِ الجَنَّةِ حَتَّى يَرْجِعَ» — رواه مسلم"],["مع الناس","السلام عليكم اهل الديار","«زُورُوا القُبُورَ فَإِنَّهَا تُذَكِّرُ الآخِرَةَ» — رواه مسلم"],["مع الناس","العاطس","«إِنَّ اللَّهَ يُحِبُّ العُطَاسَ… فَحَقٌّ عَلَى كُلِّ مُسْلِمٍ سَمِعَهُ أَنْ يُشَمِّتَهُ» — رواه البخاري"],["مع الناس","اعوذ بالله من الشيطان الرجيم، امنت","علاج الوسوسة الذي أرشد إليه النبي ﷺ: «فَلْيَسْتَعِذْ بِاللَّهِ وَلْيَنْتَهِ» — متفق عليه"],["في العمل","دعاء الرزق","@"],["في العمل","اللهم اكفني بحلالك","«لَوْ كَانَ عَلَيْكَ مِثْلُ جَبَلِ صِيرٍ دَيْنًا أَدَّاهُ اللَّهُ عَنْكَ» — رواه الترمذي — حسن"],["في العمل","سبحانك اللهم وبحمدك، اشهد","«غُفِرَ لَهُ مَا كَانَ فِي مَجْلِسِهِ ذَلِكَ» — رواه الترمذي"]],F={"أصبحنا وأصبح الملك لله رب العالمين، اللهم إني أسألك خير هذا اليوم: فتحه، ونصره، ونوره، وبركته، وهداه، وأعوذ بك من شر ما فيه وشر ما بعده.":"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذَا الْيَوْمِ: فَتْحَهُ، وَنَصْرَهُ، وَنُورَهُ، وَبَرَكَتَهُ، وَهُدَاهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهِ وَشَرِّ مَا بَعْدَهُ.","أمسينا وأمسى الملك لله رب العالمين، اللهم إني أسألك خير هذه الليلة: فتحها، ونصرها، ونورها، وبركتها، وهداها، وأعوذ بك من شر ما فيها وشر ما بعدها.":"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذِهِ اللَّيْلَةِ: فَتْحَهَا، وَنَصْرَهَا، وَنُورَهَا، وَبَرَكَتَهَا، وَهُدَاهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهَا وَشَرِّ مَا بَعْدَهَا.","أصبحنا وأصبح الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، رب أسألك خير ما في هذا اليوم وخير ما بعده، وأعوذ بك من شر ما في هذا اليوم وشر ما بعده، رب أعوذ بك من الكسل وسوء الكبر، رب أعوذ بك من عذاب في النار وعذاب في القبر.":"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ.","أمسينا وأمسى الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، رب أسألك خير ما في هذه الليلة وخير ما بعدها، وأعوذ بك من شر ما في هذه الليلة وشر ما بعدها، رب أعوذ بك من الكسل وسوء الكبر، رب أعوذ بك من عذاب في النار وعذاب في القبر.":"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ.","اللهم بك أصبحنا، وبك أمسينا، وبك نحيا، وبك نموت، وإليك النشور.":"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ.","اللهم بك أمسينا، وبك أصبحنا، وبك نحيا، وبك نموت، وإليك المصير.":"اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ.","اللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك عليّ، وأبوء بذنبي فاغفر لي، فإنه لا يغفر الذنوب إلا أنت.":"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.","اللهم إني أسألك العفو والعافية في الدنيا والآخرة، اللهم إني أسألك العفو والعافية في ديني ودنياي وأهلي ومالي، اللهم استر عوراتي وآمن روعاتي، اللهم احفظني من بين يديّ ومن خلفي، وعن يميني وعن شمالي ومن فوقي، وأعوذ بعظمتك أن أُغتال من تحتي.":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي، وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي.","اللهم عالم الغيب والشهادة، فاطر السماوات والأرض، رب كل شيء ومليكه، أشهد أن لا إله إلا أنت، أعوذ بك من شر نفسي، ومن شر الشيطان وشركه، وأن أقترف على نفسي سوءًا أو أجرّه إلى مسلم.":"اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ.","بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم.":"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ.","يا حي يا قيوم برحمتك أستغيث، أصلح لي شأني كله، ولا تكلني إلى نفسي طرفة عين.":"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ.","أصبحنا على فطرة الإسلام، وعلى كلمة الإخلاص، وعلى دين نبينا محمد صلى الله عليه وسلم، وعلى ملة أبينا إبراهيم حنيفًا مسلمًا وما كان من المشركين.":"أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ.","أمسينا على فطرة الإسلام، وعلى كلمة الإخلاص، وعلى دين نبينا محمد صلى الله عليه وسلم، وعلى ملة أبينا إبراهيم حنيفًا مسلمًا وما كان من المشركين.":"أَمْسَيْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ.","سبحان الله وبحمده عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته.":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ.","اللهم إني أسألك علمًا نافعًا، ورزقًا طيبًا، وعملًا متقبلًا.":"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا.","اللهم إني أسألك علمًا نافعًا، ورزقًا طيبًا، وعملًا متقبّلًا.":"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا.","أعوذ بكلمات الله التامات من شر ما خلق.":"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.","لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير.":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.","سبحان الله وبحمده.":"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ.","أستغفر الله وأتوب إليه.":"أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ.","الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور.":"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ.","لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير، سبحان الله، والحمد لله، ولا إله إلا الله، والله أكبر، ولا حول ولا قوة إلا بالله العلي العظيم، رب اغفر لي.":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ، رَبِّ اغْفِرْ لِي.","الحمد لله الذي كساني هذا ورزقنيه من غير حول مني ولا قوة.":"الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ.","اللهم لك الحمد أنت كسوتنيه، أسألك من خيره وخير ما صُنع له، وأعوذ بك من شره وشر ما صُنع له.":"اللَّهُمَّ لَكَ الْحَمْدُ أَنْتَ كَسَوْتَنِيهِ، أَسْأَلُكَ مِنْ خَيْرِهِ وَخَيْرِ مَا صُنِعَ لَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّهِ وَشَرِّ مَا صُنِعَ لَهُ.","بسم الله.":"بِسْمِ اللَّهِ.","بسم الله، اللهم إني أعوذ بك من الخُبُث والخبائث.":"بِسْمِ اللَّهِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ.","غفرانك.":"غُفْرَانَكَ.","أشهد أن لا إله إلا الله وحده لا شريك له، وأشهد أن محمدًا عبده ورسوله.":"أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ.","اللهم اجعلني من التوابين، واجعلني من المتطهرين.":"اللَّهُمَّ اجْعَلْنِي مِنَ التَّوَّابِينَ، وَاجْعَلْنِي مِنَ الْمُتَطَهِّرِينَ.","بسم الله، توكلت على الله، ولا حول ولا قوة إلا بالله.":"بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ.","اللهم إني أعوذ بك أن أَضِلّ أو أُضَلّ، أو أَزِلّ أو أُزَلّ، أو أَظلِم أو أُظلَم، أو أَجهَل أو يُجهَل عليّ.":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أَضِلَّ أَوْ أُضَلَّ، أَوْ أَزِلَّ أَوْ أُزَلَّ، أَوْ أَظْلِمَ أَوْ أُظْلَمَ، أَوْ أَجْهَلَ أَوْ يُجْهَلَ عَلَيَّ.","بسم الله. ثم يسلّم على أهله.":"بِسْمِ اللَّهِ. ثم يسلّم على أهله.","اللهم اجعل في قلبي نورًا، وفي لساني نورًا، وفي سمعي نورًا، وفي بصري نورًا، ومن فوقي نورًا، ومن تحتي نورًا، وعن يميني نورًا، وعن شمالي نورًا، ومن أمامي نورًا، ومن خلفي نورًا، واجعل في نفسي نورًا، وأعظم لي نورًا.":"اللَّهُمَّ اجْعَلْ فِي قَلْبِي نُورًا، وَفِي لِسَانِي نُورًا، وَفِي سَمْعِي نُورًا، وَفِي بَصَرِي نُورًا، وَمِنْ فَوْقِي نُورًا، وَمِنْ تَحْتِي نُورًا، وَعَنْ يَمِينِي نُورًا، وَعَنْ شِمَالِي نُورًا، وَمِنْ أَمَامِي نُورًا، وَمِنْ خَلْفِي نُورًا، وَاجْعَلْ فِي نَفْسِي نُورًا، وَأَعْظِمْ لِي نُورًا.","أعوذ بالله العظيم، وبوجهه الكريم، وسلطانه القديم، من الشيطان الرجيم.":"أَعُوذُ بِاللَّهِ الْعَظِيمِ، وَبِوَجْهِهِ الْكَرِيمِ، وَسُلْطَانِهِ الْقَدِيمِ، مِنَ الشَّيْطَانِ الرَّجِيمِ.","بسم الله، والصلاة والسلام على رسول الله، اللهم افتح لي أبواب رحمتك.":"بِسْمِ اللَّهِ، وَالصَّلَاةُ وَالسَّلَامُ عَلَى رَسُولِ اللَّهِ، اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ.","بسم الله، والصلاة والسلام على رسول الله، اللهم إني أسألك من فضلك.":"بِسْمِ اللَّهِ، وَالصَّلَاةُ وَالسَّلَامُ عَلَى رَسُولِ اللَّهِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ.","يصلي على النبي ﷺ ثم يقول: اللهم رب هذه الدعوة التامة، والصلاة القائمة، آتِ محمدًا الوسيلة والفضيلة، وابعثه مقامًا محمودًا الذي وعدته.":"يصلي على النبي ﷺ ثم يقول: اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ، وَالصَّلَاةِ الْقَائِمَةِ، آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ، وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ.","اللهم باعِد بيني وبين خطاياي كما باعدت بين المشرق والمغرب، اللهم نقّني من خطاياي كما يُنقّى الثوب الأبيض من الدنس، اللهم اغسلني من خطاياي بالثلج والماء والبرد.":"اللَّهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ، اللَّهُمَّ نَقِّنِي مِنْ خَطَايَايَ كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ، اللَّهُمَّ اغْسِلْنِي مِنْ خَطَايَايَ بِالثَّلْجِ وَالْمَاءِ وَالْبَرَدِ.","سبحانك اللهم وبحمدك، وتبارك اسمك، وتعالى جدّك، ولا إله غيرك.":"سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، وَتَبَارَكَ اسْمُكَ، وَتَعَالَى جَدُّكَ، وَلَا إِلَهَ غَيْرُكَ.","وجّهت وجهي للذي فطر السماوات والأرض حنيفًا وما أنا من المشركين، إن صلاتي ونسكي ومحياي ومماتي لله رب العالمين، لا شريك له، وبذلك أُمرت وأنا من المسلمين، اللهم أنت الملك لا إله إلا أنت، أنت ربي وأنا عبدك، ظلمت نفسي، واعترفت بذنبي، فاغفر لي ذنوبي جميعًا، إنه لا يغفر الذنوب إلا أنت، واهدني لأحسن الأخلاق، لا يهدي لأحسنها إلا أنت، واصرف عني سيئها، لا يصرف عني سيئها إلا أنت، لبيك وسعديك، والخير كله في يديك، والشر ليس إليك، أنا بك وإليك، تباركت وتعاليت، أستغفرك وأتوب إليك.":"وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ، إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ، لَا شَرِيكَ لَهُ، وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِينَ، اللَّهُمَّ أَنْتَ الْمَلِكُ لَا إِلَهَ إِلَّا أَنْتَ، أَنْتَ رَبِّي وَأَنَا عَبْدُكَ، ظَلَمْتُ نَفْسِي، وَاعْتَرَفْتُ بِذَنْبِي، فَاغْفِرْ لِي ذُنُوبِي جَمِيعًا، إِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، وَاهْدِنِي لِأَحْسَنِ الْأَخْلَاقِ، لَا يَهْدِي لِأَحْسَنِهَا إِلَّا أَنْتَ، وَاصْرِفْ عَنِّي سَيِّئَهَا، لَا يَصْرِفُ عَنِّي سَيِّئَهَا إِلَّا أَنْتَ، لَبَّيْكَ وَسَعْدَيْكَ، وَالْخَيْرُ كُلُّهُ فِي يَدَيْكَ، وَالشَّرُّ لَيْسَ إِلَيْكَ، أَنَا بِكَ وَإِلَيْكَ، تَبَارَكْتَ وَتَعَالَيْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ.","الله أكبر كبيرًا، والحمد لله كثيرًا، وسبحان الله بكرةً وأصيلًا.":"اللَّهُ أَكْبَرُ كَبِيرًا، وَالْحَمْدُ لِلَّهِ كَثِيرًا، وَسُبْحَانَ اللَّهِ بُكْرَةً وَأَصِيلًا.","الحمد لله حمدًا كثيرًا طيبًا مباركًا فيه.":"الْحَمْدُ لِلَّهِ حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ.","اللهم ربّ جبرائيل وميكائيل وإسرافيل، فاطر السماوات والأرض، عالم الغيب والشهادة، أنت تحكم بين عبادك فيما كانوا فيه يختلفون، اهدني لما اختُلف فيه من الحق بإذنك، إنك تهدي من تشاء إلى صراط مستقيم.":"اللَّهُمَّ رَبَّ جِبْرَائِيلَ وَمِيكَائِيلَ وَإِسْرَافِيلَ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، أَنْتَ تَحْكُمُ بَيْنَ عِبَادِكَ فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ، اهْدِنِي لِمَا اخْتُلِفَ فِيهِ مِنَ الْحَقِّ بِإِذْنِكَ، إِنَّكَ تَهْدِي مَنْ تَشَاءُ إِلَى صِرَاطٍ مُسْتَقِيمٍ.","أعوذ بالله من الشيطان الرجيم.":"أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ.","سبحان ربي العظيم.":"سُبْحَانَ رَبِّيَ الْعَظِيمِ.","سبحانك اللهم ربنا وبحمدك، اللهم اغفر لي.":"سُبْحَانَكَ اللَّهُمَّ رَبَّنَا وَبِحَمْدِكَ، اللَّهُمَّ اغْفِرْ لِي.","سُبّوحٌ قُدّوسٌ، ربُّ الملائكة والروح.":"سُبُّوحٌ قُدُّوسٌ، رَبُّ الْمَلَائِكَةِ وَالرُّوحِ.","اللهم لك ركعت، وبك آمنت، ولك أسلمت، خشع لك سمعي، وبصري، ومخّي، وعظمي، وعصبي.":"اللَّهُمَّ لَكَ رَكَعْتُ، وَبِكَ آمَنْتُ، وَلَكَ أَسْلَمْتُ، خَشَعَ لَكَ سَمْعِي، وَبَصَرِي، وَمُخِّي، وَعَظْمِي، وَعَصَبِي.","سبحان ذي الجبروت، والملكوت، والكبرياء، والعظمة.":"سُبْحَانَ ذِي الْجَبَرُوتِ، وَالْمَلَكُوتِ، وَالْكِبْرِيَاءِ، وَالْعَظَمَةِ.","سمع الله لمن حمده.":"سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ.","ربنا ولك الحمد، حمدًا كثيرًا طيبًا مباركًا فيه.":"رَبَّنَا وَلَكَ الْحَمْدُ، حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ.","ملء السماوات، وملء الأرض، وما بينهما، وملء ما شئت من شيء بعد، أهل الثناء والمجد، أحقّ ما قال العبد، وكلنا لك عبد، اللهم لا مانع لما أعطيت، ولا معطي لما منعت، ولا ينفع ذا الجدّ منك الجدّ.":"مِلْءَ السَّمَاوَاتِ، وَمِلْءَ الْأَرْضِ، وَمَا بَيْنَهُمَا، وَمِلْءَ مَا شِئْتَ مِنْ شَيْءٍ بَعْدُ، أَهْلَ الثَّنَاءِ وَالْمَجْدِ، أَحَقُّ مَا قَالَ الْعَبْدُ، وَكُلُّنَا لَكَ عَبْدٌ، اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ.","سبحان ربي الأعلى.":"سُبْحَانَ رَبِّيَ الْأَعْلَى.","اللهم لك سجدت، وبك آمنت، ولك أسلمت، سجد وجهي للذي خلقه وصوّره، وشقّ سمعه وبصره، تبارك الله أحسن الخالقين.":"اللَّهُمَّ لَكَ سَجَدْتُ، وَبِكَ آمَنْتُ، وَلَكَ أَسْلَمْتُ، سَجَدَ وَجْهِي لِلَّذِي خَلَقَهُ وَصَوَّرَهُ، وَشَقَّ سَمْعَهُ وَبَصَرَهُ، تَبَارَكَ اللَّهُ أَحْسَنُ الْخَالِقِينَ.","اللهم اغفر لي ذنبي كله، دِقّه وجِلّه، وأوّله وآخره، وعلانيته وسرّه.":"اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ، دِقَّهُ وَجِلَّهُ، وَأَوَّلَهُ وَآخِرَهُ، وَعَلَانِيَتَهُ وَسِرَّهُ.","اللهم إني أعوذ برضاك من سخطك، وبمعافاتك من عقوبتك، وأعوذ بك منك، لا أُحصي ثناءً عليك، أنت كما أثنيت على نفسك.":"اللَّهُمَّ إِنِّي أَعُوذُ بِرِضَاكَ مِنْ سَخَطِكَ، وَبِمُعَافَاتِكَ مِنْ عُقُوبَتِكَ، وَأَعُوذُ بِكَ مِنْكَ، لَا أُحْصِي ثَنَاءً عَلَيْكَ، أَنْتَ كَمَا أَثْنَيْتَ عَلَى نَفْسِكَ.","سجد وجهي للذي خلقه، وشقّ سمعه وبصره، بحوله وقوته.":"سَجَدَ وَجْهِي لِلَّذِي خَلَقَهُ، وَشَقَّ سَمْعَهُ وَبَصَرَهُ، بِحَوْلِهِ وَقُوَّتِهِ.","اللهم اكتب لي بها عندك أجرًا، وضع عني بها وزرًا، واجعلها لي عندك ذخرًا، وتقبّلها مني كما تقبّلتها من عبدك داود.":"اللَّهُمَّ اكْتُبْ لِي بِهَا عِنْدَكَ أَجْرًا، وَضَعْ عَنِّي بِهَا وِزْرًا، وَاجْعَلْهَا لِي عِنْدَكَ ذُخْرًا، وَتَقَبَّلْهَا مِنِّي كَمَا تَقَبَّلْتَهَا مِنْ عَبْدِكَ دَاوُدَ.","التحيات لله، والصلوات والطيبات، السلام عليك أيها النبي ورحمة الله وبركاته، السلام علينا وعلى عباد الله الصالحين، أشهد أن لا إله إلا الله، وأشهد أن محمدًا عبده ورسوله.":"التَّحِيَّاتُ لِلَّهِ، وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ.","اللهم صلِّ على محمد وعلى آل محمد، كما صليت على إبراهيم وعلى آل إبراهيم، إنك حميد مجيد، اللهم بارك على محمد وعلى آل محمد، كما باركت على إبراهيم وعلى آل إبراهيم، إنك حميد مجيد.":"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ.","اللهم إني أعوذ بك من عذاب جهنم، ومن عذاب القبر، ومن فتنة المحيا والممات، ومن شر فتنة المسيح الدجال.":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ جَهَنَّمَ، وَمِنْ عَذَابِ الْقَبْرِ، وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ، وَمِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ.","اللهم إني ظلمت نفسي ظلمًا كثيرًا، ولا يغفر الذنوب إلا أنت، فاغفر لي مغفرةً من عندك، وارحمني، إنك أنت الغفور الرحيم.":"اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا، وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ، وَارْحَمْنِي، إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ.","اللهم اغفر لي ما قدّمت وما أخّرت، وما أسررت وما أعلنت، وما أسرفت، وما أنت أعلم به مني، أنت المقدّم وأنت المؤخّر، لا إله إلا أنت.":"اللَّهُمَّ اغْفِرْ لِي مَا قَدَّمْتُ وَمَا أَخَّرْتُ، وَمَا أَسْرَرْتُ وَمَا أَعْلَنْتُ، وَمَا أَسْرَفْتُ، وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي، أَنْتَ الْمُقَدِّمُ وَأَنْتَ الْمُؤَخِّرُ، لَا إِلَهَ إِلَّا أَنْتَ.","اللهم إني أعوذ بك من البخل، وأعوذ بك من الجبن، وأعوذ بك من أن أُردّ إلى أرذل العمر، وأعوذ بك من فتنة الدنيا، وأعوذ بك من عذاب القبر.":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبُخْلِ، وَأَعُوذُ بِكَ مِنَ الْجُبْنِ، وَأَعُوذُ بِكَ مِنْ أَنْ أُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الدُّنْيَا، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ.","اللهم إني أسألك الجنة، وأعوذ بك من النار.":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ، وَأَعُوذُ بِكَ مِنَ النَّارِ.","السلام عليكم ورحمة الله (عن اليمين)، السلام عليكم ورحمة الله (عن اليسار).":"السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ (عن اليمين)، السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ (عن اليسار).","أستغفر الله، أستغفر الله، أستغفر الله. اللهم أنت السلام ومنك السلام، تباركت يا ذا الجلال والإكرام.":"أَسْتَغْفِرُ اللَّهَ، أَسْتَغْفِرُ اللَّهَ، أَسْتَغْفِرُ اللَّهَ. اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ.","لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير، اللهم لا مانع لما أعطيت، ولا معطي لما منعت، ولا ينفع ذا الجدّ منك الجدّ.":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ.","لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير، لا حول ولا قوة إلا بالله، لا إله إلا الله، ولا نعبد إلا إياه، له النعمة وله الفضل وله الثناء الحسن، لا إله إلا الله مخلصين له الدين ولو كره الكافرون.":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ، لَا إِلَهَ إِلَّا اللَّهُ، وَلَا نَعْبُدُ إِلَّا إِيَّاهُ، لَهُ النِّعْمَةُ وَلَهُ الْفَضْلُ وَلَهُ الثَّنَاءُ الْحَسَنُ، لَا إِلَهَ إِلَّا اللَّهُ مُخْلِصِينَ لَهُ الدِّينَ وَلَوْ كَرِهَ الْكَافِرُونَ.","سبحان الله.":"سُبْحَانَ اللَّهِ.","الحمد لله.":"الْحَمْدُ لِلَّهِ.","الله أكبر.":"اللَّهُ أَكْبَرُ.","اللهم أعني على ذكرك، وشكرك، وحسن عبادتك.":"اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ، وَشُكْرِكَ، وَحُسْنِ عِبَادَتِكَ.","ربِّ قِني عذابك يوم تبعث عبادك.":"رَبِّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ.","لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، يحيي ويميت، وهو على كل شيء قدير.":"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، يُحْيِي وَيُمِيتُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.","بسم الله في أوله وآخره.":"بِسْمِ اللَّهِ فِي أَوَّلِهِ وَآخِرِهِ.","الحمد لله الذي أطعمني هذا ورزقنيه من غير حول مني ولا قوة.":"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ.","اللهم بارك لهم فيما رزقتهم، واغفر لهم وارحمهم.":"اللَّهُمَّ بَارِكْ لَهُمْ فِيمَا رَزَقْتَهُمْ، وَاغْفِرْ لَهُمْ وَارْحَمْهُمْ.","ذهب الظمأ، وابتلّت العروق، وثبت الأجر إن شاء الله.":"ذَهَبَ الظَّمَأُ، وَابْتَلَّتِ الْعُرُوقُ، وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللَّهُ.","باسمك اللهم أموت وأحيا.":"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا.","باسمك ربي وضعت جنبي، وبك أرفعه، فإن أمسكت نفسي فارحمها، وإن أرسلتها فاحفظها بما تحفظ به عبادك الصالحين.":"بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، فَإِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ.","اللهم قني عذابك يوم تبعث عبادك.":"اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ.","سبحان الله (33)، والحمد لله (33)، والله أكبر (34).":"سُبْحَانَ اللَّهِ (33)، وَالْحَمْدُ لِلَّهِ (33)، وَاللَّهُ أَكْبَرُ (34).","اللهم أسلمت نفسي إليك، وفوضت أمري إليك، ووجهت وجهي إليك، وألجأت ظهري إليك، رغبةً ورهبةً إليك، لا ملجأ ولا منجا منك إلا إليك، آمنت بكتابك الذي أنزلت، وبنبيك الذي أرسلت.":"اللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَوَجَّهْتُ وَجْهِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لَا مَلْجَأَ وَلَا مَنْجَا مِنْكَ إِلَّا إِلَيْكَ، آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ.","الله أكبر، الله أكبر، الله أكبر، سبحان الذي سخّر لنا هذا وما كنا له مقرنين، وإنا إلى ربنا لمنقلبون، اللهم إنا نسألك في سفرنا هذا البرّ والتقوى، ومن العمل ما ترضى، اللهم هوّن علينا سفرنا هذا واطوِ عنا بُعده، اللهم أنت الصاحب في السفر، والخليفة في الأهل، اللهم إني أعوذ بك من وعثاء السفر، وكآبة المنظر، وسوء المنقلب في المال والأهل.":"اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ، اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا الْبِرَّ وَالتَّقْوَى، وَمِنَ الْعَمَلِ مَا تَرْضَى، اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا وَاطْوِ عَنَّا بُعْدَهُ، اللَّهُمَّ أَنْتَ الصَّاحِبُ فِي السَّفَرِ، وَالْخَلِيفَةُ فِي الْأَهْلِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ وَعْثَاءِ السَّفَرِ، وَكَآبَةِ الْمَنْظَرِ، وَسُوءِ الْمُنْقَلَبِ فِي الْمَالِ وَالْأَهْلِ.","يقول دعاء السفر ويزيد: آيبون، تائبون، عابدون، لربنا حامدون.":"يقول دعاء السفر ويزيد: آيِبُونَ، تَائِبُونَ، عَابِدُونَ، لِرَبِّنَا حَامِدُونَ.","أستودع الله دينك، وأمانتك، وخواتيم عملك.":"أَسْتَوْدِعُ اللَّهَ دِينَكَ، وَأَمَانَتَكَ، وَخَوَاتِيمَ عَمَلِكَ.","اللهم إني أسألك خيرها، وأعوذ بك من شرها.":"اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّهَا.","اللهم صيّبًا نافعًا.":"اللَّهُمَّ صَيِّبًا نَافِعًا.","مُطرنا بفضل الله ورحمته.":"مُطِرْنَا بِفَضْلِ اللَّهِ وَرَحْمَتِهِ.","لا بأس، طَهورٌ إن شاء الله.":"لَا بَأْسَ، طَهُورٌ إِنْ شَاءَ اللَّهُ.","أسأل الله العظيم، رب العرش العظيم، أن يشفيك.":"أَسْأَلُ اللَّهَ الْعَظِيمَ، رَبَّ الْعَرْشِ الْعَظِيمِ، أَنْ يَشْفِيَكَ.","يضع يده على موضع الألم ويقول: بسم الله (ثلاثًا)، ثم: أعوذ بالله وقدرته من شر ما أجد وأحاذر (سبع مرات).":"يضع يده على موضع الألم ويقول: بِسْمِ اللَّهِ (ثلاثًا)، ثم: أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ (سبع مرات).","إنا لله وإنا إليه راجعون، اللهم أْجُرني في مصيبتي، وأخلف لي خيرًا منها.":"إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ، اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي، وَأَخْلِفْ لِي خَيْرًا مِنْهَا.","الحمد لله الذي عافاني مما ابتلاك به، وفضّلني على كثير ممن خلق تفضيلًا.":"الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي مِمَّا ابْتَلَاكَ بِهِ، وَفَضَّلَنِي عَلَى كَثِيرٍ مِمَّنْ خَلَقَ تَفْضِيلًا.","اللهم إني أستخيرك بعلمك، وأستقدرك بقدرتك، وأسألك من فضلك العظيم، فإنك تقدر ولا أقدر، وتعلم ولا أعلم، وأنت علّام الغيوب، اللهم إن كنت تعلم أن هذا الأمر (ويسمّي حاجته) خيرٌ لي في ديني ومعاشي وعاقبة أمري فاقدُره لي، ويسّره لي، ثم بارك لي فيه، وإن كنت تعلم أن هذا الأمر شرٌّ لي في ديني ومعاشي وعاقبة أمري فاصرفه عني، واصرفني عنه، واقدُر لي الخير حيث كان، ثم أرضني به.":"اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ الْعَظِيمِ، فَإِنَّكَ تَقْدِرُ وَلَا أَقْدِرُ، وَتَعْلَمُ وَلَا أَعْلَمُ، وَأَنْتَ عَلَّامُ الْغُيُوبِ، اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ (ويسمّي حاجته) خَيْرٌ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي فَاقْدُرْهُ لِي، وَيَسِّرْهُ لِي، ثُمَّ بَارِكْ لِي فِيهِ، وَإِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ شَرٌّ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي فَاصْرِفْهُ عَنِّي، وَاصْرِفْنِي عَنْهُ، وَاقْدُرْ لِيَ الْخَيْرَ حَيْثُ كَانَ، ثُمَّ أَرْضِنِي بِهِ.","العاطس: الحمد لله. ومن سمعه: يرحمك الله. فيرد العاطس: يهديكم الله ويصلح بالكم.":"العاطس: الْحَمْدُ لِلَّهِ. ومن سمعه: يَرْحَمُكَ اللَّهُ. فيرد العاطس: يَهْدِيكُمُ اللَّهُ وَيُصْلِحُ بَالَكُمْ.","جزاك الله خيرًا.":"جَزَاكَ اللَّهُ خَيْرًا.","بارك الله لك، وبارك عليك، وجمع بينكما في خير.":"بَارَكَ اللَّهُ لَكَ، وَبَارَكَ عَلَيْكَ، وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ.","اللهم أهِلّه علينا باليُمن والإيمان، والسلامة والإسلام، ربي وربك الله.":"اللَّهُمَّ أَهِلَّهُ عَلَيْنَا بِالْيُمْنِ وَالْإِيمَانِ، وَالسَّلَامَةِ وَالْإِسْلَامِ، رَبِّي وَرَبُّكَ اللَّهُ.","السلام عليكم أهل الديار من المؤمنين والمسلمين، وإنا إن شاء الله بكم لاحقون، نسأل الله لنا ولكم العافية.":"السَّلَامُ عَلَيْكُمْ أَهْلَ الدِّيَارِ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ، وَإِنَّا إِنْ شَاءَ اللَّهُ بِكُمْ لَاحِقُونَ، نَسْأَلُ اللَّهَ لَنَا وَلَكُمُ الْعَافِيَةَ.","اللهم إني أعوذ بك أن أشرك بك وأنا أعلم، وأستغفرك لما لا أعلم.":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أُشْرِكَ بِكَ وَأَنَا أَعْلَمُ، وَأَسْتَغْف <b>«تَفَكُّرُ سَاعَةٍ خَيْرٌ مِنْ قِيَامِ لَيْلَةٍ»</b>.</p><p>وقال عمر بن عبد العزيز: <b>«الفِكْرَةُ فِي نِعَمِ اللَّهِ مِنْ أَفْضَلِ العِبَادَةِ»</b>.</p></div>\n <h2 class="sec">كيف أتفكّر؟ خمس خطوات</h2>\n <div class="card"><ol class="sol tfsteps">\n <li><b>اختر وقتًا هادئًا:</b> خمس دقائق بعد الفجر، أو قبل النوم، أو وأنت تمشي. وأبعد الهاتف.</li>\n <li><b>اختر موضوعًا واحدًا:</b> السماء، أو جسدك، أو لقمة طعام، أو آية. لا تشتّت نفسك بأشياء كثيرة.</li>\n <li><b>انظر واسأل:</b> من خلق هذا؟ لماذا هو بهذا الإتقان؟ ماذا لو فقدته؟</li>\n <li><b>انقل الفكرة إلى قلبك:</b> هل تشعر بعظمة الله؟ بمحبته؟ بالحياء منه؟ بالشكر؟</li>\n <li><b>اختم بعمل:</b> قل «سبحان الله» أو «الحمد لله» من قلبك، أو ادعُ، أو اتخذ قرارًا صغيرًا تغيّر به شيئًا في يومك.</li></ol></div>\n <h2 class="sec">موضوعات للتفكّر</h2>\n ${tt.map(t=>`<details class="card sin"><summary><div><b>${t.i} ${t.t}</b></div><span class="chev">‹</span></summary><div class="sbody">${nus(t.n)}${gqW(Ee.tfk[tt.indexOf(t)])}<h4>${gqE()?"Questions to reflect on":"أسئلة للتفكّر"}</h4>${gqT()}<ol class="tfq">${t.q.map(t=>`<li>${t}</li>`).join("")}</ol></div></details>`).join("")}\n <h2 class="sec">دفتر التفكّر</h2>\n ${n.length?n.slice().reverse().slice(0,15).map(t=>`<div class="card tfj"><small>${t.d} · ${t.t}</small><p>${(t.x||"").replace(/</g,"&lt;")}</p></div>`).join(""):'<p class="note" style="padding:0 4px">لم تكتب شيئًا بعد. بعد أول جلسة تفكّر، اكتب ما خرجت به، فيُحفظ هنا على جهازك.</p>'}`,document.getElementById("tfGo").onclick=t=>{t.currentTarget.hidden=!0;const e=document.getElementById("tfTimer");e.hidden=!1;let a=300;const upd=()=>{document.getElementById("tfT").textContent=ar(Math.floor(a/60))+":"+ar(String(a%60).padStart(2,"0"))};upd(),et=setInterval(()=>{a--,document.getElementById("tfT")?(upd(),a<=0&&(clearInterval(et),et=null,e.hidden=!0,document.getElementById("tfEnd").hidden=!1,buzz([60,60,60]),ding&&ding(),markH("k"))):clearInterval(et)},1e3),e.onclick=()=>{clearInterval(et),et=null,e.hidden=!0,document.getElementById("tfEnd").hidden=!1,markH("k")}},document.getElementById("tfSave").onclick=()=>{const t=document.getElementById("tfNote").value.trim();if(markH("k"),t){const e=tfkGet();e.push({d:new Intl.DateTimeFormat("ar-EG",{day:"numeric",month:"long"}).format(new Date),t:a.t,x:t}),tfkSet(e)}toast("تقبّل الله، بارك الله فيك");const e=scrollY;tafakkurView(),scrollTo(0,e)}}const at=[["p","الصلاة والطهارة"],["z","الذكر"],["q","القرآن"],["s","الصيام"],["k","الأخلاق والصدقة"],["b","البيت والأهل"]],nt=[["p","بيت في الجنة","«مَا مِنْ عَبْدٍ مُسْلِمٍ يُصَلِّي لِلَّهِ كُلَّ يَوْمٍ ثِنْتَيْ عَشْرَةَ رَكْعَةً تَطَوُّعًا غَيْرَ فَرِيضَةٍ إِلَّا بَنَى اللَّهُ لَهُ بَيْتًا فِي الجَنَّةِ».","رواه مسلم","السنن الرواتب: ٢ قبل الفجر، ٤ قبل الظهر و٢ بعده، ٢ بعد المغرب، ٢ بعد العشاء",1],["p","صلاة البردين","«مَنْ صَلَّى البَرْدَيْنِ دَخَلَ الجَنَّةَ» يعني الفجر والعصر.","متفق عليه","صلاة الفجر والعصر في وقتهما",1],["p","كأنك قمت الليل كله","«مَنْ صَلَّى العِشَاءَ فِي جَمَاعَةٍ فَكَأَنَّمَا قَامَ نِصْفَ اللَّيْلِ، وَمَنْ صَلَّى الصُّبْحَ فِي جَمَاعَةٍ فَكَأَنَّمَا صَلَّى اللَّيْلَ كُلَّهُ».","رواه مسلم","العشاء والفجر في جماعة",1],["p","في ذمة الله","«مَنْ صَلَّى الصُّبْحَ فَهُوَ فِي ذِمَّةِ اللَّهِ».","رواه مسلم",null],["p","صلاة الضحى","«يُصْبِحُ عَلَى كُلِّ سُلَامَى مِنْ أَحَدِكُمْ صَدَقَةٌ… وَيُجْزِئُ مِنْ ذَلِكَ رَكْعَتَانِ يَرْكَعُهُمَا مِنَ الضُّحَى».","رواه مسلم","ركعتا الضحى",1],["p","الخطايا تخرج مع الوضوء","«مَنْ تَوَضَّأَ فَأَحْسَنَ الوُضُوءَ خَرَجَتْ خَطَايَاهُ مِنْ جَسَدِهِ حَتَّى تَخْرُجَ مِنْ تَحْتِ أَظْفَارِهِ».","رواه مسلم",null],["p","أبواب الجنة الثمانية","من أسبغ الوضوء ثم قال: «أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ» «إِلَّا فُتِحَتْ لَهُ أَبْوَابُ الجَنَّةِ الثَّمَانِيَةُ يَدْخُلُ مِنْ أَيِّهَا شَاءَ».","رواه مسلم","أشهد أن لا إله إلا الله وحده لا شريك له، وأشهد أن محمدًا عبده ورسوله — بعد الوضوء",5],["p","نُزُل في الجنة","«مَنْ غَدَا إِلَى المَسْجِدِ أَوْ رَاحَ، أَعَدَّ اللَّهُ لَهُ فِي الجَنَّةِ نُزُلًا كُلَّمَا غَدَا أَوْ رَاحَ».","متفق عليه",null],["p","آية الكرسي بعد كل صلاة","«مَنْ قَرَأَ آيَةَ الكُرْسِيِّ دُبُرَ كُلِّ صَلَاةٍ مَكْتُوبَةٍ لَمْ يَمْنَعْهُ مِنْ دُخُولِ الجَنَّةِ إِلَّا أَنْ يَمُوتَ».","رواه النسائي في الكبرى — صحيح","آية الكرسي بعد كل صلاة",5],["z","حُطّت خطاياه","«مَنْ قَالَ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، فِي يَوْمٍ مِائَةَ مَرَّةٍ، حُطَّتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ البَحْرِ».","متفق عليه","سبحان الله وبحمده",100],["z","ثقيلتان في الميزان","«كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي المِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ العَظِيمِ».","متفق عليه","سبحان الله وبحمده، سبحان الله العظيم",100],["z","عِدل عشر رقاب","«مَنْ قَالَ: لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ المُلْكُ وَلَهُ الحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، فِي يَوْمٍ مِائَةَ مَرَّةٍ، كَانَتْ لَهُ عَدْلَ عَشْرِ رِقَابٍ، وَكُتِبَتْ لَهُ مِائَةُ حَسَنَةٍ، وَمُحِيَتْ عَنْهُ مِائَةُ سَيِّئَةٍ، وَكَانَتْ لَهُ حِرْزًا مِنَ الشَّيْطَانِ».","متفق عليه","لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير",100],["z","كنز من كنوز الجنة","«لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ كَنْزٌ مِنْ كُنُوزِ الجَنَّةِ».","متفق عليه","لا حول ولا قوة إلا بالله",100],["z","نخلة في الجنة","«مَنْ قَالَ: سُبْحَانَ اللَّهِ العَظِيمِ وَبِحَمْدِهِ، غُرِسَتْ لَهُ نَخْلَةٌ فِي الجَنَّةِ».","رواه الترمذي — صحيح","سبحان الله العظيم وبحمده",100],["z","عشر صلوات من الله","«مَنْ صَلَّى عَلَيَّ صَلَاةً صَلَّى اللَّهُ عَلَيْهِ بِهَا عَشْرًا».","رواه مسلم","اللهم صلِّ وسلّم على نبينا محمد",100],["z","أحب الكلام إلى الله","«أَحَبُّ الكَلَامِ إِلَى اللَّهِ أَرْبَعٌ: سُبْحَانَ اللَّهِ، وَالحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ».","رواه مسلم","سبحان الله، والحمد لله، ولا إله إلا الله، والله أكبر",100],["z","تملأ الميزان","«الطُّهُورُ شَطْرُ الإِيمَانِ، وَالحَمْدُ لِلَّهِ تَمْلَأُ المِيزَانَ، وَسُبْحَانَ اللَّهِ وَالحَمْدُ لِلَّهِ تَمْلَآنِ مَا بَيْنَ السَّمَاوَاتِ وَالأَرْضِ».","رواه مسلم","الحمد لله",100],["q","عشر حسنات بكل حرف","«من قرأ حرفًا من كتاب الله فله به حسنة، والحسنة بعشر أمثالها، لا أقول «الم» حرف، ولكن ألف حرف، ولام حرف، وميم حرف».","رواه الترمذي — صحيح","قراءة صفحة من القرآن",1],["q","ثلث القرآن","«قُلْ هُوَ اللَّهُ أَحَدٌ تَعْدِلُ ثُلُثَ القُرْآنِ».","متفق عليه","قل هو الله أحد",3],["q","شفيع يوم القيامة","«اقْرَءُوا القُرْآنَ؛ فَإِنَّهُ يَأْتِي يَوْمَ القِيَامَةِ شَفِيعًا لِأَصْحَابِهِ».","رواه مسلم",null],["q","خير الناس","«خَيْرُكُمْ مَنْ تَعَلَّمَ القُرْآنَ وَعَلَّمَهُ».","رواه البخاري",null],["s","سبعين خريفًا عن النار","«مَنْ صَامَ يَوْمًا فِي سَبِيلِ اللَّهِ، بَعَّدَ اللَّهُ وَجْهَهُ عَنِ النَّارِ سَبْعِينَ خَرِيفًا».","متفق عليه",null],["s","صيام الدهر","«صَوْمُ ثَلَاثَةِ أَيَّامٍ مِنْ كُلِّ شَهْرٍ صَوْمُ الدَّهْرِ كُلِّهِ».","متفق عليه",null],["s","الاثنين والخميس","«تُعْرَضُ الأَعْمَالُ يَوْمَ الِاثْنَيْنِ وَالخَمِيسِ، فَأُحِبُّ أَنْ يُعْرَضَ عَمَلِي وَأَنَا صَائِمٌ».","رواه الترمذي — صحيح",null],["s","يوم عرفة وعاشوراء","صيام يوم عرفة «يُكَفِّرُ السَّنَةَ المَاضِيَةَ وَالبَاقِيَةَ»، وصيام عاشوراء «يُكَفِّرُ السَّنَةَ المَاضِيَةَ».","رواه مسلم",null],["s","ست من شوال","«مَنْ صَامَ رَمَضَانَ ثُمَّ أَتْبَعَهُ سِتًّا مِنْ شَوَّالٍ كَانَ كَصِيَامِ الدَّهْرِ».","رواه مسلم",null],["k","أثقل شيء في الميزان","«مَا مِنْ شَيْءٍ أَثْقَلُ فِي مِيزَانِ المُؤْمِنِ يَوْمَ القِيَامَةِ مِنْ خُلُقٍ حَسَنٍ».","رواه الترمذي — صحيح",null],["k","الابتسامة صدقة","«تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ لَكَ صَدَقَةٌ».","رواه الترمذي — صحيح",null],["k","غصن في الطريق","«لَقَدْ رَأَيْتُ رَجُلًا يَتَقَلَّبُ فِي الجَنَّةِ فِي شَجَرَةٍ قَطَعَهَا مِنْ ظَهْرِ الطَّرِيقِ كَانَتْ تُؤْذِي النَّاسَ».","رواه مسلم",null],["k","في بستان الجنة","«مَنْ عَادَ مَرِيضًا لَمْ يَزَلْ فِي خُرْفَةِ الجَنَّةِ حَتَّى يَرْجِعَ».","رواه مسلم",null],["k","الكلمة الطيبة","«وَالكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ».","متفق عليه",null],["k","بيت لمن ترك الجدال","«أَنَا زَعِيمٌ بِبَيْتٍ فِي رَبَضِ الجَنَّةِ لِمَنْ تَرَكَ المِرَاءَ وَإِنْ كَانَ مُحِقًّا».","روا ِي الصُّدُورُ﴾","غافر ١٩"],["«يَا عَلِيُّ، لَا تُتْبِعِ النَّظْرَةَ النَّظْرَةَ، فَإِنَّ لَكَ الأُولَى وَلَيْسَتْ لَكَ الآخِرَةُ».","رواه أبو داود والترمذي — حسن"],["عن جرير رضي الله عنه قال: سألت رسول الله ﷺ عن نظر الفجاءة، «فَأَمَرَنِي أَنْ أَصْرِفَ بَصَرِي».","رواه مسلم"],["«كُتِبَ عَلَى ابْنِ آدَمَ نَصِيبُهُ مِنَ الزِّنَا مُدْرِكٌ ذَلِكَ لَا مَحَالَةَ: فَالعَيْنَانِ زِنَاهُمَا النَّظَرُ…».","رواه مسلم"],["«النَّظْرَةُ سَهْمٌ مَسْمُومٌ مِنْ سِهَامِ إِبْلِيسَ، مَنْ تَرَكَهَا مِنْ خَوْفِ اللَّهِ أَبْدَلَهُ اللَّهُ إِيمَانًا يَجِدُ حَلَاوَتَهُ فِي قَلْبِهِ».","رواه الحاكم — في إسناده كلام"]],fawaid:[["امتثال أمر الله","وهو غاية سعادة العبد في دنياه وآخرته؛ فما سعد من سعد إلا بامتثال أوامره، وما شقي من شقي إلا بتضييعها."],["يمنع السهم المسموم","فالنظرة سهم من سهام إبليس، وغض البصر يمنع وصول أثره إلى القلب."],["أُنس القلب بالله","إطلاق البصر يفرّق القلب ويشتّته ويبعده من الله، ويوقع الوحشة بين العبد وربه."],["قوة القلب وفرحه","غض البصر يقوّي القلب ويفرحه، كما أن إطلاقه يضعفه ويحزنه."],["نور القلب","يكسب القلب نورًا كما أن إطلاقه يكسبه ظلمة؛ ولهذا ذكر الله آية النور بعد الأمر بغض البصر في السورة نفسها."],["الفراسة الصادقة","من غض بصره عما حرّم الله عوّضه الله نورًا في بصيرته، فيميّز بين الحق والباطل والصادق والكاذب."],["ثبات القلب وشجاعته","يورث القلب ثباتًا وقوة، فيجمع الله له بين سلطان البصيرة وسلطان القوة."],["يسدّ مدخل الشيطان","فالشيطان يدخل مع النظرة أسرع من الهواء، فيزيّن الصورة ويعلّق القلب بها."],["يفرّغ القلب لمصالحه","إطلاق البصر يشتّت القلب عن مصالحه وعن ذكر ربه، فتنفرط عليه أموره ويتبع هواه."],["صلاح القلب","بين العين والقلب منفذ وطريق؛ إذا فسدت العين فسد القلب، وإذا صلحت صلح."]],hikam:[["«الصَّبْرُ عَلَى غَضِّ البَصَرِ أَيْسَرُ مِنَ الصَّبْرِ عَلَى أَلَمِ مَا بَعْدَهُ».","نقله ابن القيم"],["النظرة تولّد خطرة، ثم الخطرة فكرة، ثم الفكرة شهوة، ثم الشهوة إرادة، ثم عزيمة جازمة، فيقع الفعل.","معنى كلام ابن القيم في الداء والدواء"],["«مَنْ غَضَّ بَصَرَهُ عَنِ المَحَارِمِ، وَكَفَّ نَفْسَهُ عَنِ الشَّهَوَاتِ، وَعَمَّرَ بَاطِنَهُ بِالمُرَاقَبَةِ، وَظَاهِرَهُ بِاتِّبَاعِ السُّنَّةِ… لَمْ تُخْطِئْ لَهُ فِرَاسَةٌ».","شاه بن شجاع الكرماني — نقله ابن القيم"]],steps:["اصرف بصرك فورًا عند النظرة الأولى، ولا تُتبعها الثانية (حديث جرير).","في الشارع والعمل: انظر أمامك أو إلى الأرض، وأشغل لسانك بالذكر.","الجوال: احذف أو كتّم الحسابات التي تُظهر الصور المحرّمة، وفعّل وضع الأمان في البحث والتطبيقات.","لا تقلّب الجوال بلا هدف، خصوصًا ليلًا وأنت وحدك.","تذكّر أن الله ﴿يَعْلَمُ خَائِنَةَ الْأَعْيُنِ﴾ وأن الملَكين يكتبان.","الصيام لمن لم يستطع الزواج: «فَإِنَّهُ لَهُ وِجَاءٌ» (متفق عليه)."]},ue=[{t:"النظر المحرّم والمقاطع الإباحية",s:"أخطر ما يواجهه الشباب اليوم، وبابه الجوال",n:[["﴿إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَٰئِكَ كَانَ عَنْهُ مَسْئُولًا﴾","الإسراء ٣٦"],["«لَأَعْلَمَنَّ أَقْوَامًا مِنْ أُمَّتِي يَأْتُونَ يَوْمَ القِيَامَةِ بِحَسَنَاتٍ أَمْثَالِ جِبَالِ تِهَامَةَ بِيضًا، فَيَجْعَلُهَا اللَّهُ هَبَاءً مَنْثُورًا… أَمَا إِنَّهُمْ إِخْوَانُكُمْ… وَلَكِنَّهُمْ قَوْمٌ إِذَا خَلَوْا بِمَحَارِمِ اللَّهِ انْتَهَكُوهَا».","رواه ابن ماجه — صحيح"]],h:["تُظلم القلب وتقسّيه، وتُذهب لذة الصلاة والقرآن.","تُضعف الحفظ والفهم؛ قال ابن القيم: من آثار المعاصي حرمان العلم، فإن العلم نور يقذفه الله في القلب، والمعصية تطفئ ذلك النور.","تتحوّل إلى عادة يصعب تركها، ويحتاج صاحبها كل مرة إلى أكثر مما قبلها.","تُفسد نظرة الشاب إلى المرأة والزواج، وتُشعره بالضيق والذنب بعدها.","تُضيّع الساعات، وتسرق النوم والتركيز في الدراسة والعمل."],c:["اجعل الجوال خارج غرفة النوم ليلًا، أو اشحنه بعيدًا عن السرير.","لا تختلِ بالجوال: استعمله في مكان فيه ناس.","استعمل برامج الحجب وقيود Screen Time، واجعل كلمة سرّها مع شخص تثق به.","اعرف أوقات ضعفك (السهر، الوحدة، الملل) وأشغلها مسبقًا.","إذا جاءت الرغبة: اضغط زر «أحتاج مساعدة الآن» في تبويب الثبات."]},{t:"العادة السرية",s:"تبدأ بالنظر وتنتهي بضيق وندم",n:[["﴿وَالَّذِينَ هُمْ لِفُرُوجِهِمْ حَافِظُونَ إِلَّا عَلَىٰ أَزْوَاجِهِمْ أَوْ مَا مَلَكَتْ أَيْمَانُهُمْ فَإِنَّهُمْ غَيْرُ مَلُومِينَ فَمَنِ ابْتَغَىٰ وَرَاءَ ذَٰلِكَ فَأُولَٰئِكَ هُمُ الْعَادُونَ﴾","المؤمنون ٥–٧ — واستدل بها جمهور العلماء على تحريمها"],["«يَا مَعْشَرَ الشَّبَابِ، مَنِ اسْتَطَاعَ مِنْكُمُ البَاءَةَ فَلْيَتَزَوَّجْ… وَمَنْ لَمْ يَسْتَطِعْ فَعَلَيْهِ بِالصَّوْمِ فَإِنَّهُ لَهُ وِجَاءٌ».","متفق عليه — فأرشد ﷺ إلى الصوم لا إلى غيره"]],h:["تُضعف العزيمة وقوة الإرادة، ويشعر صاحبها بالهزيمة أمام نفسه.","تترك ضيقًا وحزنًا وشعورًا بالذنب بعد كل مرة.","ترتبط غالبًا بالنظر المحرّم، فكل منهما يجرّ الآخر.","تشغل القلب والفكر عن العبادة والدراسة والأهداف.","تنبيه: لا تصدّق المبالغات الطبية المنتشرة؛ يكفي ضررها على القلب والعزيمة."],c:["اقطع السبب الأول: غض البصر وضبط الجوال.","نَم مبكرًا، ولا تبقَ في السرير مستيقظًا مع الجوال؛ إذا لم تنم فقم.","الصيام، وخاصة الاثنين والخميس.","الرياضة وشغل الوقت؛ الفراغ أكبر عون للشهوة.","استعمل عدّاد أيام الثبات، وإذا سقطت فتُب فورًا وابدأ من جديد ولا تيأس."]},{t:"المحادثات المحرّمة مع الفتيات",s:"«مجرد كلام» على الجوال، وهو أول خطوات الشيطان",n:[["﴿وَلَا تَقْرَبُوا الزِّنَىٰ ۖ إِنَّهُ كَانَ فَاحِشَةً وَسَاءَ سَبِيلًا﴾","الإسراء ٣٢ — نهى عن القرب منه، أي عن مقدماته"],["﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَتَّبِعُوا خُطُوَاتِ الشَّيْطَانِ﴾","النور ٢١"],["«مَا تَرَكْتُ بَعْدِي فِتْنَةً أَضَرَّ عَلَى الرِّجَالِ مِنَ النِّسَاءِ».","متفق عليه"]],h:["تعلّق القلب وانشغاله، حتى يصير الشاب أسيرًا للرسائل.","تجرّ إلى الكذب والإخفاء عن الأهل، ثم إلى ما هو أكبر.","فيها خيانة لبنات الناس وأهلهن، وأنت لا ترضاه لأختك.","تُضيّع الوقت والمال والتركيز، وتُفسد الدراسة والعبادة."],c:["احذف المحادثة والرقم مباشرة؛ نصف الحلول لا تنفع هنا.","اسأل نفسك: هل ترضاه لأختك؟ (حديث الشاب الذي استأذن في الزنا، في تبويب السلف).","إن كنت قادرًا فاسلك الطريق الحلال: الخطبة عن طريق الأهل.","املأ وقتك بأصدقاء صالحين ونشاط نافع."]},{t:"تأخير الصلاة عن وقتها",s:"خاصة الفجر، وأثناء العمل والدراسة",n:[["﴿فَوَيْلٌ لِّلْمُصَلِّينَ الَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ﴾","الماعون ٤–٥ — وفسّرها جماعة من السلف بتأخيرها عن وقتها"],["﴿فَخَلَفَ مِن بَعْدِهِمْ خَلْفٌ أَضَاعُوا الصَّلَاةَ وَاتَّبَعُوا الشَّهَوَاتِ ۖ فَسَوْفَ يَلْقَوْنَ غَيًّا﴾","مريم ٥٩ — قال ابن مسعود: أخّروها عن مواقيتها"],["«العَهْدُ الَّذِي بَيْنَنَا وَبَيْنَهُمُ الصَّلَاةُ، فَمَنْ تَرَكَهَا فَقَدْ كَفَرَ».","رواه الترمذي والنسائي — صحيح"]],h:["الصلاة أول ما يُحاسب عليه العبد يوم القيامة.","تأخيرها يُضعف الإيمان، ويفتح باب الكسل حتى تُترك.","من حافظ على الصلاة حفظه الله، ومن ضيّعها فهو لما سواها أضيع.","قلة البركة في الوقت والرزق، وضيق الصدر."],c:["اضبط منبّهًا لكل صلاة، واجعل الأذان على جوالك.","في العمل: اطلب من المسؤول خمس دقائق للصلاة؛ أغلب الأماكن توافق.","للفجر: نَم مبكرًا، وضع المنبّه بعيدًا عن السرير، واتفق مع صديق يوقظك.","صلِّ في المسجد ما استطعت؛ الجماعة تُعين على الالتزام."]},{t:"الغيبة والنميمة",s:"أسهل ذنوب المجالس وأخطرها",n:[["﴿وَلَا يَغْتَب بَّعْضُكُم بَعْضًا ۚ أَيُحِبُّ أَحَدُكُمْ أَن يَأْكُلَ لَحْمَ أَخِيهِ مَيْتًا فَكَرِهْتُمُوهُ﴾","الحجرات ١٢"],["«أَتَدْرُونَ مَا الغِيبَةُ؟» قالوا: الله ورسوله أعلم. قال: «ذِكْرُكَ أَخَاكَ بِمَا يَكْرَهُ».","رواه مسلم"],["«لَا يَدْخُلُ الجَنَّةَ نَمَّامٌ».","متفق عليه"]],h:["تأكل الحسنات وتنقلها إلى من اغتبته يوم القيامة.","تُفسد القلوب وتقطع الأخوّة والصداقات.","من نقل إليك كلام الناس نقل كلامك إليهم، فتفقد الثقة."],c:["إذا بدأت الغيبة: غيّر الموضوع، أو دافع عن الغائب، أو قم من المجلس.","قبل أن تتكلم عن أحد اسأل: هل أقوله أمامه؟","كفّارتها: التوبة، والاستغفار لمن اغتبته، وذكره بخير في المجالس التي اغتبته فيها."]},{t:"الكذب",s:"حتى «الكذب الصغير» والمزاح",n:[["«إِنَّ الصِّدْقَ يَهْدِي إِلَى البِرِّ، وَإِنَّ البِرَّ يَهْدِي إِلَى الجَنَّةِ… وَإِنَّ الكَذِبَ يَهْدِي إِلَى الفُجُورِ، وَإِنَّ الفُجُورَ يَهْدِي إِلَى النَّارِ، وَمَا يَزَالُ الرَّجُلُ يَكْذِبُ حَتَّى يُكْتَبَ عِنْدَ اللَّهِ كَذَّابًا».","متفق عليه"],["«آيَةُ المُنَافِقِ ثَلَاثٌ: إِذَا حَدَّثَ كَذَبَ، وَإِذَا وَعَدَ أَخْلَفَ، وَإِذَا اؤْتُمِنَ خَانَ».","متفق عليه"],["«أَنَا زَعِيمٌ بِبَيْتٍ فِي رَبَضِ الجَنَّةِ لِمَنْ تَرَكَ المِرَاءَ وَإِنْ كَانَ مُحِقًّا، وَبِبَيْتٍ فِي وَسَطِ الجَنَّةِ لِمَنْ تَرَكَ الكَذِبَ وَإِنْ كَانَ مَازِحًا».","رواه أبو داود — حسن"]],h:["الكذبة تحتاج كذبة أخرى لتغطيتها، حتى يصير عادة.","يُفقدك ثقة أهلك وأصدقائك ومديرك في العمل.","يجعل القلب مضطربًا خائفًا من انكشاف الأمر."],c:["قل الحقيقة حتى لو كانت محرجة؛ الإحراج دقيقة والكذب يبقى.","إذا لم تستطع الصدق فاسكت، ولا تكذب.","لا تَعِد بما لا تستطيع."]},{t:"إضاعة الوقت على الجوال",s:"ساعات تذهب بلا شيء",n:[["«نِعْمَتَانِ مَغْبُونٌ فِيهِمَا كَثِيرٌ مِنَ النَّاسِ: الصِّحَّةُ وَالفَرَاغُ».","رواه البخاري"],["«لَا تَزُولُ قَدَمَا عَبْدٍ يَوْمَ القِيَامَةِ حَتَّى يُسْأَلَ عَنْ عُمُرِهِ فِيمَا أَفْنَاهُ، وَعَنْ شَبَابِهِ فِيمَا أَبْلَاهُ…».","رواه الترمذي — حسن"]],h:["تضيع ساعات كانت تكفي لحفظ صفحات ومذاكرة دروس.","يُضعف التركيز والقدرة على القراءة الطويلة.","السهر عليه يُضيّع الفجر ويُتعب الجسم في العمل والدراسة.","كثير مما يُعرض فيه يفتح أبواب ذنوب أخرى."],c:["فعّل Screen Time وحدّد وقتًا يوميًا لكل تطبيق مشتّت.","ابدأ يومك بوردك (أذكار وقرآن) قبل أن تفتح الجوال.","احذف التطبيقات التي تضيّع وقتك أكثر من غيرها، ولو لمدة شهر تجربةً.","استغل الأوقات الصغيرة (المواصلات، الانتظار) في الذكر أو المراجعة."]},{t:"السبّ واللعن والكلام البذيء",s:"في الغضب والمزاح والألعاب",n:[["«لَيْسَ المُؤْمِنُ بِالطَّعَّانِ وَلَا اللَّعَّانِ وَلَا الفَاحِشِ وَلَا البَذِيءِ».","رواه الترمذي — صحيح"],["«سِبَابُ المُسْلِمِ فُسُوقٌ، وَقِتَالُهُ كُفْرٌ».","متفق عليه"],["«وَهَلْ يَكُبُّ النَّاسَ فِي النَّارِ عَلَى وُجُوهِهِمْ إِلَّا حَصَائِدُ أَلْسِنَتِهِمْ».","رواه الترمذي"]],h:["اللعنة إذا لم تجد سبيلًا رجعت على قائلها (رواه أبو داود).","تُذهب الهيبة والاحترام، وتعوّد اللسان على القبح.","تؤذي الناس وتُفسد العلاقات."],c:["عند الغضب: اسكت، وقل «أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ»، وغيّر جلستك.","عوّد لسانك بدائل: «سبحان الله»، «الله يهديك».","ابتعد عن الألعاب والمجموعات التي يكثر فيها السب."]},{t:"عقوق الوالدين",s:"رفع الصوت، والتأفف، والإهمال",n:[["﴿فَلَا تَقُل لَّهُمَا أُفٍّ وَلَا تَنْهَرْهُمَا وَقُل لَّهُمَا قَوْلًا كَرِيمًا وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ﴾","الإسراء ٢٣–٢٤"],["«أَلَا أُنَبِّئُكُمْ بِأَكْبَرِ الكَبَائِرِ؟… الإِشْرَاكُ بِاللَّهِ، وَعُقُوقُ الوَالِدَيْنِ…».","متفق عليه"],["«رَغِمَ أَنْفُهُ، ثُمَّ رَغِمَ أَنْفُهُ، ثُمَّ رَغِمَ أَنْفُهُ» قيل: من يا رسول الله؟ قال: «مَنْ أَدْرَكَ أَبَوَيْهِ عِنْدَ الكِبَرِ، أَحَدَهُمَا أَوْ كِلَيْهِمَا، فَلَمْ يَدْخُلِ الجَنَّةَ».","رواه مسلم"]],h:["من أكبر الكبائر، وعقوبته قد تُعجّل في الدنيا.","يحرمك دعاء الوالدين، وهو من أعظم أسباب التوفيق.","الندم بعد فوات الوقت لا ينفع."],c:["اتصل بهما يوميًا ولو دقيقة، خاصة إن كنت بعيدًا.","لا ترفع صوتك عليهما ولو كنت محقًّا.","ادعُ لهما في سجودك: ﴿رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا﴾.","اسألهما عن حاجاتهما، وأدخل عليهما السرور بهدية بسيطة."]},{t:"الأغاني والمعازف",s:"وأثرها على القلب والحفظ",n:[["«لَيَكُونَنَّ مِنْ أُمَّتِي أَقْوَامٌ يَسْتَحِلُّونَ الحِرَ وَالحَرِيرَ وَالخَمْرَ وَالمَعَازِفَ».","رواه البخاري"],["﴿وَمِنَ النَّاسِ مَن يَشْتَرِي لَهْوَ الْحَدِيثِ لِيُضِلَّ عَن سَبِيلِ اللَّهِ بِغَيْرِ عِلْمٍ﴾","لقمان ٦ — قال ابن مسعود: هو الغناء، والله الذي لا إله إلا هو"],["«الغِنَاءُ يُنْبِتُ النِّفَاقَ فِي القَلْبِ كَمَا يُنْبِتُ المَاءُ الزَّرْعَ».","يُروى عن ابن مسعود موقوفًا"]],h:["تحريم المعازف قول جمهور العلماء، وخالف بعضهم.","تُزاحم القرآن في القلب؛ قال ابن القيم في نونيته: حبّ الكتاب وحبّ ألحان الغِنا… في قلب عبدٍ ليس يجتمعان.","تُثير الشهوات والعواطف، وتُضيّع الوقت.","يجد الحافظ أن مراجعته تثقل مع كثرة السماع."],c:["استبدلها بتلاوات تحبها؛ اجعل في جوالك قائمة لقارئك المفضل.","احذف قوائم الأغاني والتطبيقات المرتبطة بها.","في السيارة والعمل: القرآن أو الدروس النافعة."]},{t:"التدخين والفيب",s:"إدمان يبدأ بالتجربة",n:[["﴿وَيُحِلُّ لَهُمُ الطَّيِّبَاتِ وَيُحَرِّمُ عَلَيْهِمُ الْخَبَائِثَ﴾","الأعراف ١٥٧"],["﴿وَلَا تُلْقُوا بِأَيْدِيكُمْ إِلَى التَّهْلُكَةِ﴾","البقرة ١٩٥"],["«لَا ضَرَرَ وَلَا ضِرَارَ».","رواه ابن ماجه، وحسّنه النووي"]],h:["النيكوتين يسبّب الإدمان، والسجائر من أكبر أسباب أمراض القلب والرئة والسرطان.","الفيب ليس آمنًا كما يُشاع: فيه نيكوتين يسبّب الإدمان، ويضر الرئة.","إضاعة المال يوميًا فيما يضر.","رائحته تؤذي المصلين والملائكة والناس من حولك."],c:["حدّد يومًا للترك، وأخبر أهلك وأصدقاءك.","تجنّب الأماكن والأصدقاء المرتبطين به في البداية.","اشرب الماء، ومارس الرياضة، وأشغل يدك وفمك بشيء مباح.","استعن بطبيب أو برنامج للإقلاع إن احتجت."]},{t:"أمراض القلوب: الحسد والكِبر والرياء",s:"ذنوب لا يراها الناس، لكنها تُفسد العمل",n:[["«لَا تَحَاسَدُوا، وَلَا تَنَاجَشُوا، وَلَا تَبَاغَضُوا، وَلَا تَدَابَرُوا… وَكُونُوا عِبَادَ اللَّهِ إِخْوَانًا».","رواه مسلم"],["«لَا يَدْخُلُ الجَنَّةَ مَنْ كَانَ فِي قَلْبِهِ مِثْقَالُ ذَرَّةٍ مِنْ كِبْرٍ… الكِبْرُ بَطَرُ الحَقِّ وَغَمْطُ النَّاسِ».","رواه مسلم"],["«إِنَّ أَخْوَفَ مَا أَخَافُ عَلَيْكُمُ الشِّرْكُ الأَصْغَرُ» قالوا: وما الشرك الأصغر؟ قال: «الرياء».","رواه أحمد — صحيح"]],h:["الحسد يأكل الحسنات، ويملأ القلب همًّا بنعم الناس.","الكِبر يمنع من قبول الحق والتعلم، ويُبغضك إلى الناس.","الرياء يُبطل العمل، فيتعب صاحبه ولا أجر له."],c:["إذا رأيت نعمة على غيرك فقل: «مَا شَاءَ اللَّهُ، اللَّهُمَّ بَارِكْ لَهُ»، واسأل الله من فضله.","تعلّم من الأصغر منك، واقبل النصيحة، وسلّم على من تعرف ومن لا تعرف.","أخفِ بعض أعمالك الصالحة (صدقة، قيام) بينك وبين الله.","ادعُ: «اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أُشْرِكَ بِكَ وَأَنَا أَعْلَمُ، وَأَسْتَغْفِرُكَ لِمَا لَا أَعْلَمُ» (رواه أحمد والبخاري في الأدب المفرد)."]}],he=[["﴿قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنفُسِهِمْ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ ۚ إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا ۚ إِنَّهُ هُوَ الْغَفُورُ الرَّحِيمُ﴾","الزمر ٥٣"],["«كُلُّ ابْنِ آدَمَ خَطَّاءٌ، وَخَيْرُ الخَطَّائِينَ التَّوَّابُونَ».","رواه الترمذي وابن ماجه — حسن"],["«إِنَّ اللَّهَ يَبْسُطُ يَدَهُ بِاللَّيْلِ لِيَتُوبَ مُسِيءُ النَّهَارِ، وَيَبْسُطُ يَدَهُ بِالنَّهَارِ لِيَتُوبَ مُسِيءُ اللَّيْلِ، حَتَّى تَطْلُعَ الشَّمْسُ مِنْ مَغْرِبِهَا».","رواه مسلم"],["أذنب عبدٌ ذنبًا فقال: ربِّ أذنبت فاغفر لي، فقال الله: «عَلِمَ عَبْدِي أَنَّ لَهُ رَبًّا يَغْفِرُ الذَّنْبَ وَيَأْخُذُ بِهِ، قَدْ غَفَرْتُ لِعَبْدِي» — وتكرر ذلك منه.","متفق عليه"],["«مَا مِنْ رَجُلٍ يُذْنِبُ ذَنْبًا، ثُمَّ يَقُومُ فَيَتَطَهَّرُ، ثُمَّ يُصَلِّي، ثُمَّ يَسْتَغْفِرُ اللَّهَ، إِلَّا غَفَرَ اللَّهُ لَهُ».","رواه أبو داود والترمذي — صحيح — صلاة التوبة"]],pe=[["«سَبْعَةٌ يُظِلُّهُمُ اللَّهُ فِي ظِلِّهِ يَوْمَ لَا ظِلَّ إِلَّا ظِلُّهُ… وَشَابٌّ نَشَأَ فِي عِبَادَةِ اللَّهِ…».","متفق عليه"],["«اغْتَنِمْ خَمْسًا قَبْلَ خَمْسٍ: شَبَابَكَ قَبْلَ هَرَمِكَ، وَصِحَّتَكَ قَبْلَ سَقَمِكَ، وَغِنَاكَ قَبْلَ فَقْرِكَ، وَفَرَاغَكَ قَبْلَ شُغْلِكَ، وَحَيَاتَكَ قَبْلَ مَوْتِكَ».","رواه الحاكم — صحيح"],["«يَا مَعْشَرَ الشَّبَابِ، مَنِ اسْتَطَاعَ مِنْكُمُ البَاءَةَ فَلْيَتَزَوَّجْ، فَإِنَّهُ أَغَضُّ لِلْبَصَرِ وَأَحْصَنُ لِلْفَرْجِ، وَمَنْ لَمْ يَسْتَطِعْ فَعَلَيْهِ بِالصَّوْمِ فَإِنَّهُ لَهُ وِجَاءٌ».","متفق عليه"],["في قوله تعالى ﴿إِنَّهُمْ فِتْيَةٌ آمَنُوا بِرَبِّهِمْ﴾: ذكر ابن كثير أن الشباب أقبل للحق وأهدى للسبيل من الشيوخ، ولهذا كان أكثر من استجاب لله ورسوله شبابًا.","تفسير ابن كثير — سورة الكهف"],["كان أبو سعيد الخدري إذا رأى الشباب قال: «مَرْحَبًا بِوَصِيَّةِ رَسُولِ اللَّهِ ﷺ؛ أَوْصَانَا رَسُولُ اللَّهِ ﷺ أَنْ نُوَسِّعَ لَكُمْ فِي المَجْلِسِ، وَأَنْ نُفَهِّمَكُمُ الحَدِيثَ».","رواه ابن ماجه وغيره بنحوه"],["قال عمر بن الخطاب: «تَفَقَّهُوا قَبْلَ أَنْ تُسَوَّدُوا». قال البخاري: وبعد أن تُسوَّدوا.","صحيح البخاري، كتاب العلم"],["كان ابن عباس وهو شاب يأتي باب الصحابي ليسأله عن الحديث، فيتوسّد رداءه على بابه والريح تسفي عليه التراب حتى يخرج.","رواه الدارمي"],["قالت أم الإمام مالك له وهو صغير: «اذْهَبْ إِلَى رَبِيعَةَ فَتَعَلَّمْ مِنْ أَدَبِهِ قَبْلَ عِلْمِهِ».","ترتيب المدارك للقاضي عياض"],["أتى شاب النبيَّ ﷺ فقال: ائذن لي بالزنا! فأدناه وقال: «أَتُحِبُّهُ لِأُمِّكَ؟ أَتُحِبُّهُ لِابْنَتِكَ؟ أَتُحِبُّهُ لِأُخْتِكَ؟…» وهو يقول: لا والله، ثم وضع يده عليه وقال: «اللَّهُمَّ اغْفِرْ ذَنْبَهُ، وَطَهِّرْ قَلْبَهُ، وَحَصِّنْ فَرْجَهُ». فلم يكن الفتى بعد ذلك يلتفت إلى شيء.","رواه أحمد — صحيح — درس في الرفق والحوار مع الشباب"],["ذكر ابن القيم أن أكثر فساد الأولاد إنما جاء من قِبل الآباء وإهمالهم، وترك تعليمهم فرائض الدين وسننه؛ فأضاعوهم صغارًا فلم ينتفعوا بأنفسهم ولم ينفعوا آباءهم كبارًا.","تحفة المودود بأحكام المولود — بمعناه"]],me=[["التوحيد ومراقبة الله","﴿يَا بُنَيَّ لَا تُشْرِكْ بِاللَّهِ ۖ إِنَّ الشِّرْكَ لَظُلْمٌ عَظِيمٌ﴾ (لقمان ١٣)، وقال ﷺ لابن عباس وهو غلام: «احْفَظِ اللَّهَ يَحْفَظْكَ، احْفَظِ اللَّهَ تَجِدْهُ تُجَاهَكَ» (رواه الترمذي)."],["الصلاة","﴿يَا بُنَيَّ أَقِمِ الصَّلَاةَ﴾ (لقمان ١٧)، و«مُرُوا أَوْلَادَكُمْ بِالصَّلَاةِ وَهُمْ أَبْنَاءُ سَبْعِ سِنِينَ» (رواه أبو داود — حسن)."],["القرآن","«خَيْرُكُمْ مَنْ تَعَلَّمَ القُرْآنَ وَعَلَّمَهُ» (رواه البخاري)."],["الأدب قبل العلم","وصية أم مالك: «تَعَلَّمْ مِنْ أَدَبِهِ قَبْلَ عِلْمِهِ»."],["آداب الحياة اليومية","«يَا غُلَامُ، سَمِّ اللَّهَ، وَكُلْ بِيَمِينِكَ، وَكُلْ مِمَّا يَلِيكَ» (متفق عليه)."],["الأمر بالمعروف والصبر","﴿وَأْمُرْ بِالْمَعْرُوفِ وَانْهَ عَنِ الْمُنكَرِ وَاصْبِرْ عَلَىٰ مَا أَصَابَكَ﴾ (لقمان ١٧)."],["التواضع وحسن الخلق","﴿وَلَا تُصَعِّرْ خَدَّكَ لِلنَّاسِ وَلَا تَمْشِ فِي الْأَرْضِ مَرَحًا﴾ (لقمان ١٨)."],["القوة والرياضة","«المُؤْمِنُ القَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللَّهِ مِنَ المُؤْمِنِ الضَّعِيفِ، وَفِي كُلٍّ خَيْرٌ» (رواه مسلم)، و«ارْمُوا بَنِي إِسْمَاعِيلَ، فَإِنَّ أَبَاكُمْ كَانَ رَامِيًا» (رواه البخاري)."],["العفة والزواج","«يَا مَعْشَرَ الشَّبَابِ، مَنِ اسْتَطَاعَ مِنْكُمُ البَاءَةَ فَلْيَتَزَوَّجْ…» (متفق عليه)."],["الرفقة الصالحة","«المَرْءُ عَلَى دِينِ خَلِيلِهِ، فَلْيَنْظُرْ أَحَدُكُمْ مَنْ يُخَالِلُ» (رواه أبو داود والترمذي — حسن)."],["اغتنام الوقت","«اغْتَنِمْ خَمْسًا قَبْلَ خَمْسٍ… شَبَابَكَ قَبْلَ هَرَمِكَ… وَفَرَاغَكَ قَبْلَ شُغْلِكَ»."],["العمل والكسب الحلال","«مَا أَكَلَ أَحَدٌ طَعَامًا قَطُّ خَيْرًا مِنْ أَنْ يَأْكُلَ مِنْ عَمَلِ يَدِهِ» (رواه البخاري)."]],ge=[["استعذ بالله الآن","﴿وَإِمَّا يَنزَغَنَّكَ مِنَ الشَّيْطَانِ نَزْغٌ فَاسْتَعِذْ بِاللَّهِ﴾ — قل: أعوذ بالله من الشيطان الرجيم."],["قم من مكانك","اخرج من الغرفة، أو اذهب إلى مكان فيه ناس، وأغلق الجوال أو ضعه بعيدًا."],["توضأ","الماء يطفئ الحرارة، والوضوء يعيدك إلى الله."],["صلِّ ركعتين أو اقرأ صفحة","أو اتصل بصديق صالح أو بأهلك."],["تذكّر","لذة دقائق، ثم ضيق وندم. ﴿وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِ وَنَهَى النَّفْسَ عَنِ الْهَوَىٰ فَإِنَّ الْجَنَّةَ هِيَ الْمَأْوَىٰ﴾"]],fe=[["اللهم إني أعوذ بك من شرّ سمعي، ومن شرّ بصري، ومن شرّ لساني، ومن شرّ قلبي، ومن شرّ مَنِيّي.","رواه أبو داود والترمذي — صحيح"],["اللهم اغفر ذنبي، وطهّر قلبي، وحصّن فرجي.","من دعاء النبي ﷺ للشاب —
