جه زميلك، وساعده في العمل.","تعلّم حديثًا واحدًا وعلّمه لصديق.","لا تغتب أحدًا اليوم، وإذا سمعت غيبة فغيّر الموضوع.","نم مبكرًا، وقم قبل الفجر بعشر دقائق وصلِّ ركعتين.","اكتب ثلاث نِعم، وقل الحمد لله عليها.","صلِّ صلاة في المسجد مع الجماعة.","راجع شيئًا مما حفظته من القرآن.","اختر ذنبًا تريد تركه، وأضفه في «عدّاد الثبات».","اقرأ أذكار المساء كاملة.","صِل رحمك: اتصل بقريب لم تكلمه منذ مدة.","أكثِر من الصلاة على النبي ﷺ.","لا تسمع الأغاني اليوم، واستبدلها بتلاوة تحبها.","أتقن عملك اليوم، واستحضر أن الله يراك.","ادعُ لثلاثة أشخاص بظهر الغيب.","اقرأ سورة الملك قبل النوم.","اعتذر لمن أخطأت في حقه.","استغفر الله مئة مرة.","تعلّم معنى اسم من أسماء الله الحسنى.","أطعم أحدًا، أو اشترِ لزميلك شيئًا.","احرص على الصف الأول في صلاة واحدة.","لا تجادل اليوم، حتى لو كنت محقًّا.","خطّط لأسبوعك: الدراسة، والعمل، والحفظ.","اجلس مع رفقة صالحة، أو احضر درسًا.","اكتب في ورقة: لماذا أريد أن أكون أفضل؟","احفظ آية جديدة، واعمل بها اليوم.","صلِّ الوتر ولو ركعة قبل النوم.","احمد الله على الأربعين، واختر ثلاث عادات تستمر عليها."],xe={7:"أسبوع الثبات",21:"صاحب العادة",40:"بطل الأربعين"},chGet=()=>{try{return JSON.parse(localStorage.getItem("tahaddi"))||null}catch(t){return null}},chSet=t=>{try{localStorage.setItem("tahaddi",JSON.stringify(t))}catch(t){}},Me=[["آية الكرسي","مرة واحدة"],["المعوذات","قل هو الله أحد، والفلق، والناس — ٣ مرات"],["سيد الاستغفار","«اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ…» — مرة"],["سبحان الله وبحمده","١٠٠ مرة — دقيقة ونصف تقريبًا"],["صفحة من القرآن","ولو صفحة واحدة بتدبّر"],["دعاء الثبات","«يَا مُقَلِّبَ القُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ» — ٣ مرات"],["الصلاة على النبي ﷺ","١٠ مرات"]],wGet=()=>{let t=null;try{t=JSON.parse(localStorage.getItem("wird"))}catch(t){}return t&&t.day===dkey()?t:{day:dkey(),d:[]}},wSet=t=>{try{localStorage.setItem("wird",JSON.stringify(t))}catch(t){}},Se=[["سقطتُ في الذنب نفسه مرات كثيرة… هل يقبل الله توبتي؟","نعم. في الحديث القدسي أن عبدًا أذنب فقال: ربِّ أذنبت فاغفر لي، فغفر الله له، ثم عاد فأذنب واستغفر فغفر له، ثم قال الله: «عَلِمَ عَبْدِي أَنَّ لَهُ رَبًّا يَغْفِرُ الذَّنْبَ وَيَأْخُذُ بِهِ، قَدْ غَفَرْتُ لِعَبْدِي» (متفق عليه). المهم أن تكون توبتك صادقة كل مرة: تندم، وتعزم ألّا تعود. والشيطان يريدك أن تيأس فتترك التوبة، فلا تعطه ما يريد."],["قلبي قاسٍ، ولا أخشع في الصلاة. ماذا أفعل؟","أكثِر من ذكر الله: ﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾. اقرأ ما تفهمه بتدبّر، وتذكّر الموت، وقلّل الذنوب لأنها تقسّي القلب. وجاء رجل يشكو قسوة قلبه فقال ﷺ: «إِنْ أَرَدْتَ أَنْ يَلِينَ قَلْبُكَ فَأَطْعِمِ المِسْكِينَ، وَامْسَحْ رَأْسَ اليَتِيمِ» (رواه أحمد — حسن)."],["كيف أترك صديق السوء بدون مشاكل؟","قال ﷺ: «المَرْءُ عَلَى دِينِ خَلِيلِهِ، فَلْيَنْظُرْ أَحَدُكُمْ مَنْ يُخَالِلُ» (رواه أبو داود والترمذي). انصحه مرة بلطف، ثم قلّل الجلوس معه تدريجيًا، ولا تذهب معه إلى أماكن المعصية. والأهم: ابحث عن بديل صالح، في المسجد أو حلقة القرآن أو زملاء طيبين؛ فالفراغ يعيدك إلى الصحبة القديمة."],["أهلي غير ملتزمين، كيف أتعامل معهم؟","برّهم واجب وإن قصّروا: ﴿وَصَاحِبْهُمَا فِي الدُّنْيَا مَعْرُوفًا﴾. كن قدوة بأخلاقك قبل كلامك، وانصحهم بلطف في الوقت المناسب، ولا تجادلهم بحدّة، وادعُ لهم كثيرًا. كثير من الآباء تغيّروا عندما رأوا أخلاق أبنائهم."],["أحب فتاة، ماذا أفعل؟","لا تدخل في علاقة أو محادثات محرّمة. قال ﷺ: «لَمْ يُرَ لِلْمُتَحَابَّيْنِ مِثْلُ النِّكَاحِ» (رواه ابن ماجه — صحيح). إن كنت قادرًا فتقدّم لخطبتها عن طريق أهلك. وإن لم تكن قادرًا الآن فاقطع التواصل، واصبر، وصم، واشتغل ببناء نفسك ومستقبلك، والله يعوّضك خيرًا."],["سأتوب عندما أكبر… الآن وقت الشباب!","لا أحد يضمن أن يكبر. والنبي ﷺ قال: «اغْتَنِمْ خَمْسًا قَبْلَ خَمْسٍ: شَبَابَكَ قَبْلَ هَرَمِكَ…». والشاب الذي نشأ في عبادة الله من السبعة الذين يظلهم الله في ظله. ثم إن العادة كلما طالت صعب تركها، فالتوبة اليوم أسهل من الغد."],["كيف أوفّق بين الدراسة والعمل والحفظ؟","ابدأ يومك مبكرًا، فقد قال ﷺ: «اللَّهُمَّ بَارِكْ لِأُمَّتِي فِي بُكُورِهَا» (رواه أبو داود والترمذي). اجعل لك وردًا صغيرًا ثابتًا بدل الكثير المتقطع، واستغل الأوقات الميتة (المواصلات، الاستراحة) في المراجعة والذكر. وانوِ بعملك ودراستك وجه الله، فتصير كلها عبادة."],["أشعر بالوحدة والحزن كثيرًا.","الحزن يمرّ على الجميع، حتى الأنبياء. الجأ إلى الله بالصلاة، فقد كان ﷺ إذا حزبه أمر صلّى، وكان يقول: «أَرِحْنَا بِهَا يَا بِلَالُ». أكثِر من دعاء الهم: «اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الهَمِّ وَالحَزَنِ…»، وابحث عن صحبة صالحة تتكلم معها. وإذا طال الحزن وأثّر على نومك ودراستك، فتكلّم مع أهلك أو شخص تثق به، ولا تحمله وحدك."],["أخاف من الرياء، فأترك بعض الأعمال الصالحة.","لا تترك العمل خوفًا من الرياء؛ فهذا من مداخل الشيطان. قال الفضيل بن عياض: «تَرْكُ العَمَلِ مِنْ أَجْلِ النَّاسِ رِيَاءٌ، وَالعَمَلُ مِنْ أَجْلِ النَّاسِ شِرْكٌ، وَالإِخْلَاصُ أَنْ يُعَافِيَكَ اللَّهُ مِنْهُمَا». اعمل، وجدّد نيتك، وأخفِ بعض أعمالك بينك وبين الله."],["أتحمّس ثم أفتر بعد أيام. كيف أثبت؟","الفتور طبيعي، فقد قال ﷺ: «إِنَّ لِكُلِّ عَمَلٍ شِرَّةً، وَلِكُلِّ شِرَّةٍ فَتْرَةً، فَمَنْ كَانَتْ فَتْرَتُهُ إِلَى سُنَّتِي فَقَدِ اهْتَدَى» (رواه أحمد وابن حبان). لا تبدأ بالكثير؛ «أَحَبُّ الأَعْمَالِ إِلَى اللَّهِ أَدْوَمُهَا وَإِنْ قَلَّ» (متفق عليه). ابدأ بورد الشاب اليومي، وتحدّي الأربعين، وادعُ بالثبات."]],Ie=[["الهمّة العالية","«احْرِصْ عَلَى مَا يَنْفَعُكَ، وَاسْتَعِنْ بِاللَّهِ، وَلَا تَعْجَزْ» (رواه مسلم). الشاب صاحب الهمّة لا يرضى بالقليل في دينه ولا دنياه.",["اكتب ثلاثة أهداف لهذه السنة: في الدين، والدراسة، والعمل.","قسّم كل هدف إلى خطوة أسبوعية صغيرة.","راجع أهدافك كل جمعة."]],["إدارة الوقت للطالب الذي يعمل","«نِعْمَتَانِ مَغْبُونٌ فِيهِمَا كَثِيرٌ مِنَ النَّاسِ: الصِّحَّةُ وَالفَرَاغُ» (رواه البخاري). الوقت هو عمرك.",["اجعل الصلوات الخمس محطات يومك، ورتّب الباقي حولها.","ذاكِر بعد الفجر أو قبل العمل، فالذهن صافٍ.","قلّل الجوال بـ Screen Time، واجعل له وقتًا محددًا."]],["الثقة بالنفس والتوكل","ثقتك الحقيقية بالله، ثم بما أعطاك من قدرات. ﴿وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ﴾.",["تذكّر نجاحاتك الصغيرة واكتبها.","لا تقارن نفسك بغيرك على وسائل التواصل؛ كلٌّ يعرض أحسن ما عنده.","جرّب شيئًا جديدًا نافعًا كل شهر."]],["الرفقة الصالحة","«مَثَلُ الجَلِيسِ الصَّالِحِ وَالسَّوْءِ كَحَامِلِ المِسْكِ وَنَافِخِ الكِيرِ» (متفق عليه). صديقك يرفعك أو يُنزلك.",["احضر حلقة قرآن أو درسًا أسبوعيًا.","ابحث عن صديق يذكّرك بالصلاة ويشجعك على الحفظ.","كن أنت الجليس الصالح لغيرك."]],["حفظ اللسان","«مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَاليَوْمِ الآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ» (متفق عليه).",["فكّر قبل أن تتكلم أو تكتب تعليقًا.","لا تنقل كلامًا لم تتأكد منه.","عوّد لسانك على الذكر في فراغك."]],["الصحة والرياضة","«المُؤْمِنُ القَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللَّهِ مِنَ المُؤْمِنِ الضَّعِيفِ، وَفِي كُلٍّ خَيْرٌ» (رواه مسلم). جسدك أمانة.",["امشِ أو مارس رياضة ٣٠ دقيقة، ٣ مرات في الأسبوع.","نم مبكرًا، فالسهر يسرق الفجر والتركيز.","قلّل المشروبات الغازية والسكر."]],["التعامل مع الفشل","«وَإِنْ أَصَابَكَ شَيْءٌ فَلَا تَقُلْ: لَوْ أَنِّي فَعَلْتُ كَانَ كَذَا وَكَذَا، وَلَكِنْ قُلْ: قَدَّرَ اللَّهُ وَمَا شَاءَ فَعَلَ، فَإِنَّ (لَوْ) تَفْتَحُ عَمَلَ الشَّيْطَانِ» (رواه مسلم).",["الفشل في امتحان أو عمل ليس نهاية الطريق.","اسأل: ماذا أتعلّم من هذا؟ ثم ابدأ من جديد.","استخر الله في قراراتك، ثم توكّل."]],["اختيار الزوجة","«تُنْكَحُ المَرْأَةُ لِأَرْبَعٍ: لِمَالِهَا، وَلِحَسَبِهَا، وَلِجَمَالِهَا، وَلِدِينِهَا، فَاظْفَرْ بِذَاتِ الدِّينِ تَرِبَتْ يَدَاكَ» (متفق عليه).",["ابدأ بإصلاح نفسك، فالطيبات للطيبين.","استشر أهلك واستخر الله.","اهتم بالدين والخلق قبل كل شيء."]],["الكسب الحلال والمستقبل","«مَا أَكَلَ أَحَدٌ طَعَامًا قَطُّ خَيْرًا مِنْ أَنْ يَأْكُلَ مِنْ عَمَلِ يَدِهِ» (رواه البخاري). عملك في المطعم أو أي مكان شرف إذا كان حلالًا.",["أتقن عملك، فهو باب رزقك وسمعتك.","تعلّم مهارة في مجال دراستك (البرمجة مثلًا) كل أسبوع.","ادّخر جزءًا من دخلك ولو قليلًا."]]],qe=[["مصعب بن عمير","كان أنعم شاب في مكة، يلبس أحسن الثياب وأطيب العطر. أسلم فترك ذلك كله لله، وأرسله النبي ﷺ إلى المدينة يعلّم أهلها القرآن، فأسلم على يديه سادتها مثل سعد بن معاذ وأُسيد بن حُضير. واستُشهد يوم أُحد حاملًا اللواء، ولم يجدوا ما يكفّنونه به إلا بُردة إذا غطّوا بها رأسه بدت رجلاه (رواه البخاري).","الإسلام يستحق أن تترك له ما تحب."],["أسامة بن زيد","أمّره النبي ﷺ على جيش فيه كبار الصحابة، وعمره نحو ثماني عشرة سنة. فتكلّم بعض الناس في إمارته، فقال ﷺ: «إِنْ تَطْعُنُوا فِي إِمَارَتِهِ فَقَدْ كُنْتُمْ تَطْعُنُونَ فِي إِمَارَةِ أَبِيهِ مِنْ قَبْلُ، وَايْمُ اللَّهِ إِنْ كَانَ لَخَلِيقًا لِلْإِمَارَةِ» (متفق عليه).","صِغر السن لا يمنع من المسؤولية والقيادة."],["عبد الله بن عباس","دعا له النبي ﷺ وهو غلام: «اللَّهُمَّ فَقِّهْهُ فِي الدِّينِ» (رواه البخاري)، وعلّمه: «احْفَظِ اللَّهَ يَحْفَظْكَ». وبعد وفاة النبي ﷺ طلب العلم بجدّ، حتى كان يجلس على باب الصحابي ينتظره والريح تسفي عليه التراب. فصار حَبر الأمة وترجمان القرآن.","العلم يحتاج صبرًا وتواضعًا، والشباب أفضل وقت لطلبه."],["معاذ بن جبل","أسلم شابًا، وقال عنه النبي ﷺ: «وَأَعْلَمُهُمْ بِالحَلَالِ وَالحَرَامِ مُعَاذُ بْنُ جَبَلٍ» (رواه الترمذي). أرسله إلى اليمن معلّمًا وقاضيًا، وأخذ بيده يومًا وقال: «يَا مُعَاذُ، وَاللَّهِ إِنِّي لَأُحِبُّكَ… لَا تَدَعَنَّ فِي دُبُرِ كُلِّ صَلَاةٍ أَنْ تَقُولَ: اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ» (رواه أبو داود).","هذا الدعاء موجود في أذكار بعد الصلاة؛ قله وأنت تتذكر معاذًا."],["علي بن أبي طالب","أسلم صغيرًا، ونام في فراش النبي ﷺ ليلة الهجرة وهو يعلم أن المشركين يريدون قتله. ويوم خيبر قال ﷺ: «لَأُعْطِيَنَّ الرَّايَةَ غَدًا رَجُلًا يُحِبُّ اللَّهَ وَرَسُولَهُ، وَيُحِبُّهُ اللَّهُ وَرَسُولُهُ» فأعطاها عليًّا، ففتح الله على يديه (متفق عليه).","الشجاعة والتضحية من صفات الشباب المؤمن."],["زيد بن ثابت","كان شابًا ذكيًا، أمره النبي ﷺ أن يتعلّم كتابة اليهود فتعلّمها في نحو نصف شهر (رواه الترمذي). وكان من كتّاب الوحي، واختاره أبو بكر لجمع القرآن وقال له: «إِنَّكَ رَجُلٌ شَابٌّ عَاقِلٌ لَا نَتَّهِمُكَ» (رواه البخاري).","موهبتك وتعلّمك للغات والمهارات خدمة للإسلام."],["أصحاب الكهف","﴿إِنَّهُمْ فِتْيَةٌ آمَنُوا بِرَبِّهِمْ وَزِدْنَاهُمْ هُدًى﴾. شباب ثبتوا على التوحيد وسط قوم كفار، فتركوا كل شيء وفرّوا بدينهم، فحفظهم الله وجعلهم آية.","الثبات وسط بيئة صعبة ممكن، والله يزيد المهتدي هدى."]];function chHTML(){const t=chGet();if(!t)return`<div class="card hd"><h3>تحدّي الأربعين يومًا</h3><p class="txt shint">كل يوم مهمة صغيرة تبني فيك عادة صالحة. أربعون يومًا تكفي لتغيير كثير من حياتك بإذن الله.</p><div class="meta"><button class="pri" id="chStart">ابدأ التحدّي اليوم</button></div></div><div class="card"><b>أمثلة من المهام:</b><ul class="sul">${we.slice(0,5).map(t=>`<li>${t}</li>`).join("")}</ul></div>`;const e=Math.min(40,daysSince(t.s)+1),a=Object.keys(t.d||{}).length,n=!!(t.d||{})[e],s=Object.entries(xe).map(([t,e])=>`<div class="bdg${a>=+t?" got":""}"><b>${a>=+t?"🏅":"🔒"}</b><span>${e}</span><small>${ar(+t)} يومًا</small></div>`).join("");return`<div class="card hd chhero"><h3>تحدّي الأربعين — اليوم ${ar(e)}</h3><p class="chtask">${we[e-1]}</p><div class="meta"><button class="pri${n?" done":""}" id="chDo" ${n?"disabled":""}>${n?"✓ أنجزت مهمة اليوم":"أنجزتها ✓"}</button></div></div>\n <div class="tprog" style="margin:10px 4px"><i style="width:${a/40*100}%"></i></div><p class="note" style="text-align:center;margin:0 0 10px">أنجزت ${ar(a)} من ٤٠ يومًا</p>\n <div class="bdgs">${s}</div>\n <h2 class="sec">أيام التحدّي</h2><div class="chgrid">${we.map((a,n)=>`<button class="chd${(t.d||{})[n+1]?" cok":""}${n+1===e?" cnow":""}${n+1>e?" clk":""}" data-chd="${n+1}">${ar(n+1)}</button>`).join("")}</div>\n <p class="note" id="chNote" style="margin:8px 4px">اضغط على أي يوم سابق لترى مهمته. يمكنك إنجاز يوم فاتك لاحقًا.</p>\n <button class="lnk" id="chReset" style="margin:6px 4px">إعادة التحدّي من البداية</button>`}function wirdHTML(){const t=wGet(),e=t.d.length,a=getLast();return`<div class="card hd"><h3>ورد الشاب اليومي — ٥ دقائق</h3><p class="txt shint">للمشغول بين الدراسة والعمل: قليل دائم خير من كثير منقطع.</p></div>\n <div class="tprog" style="margin:10px 4px"><i style="width:${e/Me.length*100}%"></i></div><p class="note" style="text-align:center;margin:0 0 10px">${e===Me.length?"ما شاء الله! أتممت وردك اليوم":`${ar(e)} من ${ar(Me.length)}`}</p>\n <div class="card wlist">${Me.map(([e,a],n)=>`<button class="witem${t.d.includes(n)?" ok":""}" data-wi="${n}"><span class="wchk">${t.d.includes(n)?"✓":""}</span><span><b>${e}</b><small>${a}</small></span></button>`).join("")}</div>\n <div class="row" style="justify-content:center;gap:8px;margin-top:8px"><a class="btnl" href="${a&&a.p?"#page-"+a.p:"#quran"}">افتح المصحف لصفحتك ‹</a><a class="btnl" href="#morning">أذكار الصباح كاملة ‹</a></div>`}function qaHTML(){return`<p class="note" style="margin:2px 4px 10px;font-size:14px">أسئلة يخجل كثير من الشباب أن يسألوها. اضغط على السؤال لترى الجواب.</p>${Se.map(([t,e],a)=>`<details class="card sin" data-cpbox><summary><div><b>${gGirl()&&4===a?Be.qa4[0]:t}</b></div><span class="chev">‹</span></summary><div class="sbody">${CPB()}${Ee.qa[a]?gqN(Ee.qa[a].n)+gqW(Ee.qa[a].w)+(Ee.qa[a].p?`<h4>${gqE()?"Practical advice":"نصيحة عملية"}</h4>${gqT()}<p class="qa">${gqE()?Ee.qa[a].p[1]:Ee.qa[a].p[0]}</p>`:""):`<p class="qa">${e}</p>`}</div></details>`).join("")}<p class="note" style="margin:8px 4px">هذه أجوبة عامة. في المسائل الخاصة بك اسأل أهل العلم الثقات.</p>`}function buildHTML(){return`<div class="card hd"><h3>بناء النفس</h3><p class="txt shint">${gqE()?gGirl()?"A Muslim young woman is strong in her religion and successful in her worldly life. Short cards: a text from the Quran and Sunnah, then the words of scholars, then practical steps.":"A Muslim young man is strong in his religion and successful in his worldly life. Short cards: a text from the Quran and Sunnah, then the words of scholars, then practical steps.":gGirl()?"الفتاة المسلمة قوية في دينها، ناجحة في دنياها. بطاقات قصيرة: نصّ من الكتاب والسنة، ثم كلام العلماء، ثم خطوات عملية.":"الشاب المسلم قوي في دينه، ناجح في دنياه. بطاقات قصيرة: نصّ من الكتاب والسنة، ثم كلام العلماء، ثم خطوات عملية."}</p></div>${Ie.map(([t,e,a],n)=>{const s=gGirl()&&7===n;return s&&(t="اختيار الزوج",a=Be.hus_st[0]),`<details class="card sin" data-cpbox><summary><div><b>${t}</b></div><span class="chev">‹</span></summary><div class="sbody">${CPB()}${s?gqN(Be.hus_n):Ee.buildn[n]?gqN([Ee.buildn[n]]):`<p class="qa">${e}</p>`}${gqW(s?Be.hus_w:Ee.build[n])}<h4>خطوات عملية</h4>${gqT()}<ol class="sol">${a.map(t=>`<li>${t}</li>`).join("")}</ol></div></details>`}).join("")}`}function sahabaHTML(){return`<div class="card hd"><h3>شباب حول النبي ﷺ</h3>${gqQ(Ee.sahead)}</div>${qe.map(([t,e,a],n)=>`<details class="card sin" data-cpbox><summary><div><b>${t}</b></div><span class="chev">‹</span></summary><div class="sbody">${CPB()}${Ee.sahaba[n]?gqN(Ee.sahn[n])+`<h4>${gqE()?"From the books of biography and tafsir":"من كتب السِّيَر والتفسير"}</h4>`+Ee.sahaba[n].map(gqQ).join(""):`<p class="qa">${e}</p><div class="lesson"><b>الدرس:</b> ${a}</div>`}</div></details>`).join("")}`}function libHTML(){return`<div class="card hd"><h3>المكتبة الصوتية</h3><p class="txt shint">كتب ورسائل مسموعة تُشغَّل داخل التطبيق. استمع في المواصلات أو وقت العمل.</p></div>${$e.map(([t,e])=>`<h2 class="sec">${t}</h2><div class="card rcard">${e.map(t=>`<button class="rlink" data-rv="${t}"><span class="rico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span><b>${be[t][0]}</b><small>استمع</small></button>`).join("")}</div>`).join("")}<p class="note" style="margin:8px 4px">تُشغَّل من يوتيوب داخل التطبيق، وتحتاج إنترنت، وتتوقف عند قفل الشاشة.</p>`}const Ae=[{k:"why",t:"لماذا خُلقت؟",s:"السؤال الذي يغيّر كل شيء",x:"أغلب الناس يعيشون سنوات طويلة دون أن يسألوا أنفسهم هذا السؤال بصدق. تدرس لتعمل، وتعمل لتعيش، وتعيش… لماذا؟ الجواب في القرآن واضح: خُلقتَ لتعبد الله. والعبادة ليست الصلاة وحدها؛ دراستك بنيّة، وعملك بإتقان، وبرّك بأهلك، وتركك للحرام وأنت قادر عليه — كلها عبادة. حين تعرف لماذا تعيش، يصير لكل تعب معنى، ولكل يوم وزن.",n:[["﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾","الذاريات ٥٦"],["﴿أَفَحَسِبْتُمْ أَنَّمَا خَلَقْنَاكُمْ عَبَثًا وَأَنَّكُمْ إِلَيْنَا لَا تُرْجَعُونَ﴾","المؤمنون ١١٥"],["«إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى».","متفق عليه"]],d:["قبل أن تبدأ دراستك أو عملك اليوم، قل في نفسك: «أفعل هذا لله، لأعفّ نفسي وأنفع غيري».","اكتب في ورقة: ماذا أريد أن يُكتب عني بعد موتي؟","اختر عادة واحدة تفعلها يوميًا وتجعلها لله خالصة."],q:"لو سألك الله غدًا: ماذا فعلتَ بعمرك؟ ماذا ستقول اليوم بصدق؟"},{k:"doubt",t:"حين تأتيك الشكوك",s:"الوسوسة في الإيمان ليست كفرًا",x:"كثير من الشباب تأتيهم أفكار مخيفة عن الله أو عن الدين، فيظن أحدهم أنه خرج من الإسلام، فيحزن أو يبتعد. اطمئن: الصحابة أنفسهم شكوا للنبي ﷺ مثل هذا، فقال لهم إن كراهيتهم لهذه الأفكار هي «صَرِيحُ الإِيمَانِ». الشيطان لا يوسوس لبيتٍ خَرِب، بل لقلبٍ فيه إيمان يريد أن يسرقه. والعلاج ليس الجدال الطويل مع الوسوسة، بل أن تستعيذ بالله وتتركها، ثم تتعلّم دينك من مصدر موثوق.",n:[["جاء ناس من أصحاب النبي ﷺ فقالوا: إنا نجد في أنفسنا ما يتعاظم أحدنا أن يتكلم به، قال: «وَقَدْ وَجَدْتُمُوهُ؟» قالوا: نعم، قال: «ذَاكَ صَرِيحُ الإِيمَانِ».","رواه مسلم"],["«يَأْتِي الشَّيْطَانُ أَحَدَكُمْ فَيَقُولُ: مَنْ خَلَقَ كَذَا؟ مَنْ خَلَقَ كَذَا؟ حَتَّى يَقُولَ: مَنْ خَلَقَ رَبَّكَ؟ فَإِذَا بَلَغَهُ فَلْيَسْتَعِذْ بِاللَّهِ وَلْيَنْتَهِ».","متفق عليه"],["﴿أَمْ خُلِقُوا مِنْ غَيْرِ شَيْءٍ أَمْ هُمُ الْخَالِقُونَ﴾","الطور ٣٥"],["﴿سَنُرِيهِمْ آيَاتِنَا فِي الْآفَاقِ وَفِي أَنفُسِهِمْ حَتَّىٰ يَتَبَيَّنَ لَهُمْ أَنَّهُ الْحَقُّ﴾","فصلت ٥٣"]],d:["إذا جاءتك الفكرة: قل «أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ، آمَنْتُ بِاللَّهِ وَرُسُلِهِ» واشغل نفسك بشيء آخر فورًا.","لا تبحث عن الشبهات في مواقع ومقاطع مجهولة؛ اسأل عالمًا أو طالب علم تثق به.","تعلّم أصول عقيدتك من كتاب مختصر موثوق، مثل «الأصول الثلاثة» مع شرحه."],q:"هل خوفك وانزعاجك من هذه الأفكار يدل على أنك تحب الله؟ اكتب ما تشعر به."},{k:"iman",t:"حلاوة الإيمان",s:"لذّة لا يعرفها إلا من ذاقها",x:"للإيمان طعمٌ حقيقي يجده القلب، كما يجد اللسان طعم العسل. بعض الناس يصلّي ويصوم سنوات ولم يذق هذه الحلاوة، لأنه يؤدي العبادة كعادة لا كمحبة. النبي ﷺ وضع لنا ثلاثة مفاتيح لها: أن يكون الله ورسوله أحب إليك من كل شيء، وأن تحب الناس لله لا لمصلحة، وأن تكره المعصية كما تكره أن تُرمى في النار. ابدأ بالأول: أن تعرف الله بأسمائه ونعمه عليك، فمن عرفه أحبّه.",n:[["«ثَلَاثٌ مَنْ كُنَّ فِيهِ وَجَدَ حَلَاوَةَ الإِيمَانِ: أَنْ يَكُونَ اللَّهُ وَرَسُولُهُ أَحَبَّ إِلَيْهِ مِمَّا سِوَاهُمَا، وَأَنْ يُحِبَّ المَرْءَ لَا يُحِبُّهُ إِلَّا لِلَّهِ، وَأَنْ يَكْرَهَ أَنْ يَعُودَ فِي الكُفْرِ كَمَا يَكْرَهُ أَنْ يُقْذَفَ فِي النَّارِ».","متفق عليه"],["«ذَاقَ طَعْمَ الإِيمَانِ مَنْ رَضِيَ بِاللَّهِ رَبًّا، وَبِالإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ رَسُولًا».","رواه مسلم"],["﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾","الرعد ٢٨"]],d:["عدّد اليوم خمس نِعَم أعطاك الله إياها، واحمده على كل واحدة.","تعلّم معنى اسم واحد من أسماء الله هذا الأسبوع، وفكّر فيه.","صلِّ ركعتين في الليل لا يعلم بهما أحد إلا الله."],q:"متى آخر مرة شعرت بقرب حقيقي من الله؟ ماذا كنت تفعل وقتها؟"},{k:"sincere",t:"الإخلاص في زمن السوشيال ميديا",s:"لمن تعمل؟",x:"نحن في زمن يُصوَّر فيه كل شيء: الصدقة، والعمرة، وختمة القرآن. وليس كل نشرٍ رياءً، لكن القلب ضعيف، ويحب المدح والإعجابات. الخطر أن يصير ميزانك هو عدد المشاهدات لا رضا الله. قاعدة جميلة من السلف: اجعل لك أعمالًا خفية بينك وبين الله، كما للمذنب ذنوب خفية. ولا تترك العمل الصالح خوفًا من الرياء؛ فهذا فخّ آخر من الشيطان، بل اعمل وصحّح نيتك.",n:[["«إِنَّ اللَّهَ لَا يَنْظُرُ إِلَى صُوَرِكُمْ وَأَمْوَالِكُمْ، وَلَكِنْ يَنْظُرُ إِلَى قُلُوبِكُمْ وَأَعْمَالِكُمْ».","رواه مسلم"],["«مَنْ سَمَّعَ سَمَّعَ اللَّهُ بِهِ، وَمَنْ يُرَائِي يُرَائِي اللَّهُ بِهِ».","متفق عليه"],["﴿فَمَن كَانَ يَرْجُو لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلًا صَالِحًا وَلَا يُشْرِكْ بِعِبَادَةِ رَبِّهِ أَحَدًا﴾","الكهف ١١٠"]],d:["اعمل اليوم عملًا صالحًا واحدًا لا يعرفه أحد: صدقة، أو دعاء لأخ بظهر الغيب.","قبل أن تنشر شيئًا عن عبادتك اسأل نفسك: هل يزيد هذا أجري أم يُنقصه؟","ادعُ: «اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أُشْرِكَ بِكَ وَأَنَا أَعْلَمُ، وَأَسْتَغْفِرُكَ لِمَا لَا أَعْلَمُ»."],q:"لو لم يرَ أحدٌ عباداتك أبدًا، هل كنت ستفعلها بنفس الطريقة؟"},{k:"ghurba",t:"حين تكون الوحيد الملتزم",s:"غربة الطريق",x:"قد تكون الوحيد في صفك أو عملك أو بين أصدقائك الذي يصلي في وقتها، أو يغض بصره، أو يرفض الحرام. فتشعر بالغربة، وربما بالسخرية. هذا الشعور ليس علامة أنك على خطأ، بل قد يكون علامة أنك على الطريق الصحيح؛ فالنبي ﷺ أخبر أن الإسلام سيعود غريبًا، وبشّر الغرباء. الكثرة ليست دليل الحق، والقلّة ليست دليل الباطل. ابحث عن صحبة صالحة ولو كانت شخصًا واحدًا، واثبت.",n:[["«بَدَأَ الإِسْلَامُ غَرِيبًا، وَسَيَعُودُ كَمَا بَدَأَ غَرِيبًا، فَطُوبَى لِلْغُرَبَاءِ».","رواه مسلم"],["«يَأْتِي عَلَى النَّاسِ زَمَانٌ الصَّابِرُ فِيهِمْ عَلَى دِينِهِ كَالقَابِضِ عَلَى الجَمْرِ».","رواه الترمذي — صحيح"],["﴿وَإِن تُطِعْ أَكْثَرَ مَن فِي الْأَرْضِ يُضِلُّوكَ عَن سَبِيلِ اللَّهِ﴾","الأنعام ١١٦"]],d:["ابحث عن مسجد قريب فيه درس أو حلقة، واحضره مرة هذا الأسبوع.","إذا سخر منك أحد، ابتسم ولا تجادل؛ ثباتك أبلغ من أي كلام.","ادعُ: «يَا مُقَلِّبَ القُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ»."],q:"ما الموقف الذي شعرت فيه بالغربة بسبب دينك؟ وكيف تتصرف لو تكرّر؟"},{k:"hamm",t:"الهمّ والقلق",s:"قلبك يحتاج رعاية أيضًا",x:"القلق من المستقبل، وضغط الدراسة والعمل، والمقارنة بالآخرين — كلها تثقل قلب الشاب. الإسلام لا يطلب منك أن تكون بلا مشاعر، فالنبي ﷺ نفسه حزن وبكى. لكنه علّمك أين تضع همّك: في الدعاء، والتوكل، والعمل بما في يدك وترك ما ليس في يدك. واعلم أن طلب المساعدة من شخص تثق به لا يعني ضعف إيمانك؛ بل هو من الأخذ بالأسباب.",n:[["«مَا أَصَابَ أَحَدًا قَطُّ هَمٌّ وَلَا حَزَنٌ فَقَالَ: اللَّهُمَّ إِنِّي عَبْدُكَ، ابْنُ عَبْدِكَ، ابْنُ أَمَتِكَ، نَاصِيَتِي بِيَدِكَ، مَاضٍ فِيَّ حُكْمُكَ، عَدْلٌ فِيَّ قَضَاؤُكَ، أَسْأَلُكَ بِكُلِّ اسْمٍ هُوَ لَكَ… أَنْ تَجْعَلَ القُرْآنَ رَبِيعَ قَلْبِي، وَنُورَ صَدْرِي، وَجَلَاءَ حُزْنِي، وَذَهَابَ هَمِّي، إِلَّا أَذْهَبَ اللَّهُ هَمَّهُ وَحَزَنَهُ وَأَبْدَلَهُ مَكَانَهُ فَرَحًا».","رواه أحمد — صحيح"],["«عَجَبًا لِأَمْرِ المُؤْمِنِ، إِنَّ أَمْرَهُ كُلَّهُ خَيْرٌ… إِنْ أَصَابَتْهُ سَرَّاءُ شَكَرَ فَكَانَ خَيْرًا لَهُ، وَإِنْ أَصَابَتْهُ ضَرَّاءُ صَبَرَ فَكَانَ خَيْرًا لَهُ».","رواه مسلم"],["دعوة ذي النون: «لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ»، «لَمْ يَدْعُ بِهَا رَجُلٌ مُسْلِمٌ فِي شَيْءٍ قَطُّ إِلَّا اسْتَجَابَ اللَّهُ لَهُ».","رواه الترمذي — صحيح"]],d:["احفظ دعاء الهم «اللَّهُمَّ إِنِّي عَبْدُكَ…» وقله الليلة.","اكتب ما يقلقك في قائمتين: «بيدي» فاعمل له، و«ليس بيدي» فادعُ وتوكّل.","نم مبكرًا وامشِ ٢٠ دقيقة؛ جسدك يؤثر في قلبك. وإن طال الحزن أو جاءتك أفكار بإيذاء نفسك، فكلّم أهلك أو شخصًا تثق به فورًا."],q:"ما أكثر شيء يقلقك الآن؟ هل هو بيدك أم ليس بيدك؟"},{k:"death",t:"تذكّر الموت… لتعيش",s:"ليس للتخويف، بل للإيقاظ",x:"الموت لا يستأذن، ولا يفرّق بين شاب وشيخ؛ وكم من شاب دفنّاه قبل أبيه. تذكّر الموت لا يعني أن تعيش حزينًا، بل أن تعيش منتبهًا: تؤجل المعصية لا التوبة، وتستعجل الخير لا اللهو. قال بعض السلف: لو قيل لي إنك تموت غدًا ما وجدتُ شيئًا أزيده في عملي. هذا هو الهدف: أن تكون مستعدًا في كل يوم.",n:[["﴿كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ ۗ وَإِنَّمَا تُوَفَّوْنَ أُجُورَكُمْ يَوْمَ الْقِيَامَةِ﴾","آل عمران ١٨٥"],["«أَكْثِرُوا ذِكْرَ هَاذِمِ اللَّذَّاتِ» يعني الموت.","رواه الترمذي — صحيح"],["«كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ أَوْ عَابِرُ سَبِيلٍ».","رواه البخاري"]],d:["هل عندك حقوق للناس أو ديون؟ اكتبها وابدأ بردّها.","صالح اليوم شخصًا بينك وبينه خصام.","زر المقبرة مرة، وسلّم على أهلها، وتفكّر."],q:"لو علمت أن هذا آخر أسبوع في حياتك، ما الذي ستغيّره فورًا؟"},{k:"janna",t:"الجنة: لماذا تصبر؟",s:"الثمن يستحق",x:"كل شاب يترك شهوة محرمة، أو يقوم لصلاة الفجر وهو متعب، يسأل نفسه أحيانًا: لماذا كل هذا؟ الجواب: لأن الذي ينتظرك لا يخطر على قلبك. الجنة محفوفة بالمكاره، أي بالأشياء الصعبة على النفس، والنار محفوفة بالشهوات. فكل صبرٍ تصبره الآن هو خطوة في الطريق. واللذة المحرمة تذهب في دقائق ويبقى أثرها، والتعب في الطاعة يذهب ويبقى أجره.",n:[["قال الله تعالى: «أَعْدَدْتُ لِعِبَادِيَ الصَّالِحِينَ مَا لَا عَيْنٌ رَأَتْ، وَلَا أُذُنٌ سَمِعَتْ، وَلَا خَطَرَ عَلَى قَلْبِ بَشَرٍ».","متفق عليه"],["«حُفَّتِ الجَنَّةُ بِالمَكَارِهِ، وَحُفَّتِ النَّارُ بِالشَّهَوَاتِ».","رواه مسلم"],["﴿وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِ وَنَهَى النَّفْسَ عَنِ الْهَوَىٰ ۝ فَإِنَّ الْجَنَّةَ هِيَ الْمَأْوَىٰ﴾","النازعات ٤٠–٤١"]],d:["عندما تضعف أمام معصية، قل لنفسك: «هل تستحق هذه الدقائق أن أخسر بها الجنة؟»","اقرأ آيات وصف الجنة في سورة الواقعة (من الآية ١٠).","ادعُ في كل سجود: «اللَّهُمَّ إِنِّي أَسْأَلُكَ الجَنَّةَ، وَأَعُوذُ بِكَ مِنَ النَّارِ»."],q:"ما الشهوة أو العادة التي تحتاج أن تتركها من أجل الجنة؟"},{k:"athar",t:"كن نافعًا… اترك أثرًا",s:"لا تكن رقمًا في الحياة",x:"بعض الناس يعيش ويموت ولم يتغيّر بسببه شيء. والمؤمن يريد أن يترك أثرًا يبقى بعده: علمًا ينفع، أو شخصًا اهتدى بسببه، أو صدقة جارية. وليس الأثر للمشهورين فقط؛ كلمة طيبة لصديق، ومساعدة زميل في دراسته، وتعليم أخيك الصغير سورة — كلها أثر قد يكون أعظم مما تتصوّر. أنت لم تُخلق لتعيش لنفسك فقط.",n:[["«مَنْ دَعَا إِلَى هُدًى كَانَ لَهُ مِنَ الأَجْرِ مِثْلُ أُجُورِ مَنْ تَبِعَهُ، لَا يَنْقُصُ ذَلِكَ مِنْ أُجُورِهِمْ شَيْئًا».","رواه مسلم"],["«لَأَنْ يَهْدِيَ اللَّهُ بِكَ رَجُلًا وَاحِدًا خَيْرٌ لَكَ مِنْ حُمْرِ النَّعَمِ».","متفق عليه"],["«أَحَبُّ النَّاسِ إِلَى اللَّهِ أَنْفَعُهُمْ لِلنَّاسِ».","رواه الطبراني — حسن"]],d:["انشر اليوم آية أو حديثًا صحيحًا لشخص تحبه، مع كلمة طيبة.","علّم أحدًا شيئًا تعرفه: سورة، أو درسًا، أو مهارة.","ساعد زميلًا في الدراسة أو العمل دون أن ينتظر منك ذلك."],q:"ما الأثر الذي تريد أن تتركه بعدك؟ ومن أين تبدأ هذا الشهر؟"}],Ee=Object.assign({},window.GQ_D),gqE=()=>"en"===De,gqQ=t=>`<blockquote class="wq"${gqE()?' dir="ltr"':""} data-cpbox>${CPB()}<p>${gqE()?t[3]||"":t[0]||""}«${gqE()?t[4]:t[1]}»</p><cite>— ${gqE()?t[5]:t[2]}</cite></blockquote>`,gqW=t=>t&&t.length?`<h4>${gqE()?"From the words of the scholars":"من كلام العلماء"}</h4>`+t.map(gqQ).join(""):"",gqN=t=>(t||[]).map(t=>`<div class="snus" data-cpbox${gqE()?' dir="ltr"':""}>${CPB()}<p>${gqE()?t[2]:t[0]}</p><small>${gqE()?t[3]:t[1]}</small></div>`).join(""),gqP=t=>[(gqE()?t[3]||"":t[0]||"")+"«"+(gqE()?t[4]:t[1])+"»",gqE()?t[5]:t[2]],gqT=()=>`<p class="gqn">${gqE()?"Practical tips prepared by the Ghiras team — not quotations from scholars.":"نصائح عملية من إعداد فريق غِراس، وليست من كلام العلماء."}</p>`,Be={hijab_n:[["﴿وَقُل لِّلْمُؤْمِنَاتِ يَغْضُضْنَ مِنْ أَبْصَارِهِنَّ وَيَحْفَظْنَ فُرُوجَهُنَّ وَلَا يُبْدِينَ زِينَتَهُنَّ إِلَّا مَا ظَهَرَ مِنْهَا ۖ وَلْيَضْرِبْنَ بِخُمُرِهِنَّ عَلَىٰ جُيُوبِهِنَّ…﴾","النور ٣١","“And tell the believing women to reduce [some] of their vision and guard their private parts and not expose their adornment except that which [necessarily] appears thereof and to wrap [a portion of] their headcovers over their chests…”","An-Nur 31"],["﴿يَا أَيُّهَا النَّبِيُّ قُل لِّأَزْوَاجِكَ وَبَنَاتِكَ وَنِسَاءِ الْمُؤْمِنِينَ يُدْنِينَ عَلَيْهِنَّ مِن جَلَابِيبِهِنَّ ۚ ذَٰلِكَ أَدْنَىٰ أَن يُعْرَفْنَ فَلَا يُؤْذَيْنَ ۗ وَكَانَ اللَّهُ غَفُورًا رَّحِيمًا﴾","الأحزاب ٥٩","“O Prophet, tell your wives and your daughters and the women of the believers to bring down over themselves [part] of their outer garments. That is more suitable that they will be known and not be abused. And ever is Allah Forgiving and Merciful.”","Al-Ahzab 59"]],hijab_w:[["","وليضربن بخمرهن على جيوبهن، يعني المقانع، يعمل لها صنفات ضاربات على صدورهن، لتواري ما تحتها من صدرها وترائبها، ليخالفن شعار نساء أهل الجاهلية.","ابن كثير، «تفسير القرآن العظيم» (٣/ ٢٨٤)","","“And to wrap their headcovers over their chests” means the head-veils, made with flaps falling over their chests to cover what is beneath — the chest and upper body — so that they differ from the custom of the women of the Jahiliyyah.","Ibn Kathir, Tafsir al-Quran al-‘Azim (vol. 3, p. 284)"],["","والجلباب هو الرداء فوق الخمار، قاله ابن مسعود وعبيدة وقتادة والحسن البصري وسعيد بن جبير وإبراهيم النخعي وعطاء الخراساني وغير واحد.","ابن كثير، «تفسير القرآن العظيم» (٣/ ٥١٩)","","The jilbab is the outer cloak worn over the khimar (head-veil); this was said by Ibn Mas‘ud, ‘Ubaydah, Qatadah, al-Hasan al-Basri, Sa‘id ibn Jubayr, Ibrahim al-Nakha‘i, ‘Ata’ al-Khurasani and others.","Ibn Kathir, Tafsir al-Quran al-‘Azim (vol. 3, p. 519)"]],tight_n:[["«صِنْفَانِ مِنْ أَهْلِ النَّارِ لَمْ أَرَهُمَا: قَوْمٌ مَعَهُمْ سِيَاطٌ كَأَذْنَابِ الْبَقَرِ يَضْرِبُونَ بِهَا النَّاسَ، وَنِسَاءٌ كَاسِيَاتٌ عَارِيَاتٌ، مُمِيلَاتٌ مَائِلَاتٌ، رُءُوسُهُنَّ كَأَسْنِمَةِ الْبُخْتِ الْمَائِلَةِ، لَا يَدْخُلْنَ الْجَنَّةَ، وَلَا يَجِدْنَ رِيحَهَا»","رواه مسلم","“Two types of the people of the Fire I have not seen: people with whips like the tails of cattle with which they strike people, and women who are clothed yet naked, inclining and making others incline, their heads like the humps of camels leaning to one side. They will not enter Paradise nor smell its fragrance.”","Muslim"]],tight_w:[["","والثياب التي تبدي مقاطع خلقها، والثوب الرقيق الذي لا يستر البشرة، وغير ذلك، فإن المرأة تنهى عنه، وعلى وليها كأبيها وزوجها أن ينهاها عن ذلك.","ابن تيمية، «مجموع الفتاوى» (٢٢/ ١٥٦)","","Clothes that show the contours of her body, thin garments that do not cover the skin, and the like — a woman is forbidden from them, and her guardian, such as her father or husband, should forbid her from that.","Ibn Taymiyyah, Majmu‘ al-Fatawa (vol. 22, p. 156)"],["","أما الكاسيات ففيه أوجه: أحدها معناه كاسيات من نعمة الله عاريات من شكرها، والثاني كاسيات من الثياب عاريات من فعل الخير والاهتمام لآخرتهن والاعتناء بالطاعات، والثالث تكشف شيئًا من بدنها إظهارًا لجمالها فهن كاسيات عاريات، والرابع يلبسن ثيابًا رقاقًا تصف ما تحتها، كاسيات عاريات في المعنى.","النووي، «المنهاج شرح صحيح مسلم» (١٧/ ١٩٠)","","As for “clothed”, there are several meanings: first, clothed with Allah’s blessings but bare of gratitude for them; second, clothed in garments but bare of good deeds, concern for their Hereafter and attention to obedience; third, she uncovers part of her body to show her beauty, so they are clothed yet naked; fourth, they wear thin clothes that describe what is beneath — clothed, yet naked in reality.","Al-Nawawi, Sharh Sahih Muslim (vol. 17, p. 190)"]],tab_n:[["﴿وَقَرْنَ فِي بُيُوتِكُنَّ وَلَا تَبَرَّجْنَ تَبَرُّجَ الْجَاهِلِيَّةِ الْأُولَىٰ…﴾","الأحزاب ٣٣","“And abide in your houses and do not display yourselves as [was] the display of the former times of ignorance…”","Al-Ahzab 33"]],tab_w:[["في تفسير قوله تعالى: ﴿وَلَا تَبَرَّجۡنَ﴾ — ","قال مجاهد: كانت المرأة تخرج تمشي بين يدي الرجال، فذلك تبرج الجاهلية. وقال قتادة: … يقول: إذا خرجتن من بيوتكن، وكانت لهن مشية وتكسر وتغنج، فنهى الله تعالى عن ذلك. وقال مقاتل بن حيان: … والتبرج أنها تلقي الخمار على رأسها ولا تشده، فيواري قلائدها وقرطها وعنقها، ويبدو ذلك كله منها، وذلك التبرج.","ابن كثير، «تفسير القرآن العظيم» (٣/ ٤٨٣)","On the verse “and do not display yourselves” — ","Mujahid said: A woman would go out walking in front of men — that is the tabarruj of the Jahiliyyah. Qatadah said: When you go out of your houses — they had a swaying, flirtatious way of walking — Allah forbade that. Muqatil ibn Hayyan said: Tabarruj is that she puts the head-veil on her head without fastening it, so that her necklaces, earrings and neck are not covered and all of it shows — that is tabarruj.","Ibn Kathir, Tafsir al-Quran al-‘Azim (vol. 3, p. 483)"]],gaze:["﴿وَقُل لِّلْمُؤْمِنَاتِ يَغْضُضْنَ مِنْ أَبْصَارِهِنَّ وَيَحْفَظْنَ فُرُوجَهُنَّ…﴾","النور ٣١","“And tell the believing women to reduce [some] of their vision and guard their private parts…”","An-Nur 31"],hus_n:[["«إِذَا جَاءَكُمْ مَنْ تَرْضَوْنَ دِينَهُ وَخُلُقَهُ فَأَنْكِحُوهُ، إِلَّا تَفْعَلُوا تَكُنْ فِتْنَةٌ فِي الأَرْضِ وَفَسَادٌ عَرِيضٌ»","رواه الترمذي — حسن","“If someone whose religion and character you are pleased with comes to you (to propose), marry him (to her). If you do not, there will be tribulation on earth and widespread corruption.”","Al-Tirmidhi — Hasan"]],hus_w:[["","ينبغي للولي أن ينظر للمرأة في دين الرجل وأخلاقه وأحواله … وقال رجل للحسن: قد خطب ابنتي جماعة، فممن أزوجها؟ قال: ممن يتقي الله، فإنه إن أحبها أكرمها، وإن أبغضها لم يظلمها.","ابن الجوزي، «منهاج القاصدين» (ص ٣٤٩)","","The guardian should look, on the woman’s behalf, at the man’s religion, character and circumstances… A man said to al-Hasan: Several men have proposed to my daughter; whom should I marry her to? He said: To one who fears Allah — for if he loves her he will honor her, and if he dislikes her he will not wrong her.","Ibn al-Jawzi, Minhaj al-Qasidin (p. 349)"]],hus_st:[["ابدئي بإصلاح نفسك، فالطيبات للطيبين.","استشيري أهلك واستخيري الله.","اهتمي بالدين والخلق قبل كل شيء."],["Start by improving yourself; good women are for good men.","Consult your family and pray istikharah.","Look at religion and character before anything else."]],sin2:{t:["المحادثات المحرّمة مع الشباب","Forbidden chats with young men"],c:[["احذفي المحادثة والرقم مباشرة؛ نصف الحلول لا تنفع هنا.","لا تقبلي طلبات التواصل من شباب لا تعرفينهم، ولا ترسلي صورك لأحد.","الطريق الحلال واضح: من أرادك فليأتِ بيتك ويطلبك من أهلك.","املئي وقتك بصديقات صالحات ونشاط نافع."],["Delete the chat and the number right away; half-solutions don’t work here.","Don’t accept contact requests from young men you don’t know, and never send your photos to anyone.","The lawful way is clear: whoever wants you should come to your home and ask your family.","Fill your time with righteous friends and useful activities."]]},qa4:["أحب شابًا، ماذا أفعل؟","I love a young man. What should I do?"],sah:[["عائشة رضي الله عنها","‘A’ishah",[],[["قال الذهبي في وصفها: ","أفقه نساء الأمة على الإطلاق.","الذهبي، «سير أعلام النبلاء» (٢/ ١٣٥)","Al-Dhahabi described her as: ","The most knowledgeable woman of the Ummah in fiqh, without exception.","Al-Dhahabi, Siyar A‘lam al-Nubala’ (vol. 2, p. 135)"],["","كان عروة يقول لعائشة: يا أمتاه، لا أعجب من فقهك، أقول: زوجة نبي الله وابنة أبي بكر، ولا أعجب من علمك بالشعر وأيام الناس، أقول: ابنة أبي بكر، وكان أعلم الناس، ولكن أعجب من علمك بالطب.","الذهبي، «سير أعلام النبلاء» (٢/ ١٨٢)","","‘Urwah used to say to ‘A’ishah: “O mother, I am not amazed at your fiqh — I say: the wife of Allah’s Prophet and the daughter of Abu Bakr; nor at your knowledge of poetry and the history of the Arabs — I say: the daughter of Abu Bakr, who was the most knowledgeable of people; but I am amazed at your knowledge of medicine.”","Al-Dhahabi, Siyar A‘lam al-Nubala’ (vol. 2, p. 182)"]]],["أسماء بنت أبي بكر رضي الله عنهما","Asma’ bint Abi Bakr",[],[["قالت أسماء: ","صنعت سفرة النبي ﷺ في بيت أبي حين أراد أن يهاجر، فلم أجد لسفرته ولا لسقائه ما أربطهما، فقلت لأبي: ما أجد إلا نطاقي، قال: شقيه باثنين فاربطي بهما. قال: فلذلك سميت ذات النطاقين.","الذهبي، «سير أعلام النبلاء» (٢/ ٢٨٩)","Asma’ said: ","I prepared the provisions of the Prophet ﷺ in my father’s house when he wanted to emigrate, and I could not find anything to tie his food bag and water skin with. I said to my father: “I find nothing but my waistband.” He said: “Split it in two and tie them with it.” That is why she was called “the one with two waistbands”.","Al-Dhahabi, Siyar A‘lam al-Nubala’ (vol. 2, p. 289)"]]],["فاطمة رضي الله عنها","Fatimah",[["«فَاطِمَةُ بَضْعَةٌ مِنِّي»","متفق عليه","“Fatimah is a part of me.”","Agreed upon"]],[["قال الذهبي: ","وكانت صابرة دينة خيرة صينة قانعة شاكرة لله.","الذهبي، «سير أعلام النبلاء» (٢/ ١١٩)","Al-Dhahabi said: ","She was patient, religious, good, chaste, content and grateful to Allah.","Al-Dhahabi, Siyar A‘lam al-Nubala’ (vol. 2, p. 119)"]]],["أم سليم رضي الله عنها","Umm Sulaym",[],[["عن أنس رضي الله عنه: ","خطب أبو طلحة أم سليم فقالت: أما إني فيك لراغبة، وما مثلك يرد، ولكنك كافر، فإن تسلم فذلك مهري لا أسألك غيره. فأسلم وتزوجها. قال ثابت: فما سمعنا بمهر كان قط أكرم من مهر أم سليم: الإسلام.","الذهبي، «سير أعلام النبلاء» (٢/ ٢٩)","From Anas: ","Abu Talhah proposed to Umm Sulaym. She said: “I do desire you, and a man like you is not turned away — but you are a disbeliever. If you accept Islam, that will be my dowry; I ask nothing else.” He accepted Islam and married her. Thabit said: We never heard of a more honorable dowry than the dowry of Umm Sulaym: Islam.","Al-Dhahabi, Siyar A‘lam al-Nubala’ (vol. 2, p. 29)"]]]],tips:[["اختاري ثيابًا واسعة لا تصف الجسم ولا تشفّ عمّا تحتها.","اجعلي الخمار يغطي الشعر والعنق والصدر.","اسألي نفسك قبل الخروج: هل هذا اللباس يرضي الله؟","الحجاب عبادة تؤجرين عليها كل يوم؛ استحضري النية."],["Choose loose clothes that don’t show the body’s shape and aren’t see-through.","Let the head-veil cover the hair, neck and chest.","Ask yourself before going out: does this outfit please Allah?","Hijab is an act of worship you are rewarded for every day — keep the intention in mind."]]},gGirl=()=>{try{return"f"===localStorage.getItem("ygen")}catch(t){return!1}},gL=(t,e)=>gqE()?e:t;function hijabHTML(){const t=Be;return`<div class="card hd"><h3>${gL("الحجاب والعفاف","Hijab & modesty")}</h3><p <script>!function(){if(!/claude\.ai|claudeusercontent|anthropic|claude\.site/.test(location.hostname)){var t={"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ.":1,"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ، رَبِّ اغْفِرْ لِي.":2,"اللَّهُمَّ لَكَ الْحَمْدُ أَنْتَ كَسَوْتَنِيهِ، أَسْأَلُكَ مِنْ خَيْرِهِ وَخَيْرِ مَا صُنِعَ لَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّهِ وَشَرِّ مَا صُنِعَ لَهُ.":6,"التَّحِيَّاتُ لِلَّهِ، وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ.":52,"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ.":53,"اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا، وَلَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ، وَارْحَمْنِي، إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِيمُ.":57,"اللَّهُمَّ اغْفِرْ لِي مَا قَدَّمْتُ وَمَا أَخَّرْتُ، وَمَا أَسْرَرْتُ وَمَا أَعْلَنْتُ، وَمَا أَسْرَفْتُ، وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي، أَنْتَ الْمُقَدِّمُ وَأَنْتَ الْمُؤَخِّرُ، لَا إِلَهَ إِلَّا أَنْتَ.":58,"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبُخْلِ، وَأَعُوذُ بِكَ مِنَ الْجُبْنِ، وَأَعُوذُ بِكَ مِنْ أَنْ أُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الدُّنْيَا، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ.":60,"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ، وَأَعُوذُ بِكَ مِنَ النَّارِ.":61,"اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ، وَشُكْرِكَ، وَحُسْنِ عِبَادَتِكَ.":59,"اللهم اهدني فيمن هديت، وعافني فيمن عافيت، وتولّني فيمن تولّيت، وبارك لي فيما أعطيت، وقني شرّ ما قضيت، فإنك تقضي ولا يُقضى عليك، وإنه لا يذلّ من واليت، تباركت ربنا وتعاليت.":116,"سُبْحَانَ الْمَلِكِ الْقُدُّوسِ.":119,"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ.":180,"اللَّهُمَّ بَارِكْ لَهُمْ فِيمَا رَزَقْتَهُمْ، وَاغْفِرْ لَهُمْ وَارْحَمْهُمْ.":182,"ذَهَبَ الظَّمَأُ، وَابْتَلَّتِ الْعُرُوقُ، وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللَّهُ.":176,"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا.":105,"بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، فَإِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ.":102,"اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ.":104,"اللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَوَجَّهْتُ وَجْهِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لَا مَلْجَأَ وَلَا مَنْجَا مِنْكَ إِلَّا إِلَيْكَ، آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ.":111,"اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ، اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا الْبِرَّ وَالتَّقْوَى، وَمِنَ الْعَمَلِ مَا تَرْضَى، اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا وَاطْوِ عَنَّا بُعْدَهُ، اللَّهُمَّ أَنْتَ الصَّاحِبُ فِي السَّفَرِ، وَالْخَلِيفَةُ فِي الْأَهْلِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ وَعْثَاءِ السَّفَرِ، وَكَآبَةِ الْمَنْظَرِ، وَسُوءِ الْمُنْقَلَبِ فِي الْمَالِ وَالْأَهْلِ.":207,"أَسْتَوْدِعُ اللَّهَ دِينَكَ، وَأَمَانَتَكَ، وَخَوَاتِيمَ عَمَلِكَ.":212,"اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّهَا.":166,"اللَّهُمَّ صَيِّبًا نَافِعًا.":172,"مُطِرْنَا بِفَضْلِ اللَّهِ وَرَحْمَتِهِ.":173,"اللهم حوالينا ولا علينا، اللهم على الآكام والظِّراب، وبطون الأودية، ومنابت الشجر.":174,"اللهم إني أسألك خيرها، وخير ما فيها، وخير ما أُرسلت به، وأعوذ بك من شرها، وشر ما فيها، وشر ما أُرسلت به.":167,"سبحان الذي يسبّح الرعد بحمده والملائكة من خيفته.":168,"لَا بَأْسَ، طَهُورٌ إِنْ شَاءَ اللَّهُ.":147,"أَسْأَلُ اللَّهَ الْعَظِيمَ، رَبَّ الْعَرْشِ الْعَظِيمِ، أَنْ يَشْفِيَكَ.":148,"إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ، اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي، وَأَخْلِفْ لِي خَيْرًا مِنْهَا.":154,"الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي مِمَّا ابْتَلَاكَ بِهِ، وَفَضَّلَنِي عَلَى كَثِيرٍ مِمَّنْ خَلَقَ تَفْضِيلًا.":194,"بَارَكَ اللَّهُ لَكَ، وَبَارَكَ عَلَيْكَ، وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ.":190,"السَّلَامُ عَلَيْكُمْ أَهْلَ الدِّيَارِ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ، وَإِنَّا إِنْ شَاءَ اللَّهُ بِكُمْ لَاحِقُونَ، نَسْأَلُ اللَّهَ لَنَا وَلَكُمُ الْعَافِيَةَ.":165,"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أُشْرِكَ بِكَ وَأَنَا أَعْلَمُ، وَأَسْتَغْفِرُكَ لِمَا لَا أَعْلَمُ.":203,"أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ، آمَنْتُ بِاللَّهِ وَرُسُلِهِ.":134,"بِسْمِ اللَّهِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ.":10,"غُفْرَانَكَ.":11,"رَبِّ اغْفِرْ لِي، رَبِّ اغْفِرْ لِي.":48,"اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَاهْدِنِي، وَاجْبُرْنِي، وَعَافِنِي، وَارْزُقْنِي، وَارْفَعْنِي.":49,"اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ، وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ.":136,"اللَّهُمَّ لَا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا، وَأَنْتَ تَجْعَلُ الْحَزْنَ إِذَا شِئْتَ سَهْلًا.":139,"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ.":121,"سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ.":196,"أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ.":13,"اللَّهُمَّ اجْعَلْنِي مِنَ التَّوَّابِينَ، وَاجْعَلْنِي مِنَ الْمُتَطَهِّرِينَ.":14,"بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ.":16,"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أَضِلَّ أَوْ أُضَلَّ، أَوْ أَزِلَّ أَوْ أُزَلَّ، أَوْ أَظْلِمَ أَوْ أُظْلَمَ، أَوْ أَجْهَلَ أَوْ يُجْهَلَ عَلَيَّ.":17,"اللَّهُمَّ اجْعَلْ فِي قَلْبِي نُورًا، وَفِي لِسَانِي نُورًا، وَفِي سَمْعِي نُورًا، وَفِي بَصَرِي نُورًا، وَمِنْ فَوْقِي نُورًا، وَمِنْ تَحْتِي نُورًا، وَعَنْ يَمِينِي نُورًا، وَعَنْ شِمَالِي نُورًا، وَمِنْ أَمَامِي نُورًا، وَمِنْ خَلْفِي نُورًا، وَاجْعَلْ فِي نَفْسِي نُورًا، وَأَعْظِمْ لِي نُورًا.":19,"أَعُوذُ بِاللَّهِ الْعَظِيمِ، وَبِوَجْهِهِ الْكَرِيمِ، وَسُلْطَانِهِ الْقَدِيمِ، مِنَ الشَّيْطَانِ الرَّجِيمِ.":20,"بِسْمِ اللَّهِ، وَالصَّلَاةُ وَالسَّلَامُ عَلَى رَسُولِ اللَّهِ، اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ.":21,"بِسْمِ اللَّهِ، وَالصَّلَاةُ وَالسَّلَامُ عَلَى رَسُولِ اللَّهِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ.":21,"يصلي على النبي ﷺ ثم يقول: اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ، وَالصَّلَاةِ الْقَائِمَةِ، آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ، وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ.":25,"اللَّهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ، اللَّهُمَّ نَقِّنِي مِنْ خَطَايَايَ كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ، اللَّهُمَّ اغْسِلْنِي مِنْ خَطَايَايَ بِالثَّلْجِ وَالْمَاءِ وَالْبَرَدِ.":27,"سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، وَتَبَارَكَ اسْمُكَ، وَتَعَالَى جَدُّكَ، وَلَا إِلَهَ غَيْرُكَ.":28,"سُبْحَانَ رَبِّيَ الْعَظِيمِ.":33,"سُبْحَانَكَ اللَّهُمَّ رَبَّنَا وَبِحَمْدِكَ، اللَّهُمَّ اغْفِرْ لِي.":34,"سُبُّوحٌ قُدُّوسٌ، رَبُّ الْمَلَائِكَةِ وَالرُّوحِ.":35,"اللَّهُمَّ لَكَ رَكَعْتُ، وَبِكَ آمَنْتُ، وَلَكَ أَسْلَمْتُ، خَشَعَ لَكَ سَمْعِي، وَبَصَرِي، وَمُخِّي، وَعَظْمِي، وَعَصَبِي.":36,"سُبْحَانَ ذِي الْجَبَرُوتِ، وَالْمَلَكُوتِ، وَالْكِبْرِيَاءِ، وَالْعَظَمَةِ.":37,"سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ.":38,"رَبَّنَا وَلَكَ الْحَمْدُ، حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ.":39,"سُبْحَانَ رَبِّيَ الْأَعْلَى.":41,"اللَّهُمَّ لَكَ سَجَدْتُ، وَبِكَ آمَنْتُ، وَلَكَ أَسْلَمْتُ، سَجَدَ وَجْهِي لِلَّذِي خَلَقَهُ وَصَوَّرَهُ، وَشَقَّ سَمْعَهُ وَبَصَرَهُ، تَبَارَكَ اللَّهُ أَحْسَنُ الْخَالِقِينَ.":44,"اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ، دِقَّهُ وَجِلَّهُ، وَأَوَّلَهُ وَآخِرَهُ، وَعَلَانِيَتَهُ وَسِرَّهُ.":46,"اللَّهُمَّ إِنِّي أَعُوذُ بِرِضَاكَ مِنْ سَخَطِكَ، وَبِمُعَافَاتِكَ مِنْ عُقُوبَتِكَ، وَأَعُوذُ بِكَ مِنْكَ، لَا أُحْصِي ثَنَاءً عَلَيْكَ، أَنْتَ كَمَا أَثْنَيْتَ عَلَى نَفْسِكَ.":47,"سَجَدَ وَجْهِي لِلَّذِي خَلَقَهُ، وَشَقَّ سَمْعَهُ وَبَصَرَهُ، بِحَوْلِهِ وَقُوَّتِهِ.":50,"اللَّهُمَّ اكْتُبْ لِي بِهَا عِنْدَكَ أَجْرًا، وَضَعْ عَنِّي بِهَا وِزْرًا، وَاجْعَلْهَا لِي عِنْدَكَ ذُخْرًا، وَتَقَبَّلْهَا مِنِّي كَمَا تَقَبَّلْتَهَا مِنْ عَبْدِكَ دَاوُدَ.":51,"اللهم اكفني بحلالك عن حرامك، وأغنني بفضلك عمن سواك.":136,"اللهم لا سهل إلا ما جعلته سهلًا، وأنت تجعل الحزن إذا شئت سهلًا.":139,"اللهم إني ظلمت نفسي ظلمًا كثيرًا، ولا يغفر الذنوب إلا أنت، فاغفر لي مغفرة من عندك، وارحمني، إنك أنت الغفور الرحيم.":57,"اللهم إني أسألك الجنة، وأعوذ بك من النار.":61,"لا إله إلا الله العظيم الحليم، لا إله إلا الله رب العرش العظيم، لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم.":122,"اللهم رحمتك أرجو، فلا تكلني إلى نفسي طرفة عين، وأصلح لي شأني كله، لا إله إلا أنت.":123,"اللهم إني عبدك، ابن عبدك، ابن أمتك، ناصيتي بيدك، ماضٍ فيّ حكمك، عدلٌ فيّ قضاؤك، أسألك بكل اسم هو لك، سميت به نفسك، أو أنزلته في كتابك، أو علمته أحدًا من خلقك، أو استأثرت به في علم الغيب عندك، أن تجعل القرآن ربيع قلبي، ونور صدري، وجلاء حزني، وذهاب همي.":120,"اللهم إني أعوذ بك من الهم والحزن، والعجز والكسل، والبخل والجبن، وضَلَع الدَّين وغلبة الرجال.":121,"اللهم أعني على ذكرك، وشكرك، وحسن عبادتك.":59,"لا إله إلا أنت سبحانك إني كنت من الظالمين.":124,"اللهم صيّبًا نافعًا.":172,"سبحانك اللهم وبحمدك، أشهد أن لا إله إلا أنت، أستغفرك وأتوب إليك.":196,"«اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ، وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ»":136,"«اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ، وَشُكْرِكَ، وَحُسْنِ عِبَادَتِكَ»":59,"اللهم إني أسألك علمًا نافعًا، ورزقًا طيبًا، وعملًا متقبلًا.":73,"«اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا»":73,"الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ.":5,"أَسْتَغْفِرُ اللَّهَ، أَسْتَغْفِرُ اللَّهَ، أَسْتَغْفِرُ اللَّهَ. اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ.":66,"وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ، إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ، لَا شَرِيكَ لَهُ، وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِينَ، اللَّهُمَّ أَنْتَ الْمَلِكُ لَا إِلَهَ إِلَّا أَنْتَ، أَنْتَ رَبِّي وَأَنَا عَبْدُكَ، ظَلَمْتُ نَفْسِي، وَاعْتَرَفْتُ بِذَنْبِي، فَاغْفِرْ لِي ذُنُوبِي جَمِيعًا، إِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ، وَاهْدِنِي لِأَحْسَنِ الْأَخْلَاقِ، لَا يَهْدِي لِأَحْسَنِهَا إِلَّا أَنْتَ، وَاصْرِفْ عَنِّي سَيِّئَهَا، لَا يَصْرِفُ عَنِّي سَيِّئَهَا إِلَّا أَنْتَ، لَبَّيْكَ وَسَعْدَيْكَ، وَالْخَيْرُ كُلُّهُ فِي يَدَيْكَ، وَالشَّرُّ لَيْسَ إِلَيْكَ، أَنَا بِكَ وَإِلَيْكَ، تَبَارَكْتَ وَتَعَالَيْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ.":29,"اللَّهُمَّ رَبَّ جِبْرَائِيلَ وَمِيكَائِيلَ وَإِسْرَافِيلَ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، أَنْتَ تَحْكُمُ بَيْنَ عِبَادِكَ فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ، اهْدِنِي لِمَا اخْتُلِفَ فِيهِ مِنَ الْحَقِّ بِإِذْنِكَ، إِنَّكَ تَهْدِي مَنْ تَشَاءُ إِلَى صِرَاطٍ مُسْتَقِيمٍ.":30,"مِلْءَ السَّمَاوَاتِ، وَمِلْءَ الْأَرْضِ، وَمَا بَيْنَهُمَا، وَمِلْءَ مَا شِئْتَ مِنْ شَيْءٍ بَعْدُ، أَهْلَ الثَّنَاءِ وَالْمَجْدِ، أَحَقُّ مَا قَالَ الْعَبْدُ، وَكُلُّنَا لَكَ عَبْدٌ، اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ.":40,"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ.":67,"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ، لَا إِلَهَ إِلَّا اللَّهُ، وَلَا نَعْبُدُ إِلَّا إِيَّاهُ، لَهُ النِّعْمَةُ وَلَهُ الْفَضْلُ وَلَهُ الثَّنَاءُ الْحَسَنُ، لَا إِلَهَ إِلَّا اللَّهُ مُخْلِصِينَ لَهُ الدِّينَ وَلَوْ كَرِهَ الْكَافِرُونَ.":68,"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، يُحْيِي وَيُمِيتُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.":72,"سُبْحَانَ اللَّهِ (33)، وَالْحَمْدُ لِلَّهِ (33)، وَاللَّهُ أَكْبَرُ (34).":106,"رب اغفر لي وتب عليّ، إنك أنت التواب الرحيم.":195,"يضع يده على موضع الألم ويقول: بِسْمِ اللَّهِ (ثلاثًا)، ثم: أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ (سبع مرات).":243,"اللَّهُ أَكْبَرُ كَبِيرًا، وَالْحَمْدُ لِلَّهِ كَثِيرًا، وَسُبْحَانَ اللَّهِ بُكْرَةً وَأَصِيلًا.":31,"العاطس: الْحَمْدُ لِلَّهِ. ومن سمعه: يَرْحَمُكَ اللَّهُ. فيرد العاطس: يَهْدِيكُمُ اللَّهُ وَيُصْلِحُ بَالَكُمْ.":188,"يقول دعاء السفر ويزيد: آيِبُونَ، تَائِبُونَ، عَابِدُونَ، لِرَبِّنَا حَامِدُونَ.":207},e={"﴿رَبِّ اشْرَحْ لِي صَدْرِي ۝ وَيَسِّرْ لِي أَمْرِي ۝ وَاحْلُلْ عُقْدَةً مِّن لِّسَانِي ۝ يَفْقَهُوا قَوْلِي﴾":[[20,25,28]],"﴿رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا﴾":[[25,74,74]],"﴿رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا﴾":[[17,24,24]]},a="en"===window.__LANG;document.addEventListener("click",function(t){var e=t.target.closest&&t.target.closest(".gaud");if(e){t.stopPropagation(),t.preventDefault();try{e.dataset.gh?haPlay(["https://www.hisnmuslim.com/audio/ar/"+e.dataset.gh+".mp3"],e):playRefs(JSON.parse(e.dataset.gq),e)}catch(t){}}},!0);var r=0;new MutationObserver(function(){clearTimeout(r),r=setTimeout(pass,120)}).observe(document.body,{childList:!0,subtree:!0}),setTimeout(pass,700)}function pass(){document.querySelectorAll(".card .txt").forEach(function(r){var s=r.textContent.trim(),c=t[s],n=e[s];if(c||n){var i=r.closest(".card");if(!i.querySelector(".cpl")){var o=i.querySe  صَيِّبًا نَافِعًا»، وادعُ؛ فالدعاء تحت المطر من مواطن الإجابة.":"Say: “O Allah, make it a beneficial rain,” and make dua; dua during rain is a time of acceptance.","قل: «سُبْحَانَ الَّذِي يُسَبِّحُ الرَّعْدُ بِحَمْدِهِ وَالمَلَائِكَةُ مِنْ خِيفَتِهِ».":"Say: “Glory be to the One whom the thunder glorifies with His praise, and the angels out of fear of Him.”","قل: «اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا وَخَيْرَ مَا فِيهَا وَخَيْرَ مَا أُرْسِلَتْ بِهِ، وَأَعُوذُ بِكَ مِنْ شَرِّهَا…».":"Say: “O Allah, I ask You for its good, the good within it and the good it was sent with, and I seek refuge in You from its evil…”","افزع إلى ذكر الله ودعائه واستغفاره، وتصدّق — هكذا أرشد النبي ﷺ عند الآيات المخيفة. نسأل الله السلامة.":"Hasten to the remembrance of Allah, to dua and seeking forgiveness, and give charity — this is what the Prophet ﷺ taught at frightening signs. We ask Allah for safety.","اليوم الجمعة":"Today is Friday","ساعة يوم الجمعة":"The hour on Friday","من سنن الجمعة":"From the sunnahs of Friday","🕌 يوم الجمعة — غِراس":"🕌 Friday — Ghiras","🤲 ساعة الإجابة — غِراس":"🤲 The hour of acceptance — Ghiras","🌙 قيام الليل — غِراس":"🌙 Night prayer — Ghiras","ليلة الجمعة: أكثر من الصلاة على النبي ﷺ، واقرأ سورة الكهف.":"Friday night: send abundant blessings on the Prophet ﷺ, and read Surah Al-Kahf.","اقرأ سورة الكهف، وأكثر من الصلاة على النبي ﷺ.":"Read Surah Al-Kahf, and send abundant blessings on the Prophet ﷺ.","اغتسل وتطيّب، اقرأ سورة الكهف، أكثر من الصلاة على النبي ﷺ، وبكّر إلى الجمعة.":"Take a bath and wear perfume, read Surah Al-Kahf, send abundant blessings on the Prophet ﷺ, and go early to Jumuah.","اغتسل وتطيّب، وبكّر إلى صلاة الجمعة، وأنصت للخطبة.":"Take a bath and wear perfume, go early to the Jumuah prayer, and listen attentively to the khutbah.","آخر ساعة من يوم الجمعة بعد العصر: أكثر من الدعاء.":"The last hour of Friday after Asr: make plenty of dua.","ساعة الإجابة: أكثر من الدعاء قبل غروب الشمس.":"The hour of acceptance: make plenty of dua before sunset.","«فَالْتَمِسُوهَا آخِرَ سَاعَةٍ بَعْدَ العَصْرِ» — أكثر من الدعاء الآن.":"“Seek it in the last hour after Asr” — make plenty of dua now.","«يَنْزِلُ رَبُّنَا كُلَّ لَيْلَةٍ إِلَى السَّمَاءِ الدُّنْيَا حِينَ يَبْقَى ثُلُثُ اللَّيْلِ الآخِرُ، يَقُولُ: مَنْ يَدْعُونِي فَأَسْتَجِيبَ لَهُ؟» — قم وادعُ ولو بكلمات.":"“Our Lord descends every night to the lowest heaven when the last third of the night remains, and says: Who is calling upon Me, that I may answer him?” — get up and make dua, even with a few words.","«يَنْزِلُ رَبُّنَا كُلَّ لَيْلَةٍ إِلَى السَّمَاءِ الدُّنْيَا حِينَ يَبْقَى ثُلُثُ اللَّيْلِ الآخِرُ…» قم فصلِّ ولو ركعتين.":"“Our Lord descends every night to the lowest heaven when the last third of the night remains…” Get up and pray, even two rak‘ahs.","الثلث الأخير من الليل":"The last third of the night","قيام الليل والوتر":"Night prayer and witr","قيام الليل ووقته":"Night prayer and its time","ركعتا الضحى":"The two rak‘ahs of Duha","صلاة الفجر والعصر في وقتهما":"Praying Fajr and Asr on time","العشاء والفجر في جماعة":"Isha and Fajr in congregation","من 5 صلوات اليوم":"of 5 prayers today","من 7 ليالٍ هذا الأسبوع":"of 7 nights this week","دبر الصلوات المكتوبة":"After the obligatory prayers","عند الأذان وتحت المطر":"At the adhan and during rain","يقول مثل ما يقول المؤذن":"He repeats what the muezzin says","يصلي علي النبي":"Sends blessings on the Prophet","أيام فاضلة قادمة":"Virtuous days ahead","بداية شهر رمضان":"Beginning of Ramadan","العشر الأواخر من رمضان":"The last ten nights of Ramadan","العشر الأوائل من ذي الحجة":"The first ten days of Dhul-Hijjah","فيها ليلة القدر، خير من ألف شهر":"It contains Laylat al-Qadr, better than a thousand months","ليلة القدر":"Laylat al-Qadr","يوم عرفة":"The Day of Arafah","يوم عاشوراء":"The Day of Ashura","يوم تاسوعاء":"The Day of Tasu‘a","صيام ست من شوال":"Fasting six days of Shawwal","صيامه «يُكَفِّرُ السَّنَةَ المَاضِيَةَ وَالبَاقِيَةَ» — رواه مسلم":"Fasting it “expiates the past year and the coming year” — Reported by Muslim","صيامه «يُكَفِّرُ السَّنَةَ المَاضِيَةَ» — رواه مسلم":"Fasting it “expiates the past year” — Reported by Muslim","يُستحب صيامه مع عاشوراء — رواه مسلم":"It is recommended to fast it along with Ashura — Reported by Muslim","«مَا مِنْ أَيَّامٍ العَمَلُ الصَّالِحُ فِيهَا أَحَبُّ إِلَى اللَّهِ مِنْ هَذِهِ الأَيَّامِ» — رواه البخاري":"“There are no days in which righteous deeds are more beloved to Allah than these days” — Reported by al-Bukhari","«مَنْ صَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ» — متفق عليه":"“Whoever fasts Ramadan out of faith and seeking reward will have his past sins forgiven” — Agreed upon","«مَنْ صَامَ رَمَضَانَ ثُمَّ أَتْبَعَهُ سِتًّا مِنْ شَوَّالٍ كَانَ كَصِيَامِ الدَّهْرِ» — رواه مسلم":"“Whoever fasts Ramadan and follows it with six days of Shawwal, it is as if he fasted for a lifetime” — Reported by Muslim","إذا رأيت الهلال فقل: «اللَّهُمَّ أَهِلَّهُ عَلَيْنَا بِاليُمْنِ وَالإِيمَانِ، وَالسَّلَامَةِ وَالإِسْلَامِ، رَبِّي وَرَبُّكَ اللَّهُ».":"When you see the new moon, say: “O Allah, bring it over us with blessing and faith, safety and Islam. My Lord and your Lord is Allah.”","«أَحَبُّ الكَلَامِ إِلَى اللَّهِ أَرْبَعٌ…» — رواه مسلم":"“The most beloved words to Allah are four…” — Reported by Muslim","«احْرِصْ عَلَى مَا يَنْفَعُكَ، وَاسْتَعِنْ بِاللَّهِ، وَلَا تَعْجَزْ» — رواه مسلم.":"“Strive for what benefits you, seek help from Allah, and do not give up” — Reported by Muslim.","«حَلَّتْ لَهُ شَفَاعَتِي يَوْمَ القِيَامَةِ» — رواه البخاري":"“My intercession becomes due for him on the Day of Resurrection” — Reported by al-Bukhari","«غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ» — رواه الترمذي — حسن":"“His past sins are forgiven” — Reported by at-Tirmidhi — Hasan","«غُفِرَ لَهُ مَا كَانَ فِي مَجْلِسِهِ ذَلِكَ» — رواه الترمذي":"“Whatever happened in that gathering is forgiven for him” — Reported by at-Tirmidhi","«غُفِرَتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ البَحْرِ» — رواه مسلم":"“His sins are forgiven even if they were like the foam of the sea” — Reported by Muslim","«فَقَدْ أَبْلَغَ فِي الثَّنَاءِ» — رواه الترمذي":"“He has praised in the most complete way” — Reported by at-Tirmidhi","«لَقَدْ رَأَيْتُ اثْنَيْ عَشَرَ مَلَكًا يَبْتَدِرُونَهَا أَيُّهُمْ يَرْفَعُهَا» — رواه مسلم":"“I saw twelve angels racing to see which of them would take it up” — Reported by Muslim","«لَمْ يَدْعُ بِهَا رَجُلٌ مُسْلِمٌ فِي شَيْءٍ قَطُّ إِلَّا اسْتَجَابَ اللَّهُ لَهُ» — رواه الترمذي":"“No Muslim ever supplicates with it for anything but Allah answers him” — Reported by at-Tirmidhi","«لَمْ يَضُرَّهُ شَيْءٌ حَتَّى يَرْتَحِلَ مِنْ مَنْزِلِهِ ذَلِكَ» — رواه مسلم":"“Nothing will harm him until he leaves that place” — Reported by Muslim","«لَنْ يَزَالَ عَلَيْكَ مِنَ اللَّهِ حَافِظٌ، وَلَا يَقْرَبُكَ شَيْطَانٌ حَتَّى تُصْبِحَ» — رواه البخاري":"“A guardian from Allah will remain with you, and no devil will come near you until morning” — Reported by al-Bukhari","«مَنْ قَالَ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ فِي يَوْمٍ مِائَةَ مَرَّةٍ حُطَّتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ البَحْرِ» — متفق عليه":"“Whoever says ‘Glory be to Allah and praise be to Him’ a hundred times a day, his sins are wiped away even if they were like the foam of the sea” — Agreed upon","«مَنْ قَرَأَهَا دُبُرَ كُلِّ صَلَاةٍ مَكْتُوبَةٍ لَمْ يَمْنَعْهُ مِنْ دُخُولِ الجَنَّةِ إِلَّا أَنْ يَمُوتَ» — رواه النسائي في الكبرى — صحيح":"“Whoever recites it after every obligatory prayer, nothing prevents him from entering Paradise except death” — Reported by an-Nasa’i in al-Kubra — Sahih","«كُلُّ ابْنِ آدَمَ خَطَّاءٌ، وَخَيْرُ الخَطَّائِينَ التَّوَّابُونَ». توضأ، وصلِّ ركعتين، واستغفر الله، وابدأ من جديد. سقوطك لا يمحو الأيام التي جاهدت فيها.":"“Every son of Adam sins, and the best of sinners are those who repent.” Make wudu, pray two rak‘ahs, seek Allah’s forgiveness, and start again. Your fall does not erase the days you struggled.","أمر النبي ﷺ عقبة بن عامر أن يقرأ بالمعوذات دبر كل صلاة — رواه أبو داود":"The Prophet ﷺ ordered ‘Uqbah ibn ‘Amir to recite al-Mu‘awwidhat after every prayer — Reported by Abu Dawud","أمر بها النبي ﷺ: «إِذَا تَشَهَّدَ أَحَدُكُمْ فَلْيَسْتَعِذْ بِاللَّهِ مِنْ أَرْبَعٍ» — رواه مسلم":"The Prophet ﷺ commanded it: “When one of you finishes the tashahhud, let him seek refuge in Allah from four things” — Reported by Muslim","أوصى به النبي ﷺ معاذًا بعد كل صلاة — رواه أبو داود":"The Prophet ﷺ advised Mu‘adh to say it after every prayer — Reported by Abu Dawud","علّمه النبي ﷺ أبا بكر ليدعو به في صلاته — متفق عليه":"The Prophet ﷺ taught it to Abu Bakr to supplicate with in his prayer — Agreed upon","كان النبي ﷺ يقرؤها إذا قام من الليل — متفق عليه":"The Prophet ﷺ used to recite it when he got up at night — Agreed upon","رواه ابن حبان — قبل الامتحان أو أي أمر صعب":"Reported by Ibn Hibban — before an exam or any difficult matter","أشهد أن لا إله إلا الله وحده لا شريك له، وأشهد أن محمدًا عبده ورسوله — بعد الوضوء":"I bear witness that there is no god but Allah alone, without partner, and I bear witness that Muhammad is His servant and Messenger — after wudu","قال رسول الله ﷺ: «":"The Messenger of Allah ﷺ said: “","إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى.":"Actions are only by intentions, and everyone will have only what he intended.","خيركم من تعلم القرآن وعلمه.":"The best of you are those who learn the Quran and teach it.","الدين النصيحة.":"The religion is sincere advice.","الدعاء هو العبادة.":"Dua is worship.","الكلمة الطيبة صدقة.":"A good word is charity.","تبسمك في وجه أخيك لك صدقة.":"Your smile in the face of your brother is charity.","المسلم من سلم المسلمون من لسانه ويده.":"The Muslim is the one from whose tongue and hand the Muslims are safe.","الطهور شطر الإيمان، والحمد لله تملأ الميزان.":"Purity is half of faith, and ‘al-hamdu lillah’ fills the scale.","إن الله لا ينظر إلى صوركم وأموالكم، ولكن ينظر إلى قلوبكم وأعمالكم.":"Allah does not look at your appearance or your wealth, but He looks at your hearts and your deeds.","اتق الله حيثما كنت، وأتبع السيئة الحسنة تمحها، وخالق الناس بخلق حسن.":"Fear Allah wherever you are, follow a bad deed with a good one and it will erase it, and treat people with good character.","احرص على ما ينفعك، واستعن بالله ولا تعجز.":"Strive for what benefits you, seek help from Allah, and do not give up.","أحب الأعمال إلى الله أدومها وإن قلّ.":"The most beloved deeds to Allah are the most consistent, even if small.","اقرؤوا القرآن فإنه يأتي يوم القيامة شفيعًا لأصحابه.":"Read the Quran, for it will come on the Day of Resurrection as an intercessor for its companions.","الماهر بالقرآن مع السفرة الكرام البررة، والذي يقرأ القرآن ويتتعتع فيه وهو عليه شاق له أجران.":"The one skilled in the Quran will be with the noble, righteous scribes, and the one who reads the Quran and stumbles over it, finding it difficult, will have two rewards.","عجبًا لأمر المؤمن، إن أمره كله خير.":"How amazing is the affair of the believer; all of his affairs are good.","كلمتان خفيفتان على اللسان، ثقيلتان في الميزان، حبيبتان إلى الرحمن: سبحان الله وبحمده، سبحان الله العظيم.":"Two words light on the tongue, heavy on the scale, beloved to the Most Merciful: Glory be to Allah and praise be to Him, glory be to Allah the Magnificent.","لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه.":"None of you truly believes until he loves for his brother what he loves for himself.","لا يزال لسانك رطبًا من ذكر الله.":"Keep your tongue moist with the remembrance of Allah.","ليس الشديد بالصُّرَعة، إنما الشديد الذي يملك نفسه عند الغضب.":"The strong one is not the one who wrestles others down; the strong one is the one who controls himself when angry.","ما أكل أحد طعامًا قط خيرًا من أن يأكل من عمل يده.":"No one has ever eaten food better than what he eats from the work of his own hands.","مثل الذي يذكر ربه والذي لا يذكر ربه مثل الحي والميت.":"The example of the one who remembers his Lord and the one who does not is like the living and the dead.","من سلك طريقًا يلتمس فيه علمًا سهّل الله له به طريقًا إلى الجنة.":"Whoever takes a path seeking knowledge, Allah makes easy for him a path to Paradise.","من صلى البردين دخل الجنة.":"Whoever prays the two cool prayers (Fajr and Asr) will enter Paradise.","من قرأ حرفًا من كتاب الله فله به حسنة، والحسنة بعشر أمثالها.":"Whoever reads a letter from the Book of Allah gets a good deed, and a good deed is multiplied ten times.","من كان يؤمن بالله واليوم الآخر فليقل خيرًا أو ليصمت.":"Whoever believes in Allah and the Last Day, let him speak good or remain silent.","من لا يَرحم لا يُرحم.":"Whoever does not show mercy will not be shown mercy.","نعمتان مغبون فيهما كثير من الناس: الصحة والفراغ.":"Two blessings many people lose out on: health and free time.","يسّروا ولا تعسّروا، وبشّروا ولا تنفّروا.":"Make things easy and do not make them difficult; give good news and do not drive people away.","يُقال لصاحب القرآن: اقرأ وارتقِ ورتّل كما كنت ترتل في الدنيا، فإن منزلتك عند آخر آية تقرؤها.":"It will be said to the companion of the Quran: Read, rise, and recite as you used to recite in the world, for your rank is at the last ayah you recite.","من ترك شيئًا لله عوّضه الله خيرًا منه.":"Whoever leaves something for Allah, Allah will replace it with something better.","إذا ضاق صدرك، فافتح المصحف قبل أن تفتح الهاتف.":"When your chest feels tight, open the Mushaf before you open your phone.","أتقن عملك ودراستك؛ فالإتقان عبادة يحبها الله.":"Perfect your work and study; excellence is worship that Allah loves.","أفضل وقت لبدء حفظ القرآن كان قبل سنوات، وثاني أفضل وقت هو اليوم.":"The best time to start memorizing the Quran was years ago; the second best time is today.","أمك تدعو لك وأنت نائم؛ فلا تنسَ أن تدعو لها وأنت ساجد.":"Your mother prays for you while you sleep; do not forget to pray for her while you prostrate.","ابتسامتك في وجه أخيك صدقة؛ والنية تجعل العادات عبادات.":"Your smile at your brother is charity; intention turns habits into worship.","الثبات ليس ألّا تسقط أبدًا، بل أن تقوم كلما سقطت.":"Steadfastness is not never falling, but getting up every time you fall.","الحرام قد يمنحك لذة دقائق، ثم يأخذ منك سلام القلب أيامًا.":"The haram may give you minutes of pleasure, then take away your peace of heart for days.","الدعاء سلاح لا يُهزم؛ ادعُ وأنت موقن بالإجابة.":"Dua is a weapon that is never defeated; supplicate while certain of the answer.","الذنب الذي تتوب منه بصدق، قد يكون سبب قربك من الله أكثر من قبل.":"A sin you sincerely repent from may become the reason you are closer to Allah than before.","الشباب فرصة لن تتكرر؛ القوة والوقت والصحة الآن، لا بعد عشرين سنة.":"Youth is a chance that will not return; strength, time and health are now, not twenty years from now.","الشيطان لا يقول لك «لا تتب أبدًا»، بل يقول «تب غدًا». فلا تؤجّل.":"Shaytan does not tell you “never repent”, he says “repent tomorrow”. So do not delay.","الصلاة في وقتها رسالة لله: «أنت أهم من أي شيء عندي».":"Praying on time is a message to Allah: “You matter more to me than anything.”","القلب يقسو بكثرة الذنوب والكلام، ويلين بالقرآن والذكر والدمعة في الخلوة.":"The heart hardens with many sins and much talk, and softens with the Quran, dhikr and tears in private.","الله يفرح بتوبتك أكثر من فرحك بأحب شيء تجده بعد أن فقدته.":"Allah rejoices at your repentance more than you rejoice at finding your most beloved thing after losing it.","تعلّم دينك من العلماء الثقات، لا من مقاطع قصيرة مجهولة.":"Learn your religion from trustworthy scholars, not from unknown short clips.","ركعتان في جوف الليل لا يراك فيهما إلا الله، قد تغيّران حياتك كلها.":"Two rak‘ahs in the depth of the night, seen by no one but Allah, may change your whole life.","صديقك اليوم هو صورتك بعد عشر سنوات؛ فاختره بعناية.":"Your friend today is who you will be in ten years; so choose carefully.","غدًا ستنظر إلى هذه الأيام: إما بفخر أنك جاهدت، أو بحسرة أنك ضيّعت.":"Tomorrow you will look back at these days: either proud that you struggled, or regretful that you wasted them.","كل مرة تغض بصرك، أنت تختار الله على شهوتك. هذا ليس قليلًا.":"Every time you lower your gaze, you choose Allah over your desire. That is not small.","كل يوم بلا ذنبٍ تتركه، يوم تقترب فيه من نسخة أفضل منك.":"Every day you stay away from a sin is a day you get closer to a better version of yourself.","كلمة «أستغفر الله» من قلب صادق تمسح ما لا تتخيّله.":"Saying “Astaghfirullah” from a sincere heart wipes away more than you can imagine.","كن أنت الصديق الذي يذكّر بالله، لا الذي يُذكَّر.":"Be the friend who reminds others of Allah, not the one who needs reminding.","لا تقارن بدايتك بنهاية غيرك؛ كلٌّ له طريقه ووقته.":"Do not compare your beginning with someone else’s end; everyone has their own path and time.","لا تنتظر أن «تتغيّر» حتى تصلي؛ صلِّ لتتغيّر.":"Do not wait to “change” before you pray; pray so that you change.","لن تجد قلبًا أرحم بك من الله؛ فارجع إليه مهما ابتعدت.":"You will not find anyone more merciful to you than Allah; so return to Him however far you have gone.","من حفظ الله في شبابه، حفظه الله في كبره.":"Whoever guards Allah’s limits in his youth, Allah will guard him in his old age.","هاتفك يمكن أن يكون مصحفًا في جيبك، أو بابًا للحرام. أنت تختار.":"Your phone can be a Mushaf in your pocket or a door to the haram. You choose.","بدأ التحدّي — أعانك الله":"The challenge has started — may Allah help you","بدأ العدّاد — ثبّتك الله":"The counter has started — may Allah keep you firm","ثبّتك الله، وجزاك خيرًا على جهادك":"May Allah keep you firm and reward you for your struggle","سقطتُ… أبدأ من جديد":"I fell… starting again","أحسنت! ثبّتك الله":"Well done! May Allah keep you firm","أحسنت، أنت على الطريق. زِد قليلًا هذا الأسبوع.":"Well done, you are on the path. Do a little more this week.","ما شاء الله، أسبوع مبارك! استمر.":"Masha’Allah, a blessed week! Keep going.","بداية طيبة. «أَحَبُّ الأَعْمَالِ إِلَى اللَّهِ أَدْوَمُهَا وَإِنْ قَلَّ».":"A good start. “The most beloved deeds to Allah are the most consistent, even if small.”","يومًا من التحدّي. «أَحَبُّ الأَعْمَالِ إِلَى اللَّهِ أَدْوَمُهَا وَإِنْ قَلَّ».":"days of the challenge. “The most beloved deeds to Allah are the most consistent, even if small.”","أتممت خطوات هذا الأسبوع، بارك الله
